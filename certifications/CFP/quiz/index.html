 {id:"R1",t:1,q:"◆2002年に加入し、毎年4月1日に自動更新する1年契約の団体定期保険。2025年分の生命保険料控除は新制度・旧制度のどちらで計算する?",c:["旧制度（2011年12月31日以前の加入だから）","新制度（更新のたびに新たな契約とみなすため）","契約者がどちらか有利な方を選択できる","団体定期保険は生命保険料控除の対象外"],a:1,e:"★【自動更新される契約は、更新のたびに新契約とみなす】＝加入が2002年でも【新制度】で計算する。定期保険特約の更新・団体定期の自動更新はすべてこの扱い。★2026-1 Q6の真の失点原因はここ。旧制度で計算→合計が選択肢に合わない→辻褄合わせに医療保険を対象外と判断、という連鎖で誤答した。【入口の1つの判定を誤ると、後段の正しい処理まで捨てることになる】。",s:"2026-1 Q6（真因＝自動更新の判定）★Tier1"},
 {id:"R2",t:1,q:"◆損害保険会社が販売する医療保険の保険料は、生命保険料控除のどの区分に入るか?",c:["損保会社の商品なので生命保険料控除の対象外","一般生命保険料控除","介護医療保険料控除","地震保険料控除"],a:2,e:"★【介護医療保険料控除】。生命保険料控除の区分は【引受会社ではなく保障内容】で決まるので、損保会社の医療保険・がん保険も介護医療の対象になる。★介護医療保険料控除は【新制度のみ】に存在する区分（旧制度には一般と個人年金の2つしかない）。★個人年金保険料控除に入れられるのは【個人年金保険料税制適格特約が付加された契約】だけ。特約がなければ一般に入る。",s:"2026-1 Q6★Tier1"},
 {id:"R3",t:1,q:"◆終身保険の2025年9月以降の保険料14,000円が、保険料自動振替貸付により充当された。この14,000円の生命保険料控除上の扱いは?",c:["その年に支払った保険料として控除の対象になる","実際に現金で支払っていないため控除の対象外","貸付金を返済した年の控除の対象になる","半額のみが控除の対象になる"],a:0,e:"★【自動振替貸付で充当された保険料も、その年に支払った保険料として控除対象】。解約返戻金を原資に保険会社が立て替えて払い込んでいるので、支払いはあったものとして扱う（返済時には二重に控除しない）。★前納保険料はその年に対応する分だけ、一時払は払い込んだ年に全額。【いつの分か・いくら払ったか】を先に確定させる。",s:"2026-1 Q6★Tier1"},
 {id:"R4",t:2,q:"◆一般生命保険料控除で、新制度の契約と旧制度の契約の両方の保険料を払っている場合、その区分の控除額の上限は?",c:["新4万円＋旧5万円＝9万円","常に旧制度の5万円","常に新制度の4万円","新のみで計算（上限4万円）・旧のみで計算（上限5万円）・新旧合算（上限4万円）の3通りのうち最も有利な額"],a:3,e:"★一般・個人年金の各区分ごとに【新のみ4万／旧のみ5万／併用は合計4万】の3通りを比べて【最も有利な額】を採る。旧契約の保険料が大きいときは【旧のみ5万】が勝つことが多い。★全体の合計上限は12万円（旧のみで一般＋個人年金なら10万円）。住民税は各2.8万・合計7万。",s:"2026-1 Q6（有利判定）"},
 {id:"R5",t:1,q:"◆【2026-1 Q6の設例】①団体定期(2002年・毎年4/1自動更新)24,000円 ②医療保険(2015年・損保会社の商品)36,000円 ③終身保険(2010年)42,000円※うち14,000円は自動振替貸付で充当 ④個人年金(2008年・税制適格特約付)48,000円。所得税の生命保険料控除額は?（控除が最大になる組合せ）",c:["76,500円","104,500円","106,000円","120,000円"],a:1,e:"【手順＝計算式より先に区分を仕分ける】①団体定期は自動更新→【新・一般】24,000／②損保の医療保険→【新・介護医療】36,000／③終身は2010年→【旧・一般】42,000（自動振替貸付分も含めて全額）／④税制適格特約付→【旧・個人年金】48,000。★一般＝新24,000→22,000（24,000×1/2+10,000）と旧42,000→33,500（42,000×1/2+12,500）の併用55,500→【上限40,000】。★介護医療＝36,000×1/2+10,000＝【28,000】。★個人年金(旧)＝48,000×1/2+12,500＝【36,500】。★合計【104,500円】。★誤答76,500＝①を旧制度と誤り、合わないので②を対象外にした（40,000+36,500）＝2026-1の実際の失点。",s:"2026-1 Q6（実際に失点した設例）★Tier1"},
 {id:"R6",t:1,q:"◆企業型確定拠出年金(企業型DC)から年金として受け取る給付の、所得税法上の取扱いは?",c:["雑所得。拠出金の総額を必要経費として按分控除する","一時所得","雑所得(公的年金等)。公的年金等控除を適用する","退職所得"],a:2,e:"★【DC(企業型・iDeCo)の年金給付は公的年金等】＝老齢基礎・老齢厚生と合算して公的年金等控除を引く。拠出金を必要経費として按分するのは【生保・損保の私的年金（個人年金保険・収入保障年金）】だけ。★同じく公的年金等に入るもの＝確定給付企業年金・厚生年金基金・小規模企業共済の分割受取。★DCを一時金で受け取れば【退職所得】。★2026-1 Q7では、個人年金の必要経費が出せずに数字が合わなかった結果、このDCを私的年金側に回して辻褄を合わせ誤答した。",s:"2026-1 Q7★Tier1"},
 {id:"R7",t:1,q:"◆10年保証期間付終身年金（65歳男性・支給開始日における余命年数15年）の雑所得を計算するとき、必要経費の分母となる「年金の総支給見込額」は?",c:["年金年額×10年（保証期間）","年金年額×15年（余命年数と保証期間のいずれか長い方）","年金年額×25年（保証期間＋余命年数）","年金年額×余命年数の1/2"],a:1,e:"★保証期間付終身年金の総支給見込額＝【年金年額×(余命年数と保証期間のいずれか長い方)】。余命15年＞保証10年なので15年。★このとき年金年額に使うのは【基本年金＋増額年金】で、【配当金は含めない】（配当は収入には入るが見込額の計算基礎には入れない）。★確定年金なら支給期間、有期年金なら支給期間と余命の短い方。【どの年金の型か】を最初に判定する。",s:"2026-1 Q7（必要経費の分母）★Tier1"},
 {id:"R8",t:1,q:"◆個人年金保険（私的年金）の雑所得を求める算式として正しいものは?",c:["雑所得＝年金収入額−（年金年額×払込保険料総額÷年金の総支給見込額）","雑所得＝年金収入額−払込保険料総額","雑所得＝（年金収入額−払込保険料総額）×1/2","雑所得＝年金収入額−公的年金等控除額"],a:0,e:"【3ステップで固定する】①総支給見込額＝基本年金額×(余命年数と保証期間の長い方)／②必要経費割合＝払込保険料総額÷①（設問指定の端数処理。2026-1は小数第3位切上げ・第2位まで＝400÷525＝0.7619→【0.77】）／③必要経費＝年金年額×②　→　雑所得＝年金収入（配当を含む）−③。★2026-1 Q7＝36万−35万×0.77＝36−26.95＝【9.05万円】。★払込保険料総額をそのまま全額引くのは満期保険金の一時所得の考え方＝年金では使わない。★雑所得が25万円以上なら10.21%の源泉徴収。",s:"2026-1 Q7（必要経費の算式）★Tier1"},
 {id:"R9",t:1,q:"◆勤労者財産形成年金貯蓄（財形年金貯蓄）から受け取る年金について、非課税制度の適用要件を満たしている場合の雑所得の金額は?",c:["年金額の全額","年金額−（年金額×預入金総額÷年金総額）","年金額×1/2","0円（非課税）"],a:3,e:"★要件を満たす財形年金貯蓄の年金は【非課税】＝雑所得の計算に一切入れない（財形住宅も同じ）。★非課税枠＝財形年金と財形住宅を合わせて元利合計550万円（保険型の財形年金は払込額385万円）。要件を外れると遡って課税されるので、設問に【非課税制度の適用要件を満たしている】と書いてあるかを必ず確認する。★2026-1 Q7では④の54万円を計算に入れてはいけない。",s:"2026-1 Q7★Tier1"},
 {id:"R10",t:1,q:"◆【2026-1 Q7の設例】66歳男性。①老齢厚生＋老齢基礎160万円 ②企業型DCに基づく企業年金100万円(受取期間20年・拠出金総額500万円) ③個人年金(10年保証期間付終身・65歳開始・男性の余命15年)36万円〈基本＋増額35万円・配当1万円／既払込400万円〉 ④財形年金貯蓄54万円(要件充足)。2025年分の雑所得は?〈公的年金等控除：65歳以上・330万円以下＝110万円／必要経費率は小数第3位切上げ〉",c:["134.05万円","159.00万円","159.05万円","164.05万円"],a:2,e:"【手順①3分類する】公的年金等＝①160＋②100＝【260万】／私的年金＝③／非課税＝④（計算に入れない）。【手順②公的年金等】260万−110万＝【150万】。【手順③私的年金】総支給見込額＝35万×15年（余命＞保証）＝525万 → 割合＝400÷525＝0.7619→【0.77】 → 必要経費＝35万×0.77＝26.95万 → 36万−26.95万＝【9.05万】。【手順④】150＋9.05＝【159.05万円】。★誤答134.05＝②のDCを私的年金として100−25（500÷2000で按分）＝75万と処理した実際の失点。★164.05＝④財形を課税扱いした場合に近づく誤り。",s:"2026-1 Q7（実際に失点した設例）★Tier1"},
 {id:"R11",t:1,q:"◆一時払終身保険を加入から4年9ヵ月後に解約し、解約返戻金900万円（払込800万円）を受け取った。課税関係は?",c:["金融類似商品として20.315%の源泉分離課税","雑所得","非課税","一時所得として総合課税"],a:3,e:"★金融類似商品になるのは【①一時払等 かつ ②保険期間5年以下または5年以内の解約 かつ ③満期・確定給付のある商品（養老・変額(有期)・確定年金など）】の3つを全部満たす場合。★【一時払の『終身』保険は③を満たさない】（満期がない）＝5年以内に解約しても【一時所得】。ここが最頻の引っかけ。★一時払養老保険を5年以内に解約すれば源泉分離になる、との対比で覚える。",s:"2026-1 Q8（④を除外した失点）★Tier1"},
 {id:"R12",t:1,q:"◆月払いで保険料を払ってきた変額保険（有期型）を、加入から3年6ヵ月後に解約した場合の課税関係は?",c:["5年以内の解約なので源泉分離課税","一時払等ではないため一時所得","雑所得","非課税"],a:1,e:"★金融類似商品の第1要件は【一時払『等』】＝一時払のほか、契約日から5年以内に保険料総額の大半を前納するような払い方を指す。【月払いは該当しない】ので、変額保険(有期)でも3年6ヵ月で解約すれば【一時所得】。★判定は必ず【払い方→期間→商品の型】の順に3つとも確認する。1つでも欠ければ一時所得。",s:"2026-1 Q8★Tier1"},
 {id:"R13",t:1,q:"◆父が保険料300万円を払った時点で契約者(保険料負担者)を子へ変更し、その後子が300万円を払って満期保険金800万円を受け取った（払込総額600万円・相続や遺贈による変更ではなく父は生存）。子の一時所得の計算として正しいものは?",c:["収入800万円×(子負担300万円÷総額600万円)＝400万円 から子負担300万円を控除して100万円（残り400万円は父からの贈与）","収入800万円−払込総額600万円＝200万円","収入800万円−父負担分300万円＝500万円","全額が贈与税の対象で一時所得は生じない"],a:0,e:"★保険料負担者が途中で変わった満期保険金は【負担割合で按分】する。★子の一時所得＝満期金×(子の負担額÷総払込額)−子の負担額＝800×1/2−300＝【100万円】。★残りの400万円（＝父が負担した部分に対応する保険金）は【父からの贈与＝贈与税】。★誤答の道＝払込総額600万円を丸ごと引いて200万円とする（2026-1 Q8）。【誰がいくら払ったか】を先に書き出す。",s:"2026-1 Q8（①の算出ロジック）★Tier1"},
 {id:"R14",t:1,q:"◆生前給付保険から受け取った特定疾病保険金200万円（払込保険料70万円）の課税関係は?",c:["一時所得（200万円−70万円）として課税","雑所得","非課税。一時所得の計算に含めない","源泉分離課税"],a:2,e:"★【身体の傷害・疾病に基因して受け取る給付は非課税】＝特定疾病保険金・入院給付金・手術給付金・高度障害保険金・リビングニーズ特約の特定状態保険金など。一時所得の集計から【最初に除外する】。★対比：解約返戻金・満期保険金・死亡保険金は非課税ではない。★リビングニーズで受け取った後に被保険者が死亡し未使用分が残れば、その残額は相続財産（現金）になる。",s:"2026-1 Q8★Tier1"},
 {id:"R15",t:1,q:"◆【2026-1 Q8の設例】①養老保険 満期800万(払込600万・うち父負担300万で契約者変更・父は生存) ②生前給付の特定疾病保険金200万(払込70万) ③変額保険(有期・月払)解約返戻金350万(払込250万・3年6ヵ月) ④一時払終身 解約返戻金900万(払込800万・4年9ヵ月) ⑤終身保険(被保険者＝母)死亡保険金500万(払込350万)。総所得金額に算入すべき一時所得の金額は?",c:["125万円","150万円","200万円","250万円"],a:2,e:"【契約ごとに3問を機械的に処理する】①按分→800×(300/600)−300＝【100万】②身体の傷害に基因→【非課税＝除外】③月払なので金融類似商品でない→350−250＝【100万】④一時払だが終身＝金融類似商品でない→900−800＝【100万】⑤契約者＝受取人＝本人・被保険者＝母→500−350＝【150万】。★合計450万−特別控除50万＝400万 → ×1/2＝【200万円】。★誤答250万＝①を800−600＝200万としたケース、または④を除外して他を過大に見たケース＝2026-1の実際の失点（2論点が重なった）。",s:"2026-1 Q8（実際に失点した設例）★Tier1"},
 {id:"R16",t:2,q:"◆一時所得の総所得金額への算入額を求める式は?",c:["収入金額−収入を得るために支出した金額−特別控除50万円","（収入金額−支出した金額）×1/2−特別控除50万円","収入金額×1/2−支出した金額","（収入金額−収入を得るために支出した金額−特別控除50万円）×1/2"],a:3,e:"★【まず全部の一時所得を合算してから、特別控除50万円を1回だけ引き、最後に1/2】。契約ごとに50万円を引いたり、1/2してから引いたりしない。★複数の保険金がある設問では【合算→−50万→×1/2】の順序が固定。★同じ年に他の一時所得（懸賞金など）があれば、それも合算したうえで特別控除は1回。",s:"一時所得の算式（2026-1 Q8の土台）"},
 {id:"R17",t:1,q:"★計算問題で自分の答えが選択肢のどれにも一致しないとき、最初にすべきことは?",c:["どこかの項目を除外・追加して、選択肢に合う数字を作る","区分の仕分け（新旧・控除区分・該当/非該当・誰が負担したか）を1つずつ読み直す","最も近い選択肢を選んで次へ進む","算式そのものを別の式に置き換えて試す"],a:1,e:"★2026-1のQ6・Q7・Q8はいずれも【ロジックが不確か→合わない→選択肢に合う数字を作りにいく】という同じ連鎖で失点した。★4択は【誤答肢もそれらしい数字で作られている】ため、数字合わせは高確率で誤答肢に着地する。しかも時間を大きく失う（Q5-8の4問に27分＝全体の22.5%を使って1問しか取れなかった）。★見直しの優先順は【①区分の仕分け →②単位・端数処理 →③算式】。仕分けの誤りは算式の誤りより圧倒的に多い。★それでも合わなければ【捨てて次へ】＝曖昧な数字合わせの答えは捨て問と同じ期待値なのに時間だけ失う。★演習中に「合わないので〇〇を除外した」と考えた問題には印をつけ、採点後は正誤にかかわらず全ステップを再現する。",s:"2026-1 Q6/Q7/Q8に共通する失点構造（本人申告で判明）★Tier1"},
 {id:"R18",t:1,q:"◆死亡保険金の非課税限度額（500万円×法定相続人の数）を各人に按分するとき、算式の分母（保険金の合計額）に含めるのはどれか?",c:["被相続人が契約していたすべての保険金","相続人以外（孫など）が受け取った保険金も含む","相続放棄をした人が受け取った保険金も含む","相続人が受け取った保険金の合計のみ"],a:3,e:"★非課税枠を使えるのは【相続人】だけ。相続を放棄した人・相続人でない孫や内縁者が受け取った保険金は、按分の【分母にも入れない】し、その人に枠も配分されない。★各人の課税対象＝受取額−非課税枠×(その人の受取額÷【相続人が受け取った保険金の合計】)。★紛らわしい点：法定相続人の【数】には放棄者も算入する（枠の大きさは変わらない）が、【按分の分母】には放棄者や相続人以外の受取額を入れない。この2つは別の話。",s:"2026-1 Q20★Tier1"},
 {id:"R19",t:1,q:"◆被相続人の死亡により、相続人が生命保険金と死亡退職金の両方を受け取った。相続税の非課税限度額の扱いとして正しいものは?",c:["生命保険金と死亡退職金のそれぞれに500万円×法定相続人の数の枠がある","両方合わせて500万円×法定相続人の数が上限","死亡退職金には非課税枠がない","いずれか有利な一方にのみ適用できる"],a:0,e:"★【別枠】。生命保険金に500万×人数、死亡退職金にも500万×人数。法定相続人4人なら【2,000万円ずつ・合計4,000万円】が非課税になる。合算して1つの枠にしないこと。★どちらも【相続人が受け取った場合のみ】適用（相続人以外は不可）。★弔慰金はさらに別扱い（業務上＝報酬月額×36ヵ月／業務外＝×6ヵ月までが非課税、超過分は死亡退職金に合算して退職金の枠で処理）。",s:"2026-1 Q20★Tier1"},
 {id:"R20",t:1,q:"◆会社が受け取った死亡保険金を原資に死亡退職金を支払う。相続税の課税対象額を計算するとき、誰がその死亡退職金を受け取ったものとして扱うか?",c:["相続人が法定相続分で按分して受け取ったものとする","会社の役員退職慰労金規程が定める受給順位（配偶者を第一順位など）で決まる","会社が自由に決められるので判定できない","必ず被相続人の遺言による"],a:1,e:"★【規程の受給順位】で受給者が決まる（労働基準法施行規則42〜45条に準拠し、配偶者を第一順位、次に子・父母・孫・祖父母・兄弟姉妹…と定めるのが一般的）。★設例では規程の条文が資料に載っているので、【按分の前に誰が受け取るかを確定させる】。26-1 Q20では配偶者の里花さんが9,000万円を全額受給した。★同順位者が複数いるときは代表者に支給、と定める規程が多い。",s:"2026-1 Q20★Tier1"},
 {id:"R21",t:1,q:"◆役員が業務外の事由で死亡し、会社が弔慰金を支給した。相続税法上、非課税として扱われる弔慰金の限度額は?",c:["死亡時の報酬月額×36ヵ月","死亡退職金の額の1/2","死亡時の報酬月額×6ヵ月","一律500万円"],a:2,e:"★【業務上の死亡＝報酬月額×36ヵ月／業務外の死亡＝報酬月額×6ヵ月】までが弔慰金として非課税。覚え方＝業務上は3年分・業務外は半年分。★これを超える部分は【死亡退職金】として扱い、退職金の非課税枠（500万×法定相続人の数）の対象に入れる。★設問で『弔慰金は全額非課税とする』と指定されていれば、その額は課税対象額の計算から外す。",s:"2026-1 Q20★Tier1"},
 {id:"R22",t:1,q:"◆【2026-1 Q20の設例】義則さん（相続人＝妻里花・長男孝介・二男・三男の4人）の死亡で支払われる生命保険金＝①受取人:妻里花3,000万 ②受取人:長男孝介5,000万 ③受取人:孫数馬1,000万 ④受取人:孫琴美1,000万（孫2人は相続人ではない）。別に会社が受け取る死亡保険金1億円のうち1,000万を弔慰金（全額非課税）、残り9,000万を死亡退職金として規程により妻里花へ全額支給。里花さんの相続税の課税対象額（非課税金額控除後）は?",c:["9,250万円","9,400万円","10,250万円","10,400万円"],a:0,e:"【4ステップ】①法定相続人＝【4人】。②生命保険金：枠＝500万×4＝2,000万を【相続人が受け取った分だけを分母に】按分 → 里花＝2,000万×3,000/(3,000+5,000)＝【750万】→ 課税分3,000−750＝【2,250万】（孫の1,000万×2は分母に入れず、孫は枠を使えない）。③死亡退職金：【別枠】500万×4＝2,000万を里花が全額適用 → 9,000−2,000＝【7,000万】。④弔慰金1,000万は全額非課税＝計算に入れない。★合計【9,250万円】。★誤答9,400万＝②の分母に孫の2,000万を入れた場合（2,000×3,000/10,000＝600 → 2,400+7,000）＝26-1の実際の失点。",s:"2026-1 Q20（実際に失点した設例）★Tier1"},
 {id:"R23",t:1,q:"◆保険料負担者である父が、被保険者である長男より先に死亡した。相続財産となる『生命保険契約に関する権利』の相続税評価額の求め方は?",c:["死亡保険金額をそのまま評価額とする","相続開始時の解約返戻金の額＋前納保険料＋積立配当金−源泉徴収されるべき所得税額","払込済保険料の総額","解約返戻金の額のみ"],a:1,e:"★被保険者は生きているので【死亡保険金は支払われない】。相続人が承継するのは『保険契約という財産』で、評価は【解約返戻金を基礎に、前納保険料と剰余金・積立配当金を加え、源泉徴収されるべき所得税額を引く】。★資料に死亡保険金額が併記されていても【使わない＝ダミー】。★掛け捨ての定期保険など解約返戻金のない契約は評価額ゼロになることもある。★契約者と保険料負担者が異なる場合、評価されるのは【保険料負担者】の財産として。",s:"2026-1 Q21★Tier1"},
 {id:"R24",t:1,q:"◆【2026-1 Q21の設例】契約者（保険料負担者）＝義則さん・被保険者＝長男の孝介さん・死亡保険金受取人＝義則さん、の契約について義則さんが孝介さんより先に死亡した。義則さん死亡時の状況＝死亡保険金額2,000万円／相続開始時の解約返戻金額1,100万円／相続開始時の前納保険料の金額100万円／相続開始時の積立配当金の金額50万円（源泉徴収されるべき所得税等はない）。この生命保険契約に関する権利の相続税評価額は?",c:["1,050万円","1,100万円","1,250万円","2,000万円"],a:2,e:"【手順】①被保険者の孝介さんは【生存】→死亡保険金2,000万は支払われない＝【ダミー】。②評価＝解約返戻金1,100＋前納保険料100＋積立配当金50−源泉所得税0＝【1,250万円】。★誤答1,100＝解約返戻金だけで止めた／2,000＝死亡保険金額を使った。★『足すもの3つ・引くもの1つ』と手が覚えるまで反復する。",s:"2026-1 Q21（実際に失点した設例）★Tier1"},
 {id:"R25",t:1,q:"◆2019年7月8日以後に契約した保険期間3年以上の定期保険で、最高解約返戻率が50%以下の場合の経理処理は?",c:["支払保険料の全額を損金算入する","支払保険料の40%を資産計上する","支払保険料の60%を資産計上する","支払保険料×最高解約返戻率×90%を資産計上する"],a:0,e:"★最高解約返戻率【50%以下＝全額損金】。資産計上は不要。★あわせて全額損金にできるケース＝①【50%超70%以下】かつ【1被保険者あたりの年換算保険料が30万円以下】②保険期間3年未満。★手順の第一歩は『50%以下か』『30万円以下の例外か』の確認。ここを通過してから区分表に入る。",s:"2026-1 Q27（区分の暗記）★Tier1"},
 {id:"R26",t:1,q:"◆最高解約返戻率が70%（50%超70%以下）の定期保険。資産計上期間と資産計上額の組合せとして正しいものは?",c:["保険期間の当初4割の期間・支払保険料の60%","保険期間の当初6割の期間・支払保険料の40%","保険期間の当初4割の期間・支払保険料の40%","保険期間の全期間・支払保険料の40%"],a:2,e:"★【50%超70%以下＝当初4割の期間に、支払保険料の40%を資産計上】（残り60%が損金）。★取崩しは【保険期間の75%相当期間を経過した後】から保険期間終了日まで均等に取り崩す。★70%超85%以下も資産計上期間は同じ【当初4割】・取崩しも同じ【75%経過後】で、率だけ【60%】に上がる。★資産計上の科目は【前払保険料】、損金分は支払保険料（定期保険料）。",s:"2026-1 Q27（区分の暗記）★Tier1"},
 {id:"R27",t:1,q:"◆最高解約返戻率が80%（70%超85%以下）の定期保険。当初の資産計上額は支払保険料の何%か?",c:["40%","60%","90%","最高解約返戻率×90%"],a:1,e:"★【70%超85%以下＝支払保険料の60%を資産計上】（損金は40%）。資産計上期間は【保険期間の当初4割】、取崩しは【75%相当期間経過後】から均等。★ここまでの2区分は【定率（40%・60%）】で、最高解約返戻率そのものは式に出てこない。★最高解約返戻率を式に掛けるのは【85%超】だけ＝ここが区分間の構造上の分かれ目で、最も間違えやすい。",s:"2026-1 Q27（区分の暗記）★Tier1"},
 {id:"R28",t:1,q:"◆最高解約返戻率が88.4%（85%超）の定期保険。契約から6年目（当初10年以内）に支払った保険料の資産計上額の算式は?",c:["支払保険料×90%","支払保険料×85%×90%","支払保険料×最高解約返戻率×70%","支払保険料×最高解約返戻率×90%"],a:3,e:"★【85%超】＝当初10年間は【支払保険料×最高解約返戻率×90%】、【11年目以降】は【×70%】。掛けるのは区分の下限85%ではなく【その契約の実際の最高解約返戻率（88.4%）】。★★最頻の誤記憶＝【『保険料の90%』】。90%は【最高解約返戻率に掛ける】係数であって、保険料に直接掛けるものではない。式は必ず【保険料 →×最高解約返戻率 →×90%】の3段で書き下すこと（頭の中で1段に縮めると必ずどこかが落ちる）。★資産計上期間は【最高解約返戻率となる期間の終了日まで】（その後も解約返戻金の増加割合が7割を超える期間があればその終了日まで／最低5年／保険期間10年未満は保険期間の1/2）。★取崩しは【解約返戻金相当額が最も高い金額となる期間を経過した後】から保険期間終了日まで均等。",s:"2026-1 Q27（区分の暗記）★Tier1"},
 {id:"R29",t:1,q:"◆最高解約返戻率が65%、1被保険者あたりの年換算保険料が28万円の定期保険（2019年7月8日以後契約・保険期間20年）の経理処理は?",c:["支払保険料の全額を損金算入できる","当初8年間は40%を資産計上する","当初8年間は60%を資産計上する","支払保険料×65%×90%を資産計上する"],a:0,e:"★【50%超70%以下】であっても【1被保険者あたりの年換算保険料が30万円以下】なら【全額損金】でよい（例外）。28万円≦30万円なので全額損金。★この例外は【70%超】には適用されない（85%超はもちろん不可）＝率が上の区分には救済がない。★年換算保険料＝保険料総額÷保険期間の年数。同一被保険者で複数契約があるときは【合算して】30万円以下かを判定する。",s:"2026-1 Q27（区分の暗記・例外）★Tier1"},
 {id:"R30",t:1,q:"◆【2026-1 Q27の設例】NQ社が契約者・哲平さん（契約年齢40歳）が被保険者の定期保険（98歳満了・全期払い）。年払保険料2,341,600円。解約返戻率の推移＝1年67.4%／6年87.0%／11年88.4%／16年87.8%／21年87.0%／26年86.1%／…／56年39.9%。保険期間の開始から6年を経過する日における保険料支払時の経理処理は?（円未満切捨て）",c:["支払保険料508,128・前払保険料1,833,472","支払保険料478,624・前払保険料1,862,976","支払保険料936,640・前払保険料1,404,960","支払保険料1,404,960・前払保険料936,640"],a:1,e:"【手順】①表の【最大値＝88.4%（11年）】が最高解約返戻率 →【85%超】区分。②6年経過は資産計上期間内（最高返戻率となる11年目まで）かつ【当初10年以内】→ 係数は【最高解約返戻率×90%】。③資産計上＝2,341,600×88.4%×90%＝【1,862,976円（前払保険料）】、損金＝2,341,600−1,862,976＝【478,624円（支払保険料）】。★誤答936,640/1,404,960＝【70%超85%以下】の区分（40%損金・60%資産）で処理したもの＝26-1の実際の失点。★区分を1つ取り違えるだけで全く別の選択肢に着地する＝区分表の暗記が先。",s:"2026-1 Q27（実際に失点した設例）★Tier1"},
 {id:"R31",t:1,q:"◆従業員退職金規程に『勤続年数は入社日から退職の日までとし、試用期間は通算するが就業規則に定める休職期間は通算しない』とある。正社員として12年継続勤務し、うち休職期間が1年ある従業員の勤続年数は?",c:["12年（在籍期間で数える）","13年（試用期間を加算する）","11年（休職1年を控除する）","10年"],a:2,e:"★規程に【休職期間は通算しない】とあれば在籍12年−休職1年＝【11年】。★支給率表を引く【前に】勤続年数を確定させる。表を先に見ると在籍年数のまま引いてしまう。★1ヵ月未満の端数の扱いも規程で決まる（例＝15日以上を1ヵ月として月割計算）。★26-1 Q28ではこの控除を忘れて12年の支給率を使い、343万円（正解297万円）を選んで失点した。",s:"2026-1 Q28★Tier1"},
 {id:"R32",t:1,q:"◆従業員退職金規程に、退職事由が①定年②業務都合の解雇③業務上の傷病④死亡なら別表1（会社都合）、⑤自己都合⑥業務外の傷病なら別表2（自己都合）を適用とある。従業員が私傷病により死亡した場合に使う支給率表は?",c:["別表2（私傷病は業務外の事由だから）","支給率表は使わず弔慰金のみとなる","別表1と別表2の平均を用いる","別表1（退職事由が『死亡』に該当するから）"],a:3,e:"★死亡してしまえば退職事由は【④死亡】＝【別表1（会社都合）】。私傷病か業務上かが効くのは【⑥業務外の傷病】で生存退職した場合の話。ここを取り違えると支給率が大きく下がる（勤続11年で会社都合9.01対自己都合6.87）。★規程の列挙は【上から順に該当を探す】のが読み方。★会社都合の支給率は自己都合より高いのが通常。",s:"2026-1 Q28★Tier1"},
 {id:"R33",t:1,q:"◆退職金の算出額が2,865,180円だった。規程に『算出金額に10,000円未満の端数が生じたときは10,000円に切り上げる』『毎年3月末の年次評価でS評価を得た場合は、その年数×5万円を退職金に加えて別途支給する』とあり、S評価を得た年数は2年である。支給額は?",c:["2,970,000円","2,965,180円","2,960,000円","2,870,000円"],a:0,e:"【手順】①算出額2,865,180 → ②【10,000円未満を切上げ】＝2,870,000（切捨てではない）→ ③S評価2年×5万＝【100,000円を加算】→【2,970,000円】。★加算は端数処理の【後】に足す。★規程型の設問は【勤続年数の調整 → 別表の選択 → 算出 → 端数処理 → 加算】の順に機械的に処理する。どれか1つでも飛ばすと選択肢に着地しない。",s:"2026-1 Q28★Tier1"},
 {id:"R34",t:1,q:"◆【2026-1 Q28の設例】WP社の従業員が私傷病で死亡。正社員として12年継続勤務（うち規程に定める休職期間1年）／退職時の基本給の月額318,000円／S評価を得た年数2年／特別功労金・不支給事由・併給調整はなし。規程＝休職期間は通算しない、死亡は別表1（会社都合）、算出額の10,000円未満は切上げ、S評価年数×5万円を別途支給。別表1の支給率＝11年9.01／12年10.45。死亡退職金の額は?",c:["229万円","266万円","297万円","343万円"],a:2,e:"【手順】①勤続＝12−1＝【11年】②事由は死亡→【別表1】→支給率【9.01】③318,000×9.01＝2,865,180 ④10,000円未満切上げ＝2,870,000 ⑤S評価2年×5万＝100,000を加算 →【297万円】。★誤答343万＝休職1年を引かず12年（支給率10.45）で計算＝26-1の実際の失点。★266万＝自己都合の別表2（6.87）で計算した場合に近い誤り。",s:"2026-1 Q28（実際に失点した設例）★Tier1"},
 {id:"R35",t:1,q:"◆養老保険の福利厚生プラン（契約者＝法人／被保険者＝全役員・従業員／死亡保険金受取人＝被保険者の遺族／満期保険金受取人＝法人）における支払保険料の経理処理は?",c:["全額を福利厚生費として損金算入する","1/2を保険料積立金（資産）・1/2を福利厚生費（損金）とする","全額を保険料積立金として資産計上する","全額を給与として処理する"],a:1,e:"★【ハーフタックス＝1/2資産（保険料積立金）・1/2損金（福利厚生費）】。要件は①法人が契約者 ②【全役員・従業員が被保険者＝普遍的加入】 ③死亡保険金は【被保険者の遺族】 ④満期保険金は【法人】。★特定の役員だけを被保険者にすると普遍的加入を欠き、その者への【給与】になる。★満期保険金を法人が受け取ったときは、受取額と保険料積立金の差額が【雑収入】。",s:"2026-1 Q30★Tier1"},
 {id:"R36",t:1,q:"◆福利厚生プランの養老保険で被保険者である従業員が死亡し、死亡保険金が遺族へ直接支払われた。このときの法人の経理処理は?",c:["死亡保険金を雑収入に計上し、同額を退職金として費用計上する","死亡保険金の1/2を雑収入に計上する","何も処理しない","保険料積立金を取り崩して雑損失とする（保険金は法人を通らないので雑収入は計上しない）"],a:3,e:"★死亡保険金の受取人は【遺族】＝【法人には入金がない→雑収入は立たない】。資産計上してきた【保険料積立金を全額取り崩し、相手勘定は雑損失】。★対比：満期保険金は【法人】が受け取るので入金があり、保険料積立金との差額が雑収入になる。★【誰が受け取るか】で仕訳が根本から変わる＝26-1 Q30の失点の核心。法人を通らない資金を仕訳に入れてはいけない。",s:"2026-1 Q30★Tier1"},
 {id:"R37",t:1,q:"◆退職金規程に『中小企業退職金共済など外部機関から支給される退職金は会社が直接支給したものとみなし、会社から直接支給する退職金はその額を控除した額とする』とある。死亡退職金の予定額320万円のうち、中退共から72万円、養老保険の死亡保険金200万円が遺族へ直接支払われる場合、会社が現金で支払う退職金は?",c:["320万円","248万円","48万円","120万円"],a:2,e:"★320万−中退共72万−死亡保険金200万＝【48万円】。★中退共も、遺族が直接受け取る死亡保険金も【外部積立てによる支給】として控除する。★会社の仕訳に現れる現金支出はこの48万円だけ。控除した272万円は法人の損益に出てこない（保険積立金の取崩しは別途、雑損失として処理する）。★『予定額＝会社の費用』ではない点に注意。",s:"2026-1 Q30★Tier1"},
 {id:"R38",t:1,q:"◆【2026-1 Q30の設例】WP社は従業員全員加入の60歳満了養老保険（無配当・福利厚生プラン／死亡保険金受取人＝被保険者の遺族／満期保険金受取人＝WP社）に加入。加入から12年後に山岸さん（32歳加入）が死亡により退職。山岸さんに係る死亡保険金額200万円・年払保険料7万円（12年分支払済・未経過分の返還なし）／死亡退職金の予定額320万円のうち72万円は中退共から支払われる。WP社の一連の経理処理は?（源泉徴収は考慮しない）",c:["雑損失420,000／保険積立金420,000　＋　退職金480,000／現金・預金480,000","雑損失420,000／保険積立金420,000　＋　退職金1,200,000／現金・預金480,000・雑収入720,000","雑損失420,000／保険積立金420,000　＋　退職金2,480,000／現金・預金480,000・雑収入2,000,000","雑損失420,000／保険積立金420,000　＋　退職金3,200,000／現金・預金480,000・雑収入2,720,000"],a:0,e:"【手順】①保険料積立金＝7万×【1/2】×12年＝【42万円】。死亡保険金は遺族へ直接＝法人に入金なし → 全額【雑損失】で取崩し。②会社が現金で払う退職金＝320万−中退共72万−死亡保険金200万＝【48万円】。→ 退職金480,000／現金・預金480,000。★誤答2〜4はいずれも【法人を通らない資金（死亡保険金200万や中退共72万）を雑収入に立て、退職金の総額を費用計上した】もの＝26-1の実際の失点。",s:"2026-1 Q30（実際に失点した設例）★Tier1"},
 {id:"R39",t:1,q:"◆地震保険（建物）の損害区分を判定する基準は?",c:["主要構造部の損害額が保険価額に占める割合のみ","主要構造部の損害額が保険価額に占める割合、または焼失・流失した床面積が延床面積に占める割合","損害額が保険金額に占める割合","修理費用が再調達価額に占める割合"],a:1,e:"★【2つの基準のいずれかに該当すれば成立】＝①主要構造部の損害額÷【保険価額】 ②焼失・流失した床面積÷延床面積。両方を計算し【重い方の区分】を採る。片方だけで判断すると区分を落とす。★全損＝①50%以上／②70%以上、大半損＝①40%以上50%未満／②50%以上70%未満、小半損＝①20%以上40%未満／②20%以上50%未満、一部損＝①3%以上20%未満。★門・塀・垣は付属する建物の判定による。生活用動産はそれを収容する建物ごとに判定。",s:"2026-1 Q34★Tier1"},
 {id:"R40",t:1,q:"★地震保険で、建物の保険金額600万円・保険価額1,500万円の契約が大半損に該当した。支払われる地震保険金の計算方法は?",c:["保険金額600万円×60%（保険価額1,500万円×60%が限度）","損害額×保険金額÷（保険価額×80%）の比例填補で計算する","保険価額1,500万円×60%","主要構造部の損害額×60%"],a:0,e:"★【地震保険に比例填補はない】。支払額＝【保険金額×支払割合】（限度＝保険価額×同じ割合）。火災保険の一部保険で使う『×保険金額÷(保険価額×80%)』を持ち込まないこと。★支払割合＝全損100%／大半損60%／小半損30%／一部損5%。★そもそも地震保険金額は【火災保険金額の30〜50%】の範囲で設定するので、保険価額を下回っているのが通常の姿＝『一部保険だから按分する』という発想自体が誤り。★600万×60%＝【360万円】。",s:"2026-1 Q34（真因＝一部保険の計算ロジック）★Tier1"},
 {id:"R41",t:1,q:"◆地震保険の保険金額の設定に関する説明として正しいものは?",c:["火災保険の保険金額と同額まで設定できる","建物3,000万円・家財500万円が上限である","建物と家財を合算して1つの損害区分で判定する","火災保険の保険金額の30〜50%の範囲で、建物5,000万円・家財1,000万円が上限"],a:3,e:"★【火災保険金額の30〜50%】の範囲で設定し、上限は【建物5,000万円・家財1,000万円】。★建物と家財は【それぞれ別々に】契約し、損害区分の判定も支払も別々。★同一敷地内・同一被保険者の建物が複数あるときは合算して5,000万円が限度（生活用動産は同一世帯で1,000万円）。★【自動車は家財に含まれない】＝地震で車が壊れても地震保険では出ない。",s:"2026-1 Q34・Q37★Tier1"},
 {id:"R42",t:1,q:"◆【2026-1 Q34の設例】三上さんは自己所有の戸建住宅（延床面積120㎡）を保険の対象として、地震保険を保険金額600万円（保険価額1,500万円）で契約している。地震による火災で住宅建物が床面積75㎡焼失し、当該建物の主要構造部の損害の額は700万円であった。支払われる地震保険金は?",c:["180万円","210万円","360万円","420万円"],a:2,e:"【手順】①主要構造部＝700万÷【保険価額1,500万】＝【46.7%】→40%以上50%未満＝大半損。②焼失面積＝75㎡÷120㎡＝【62.5%】→50%以上70%未満＝大半損。→【大半損】確定。③支払額＝【保険金額600万×60%＝360万円】（限度＝1,500万×60%＝900万なので満額）。★【保険価額1,500万や損害額700万に60%を掛けない】。★誤答180万＝600万×30%（小半損の割合）。",s:"2026-1 Q34（実際に失点した設例）★Tier1"},
 {id:"R43",t:1,q:"◆企業費用・利益総合保険（利益条項）の『利益率』の算式は?（営業損失は生じていない）",c:["営業利益÷営業収益","（営業利益＋変動費）÷営業収益","（営業利益＋経常費）÷営業収益","（営業収益−変動費）÷営業収益"],a:2,e:"★利益率＝【(営業利益＋経常費)÷営業収益】。★【変動費は入れない】＝営業が止まれば発生しなくなる費用なので補償の対象外。経常費（人件費・減価償却費・賃借料など営業が止まっても発生し続ける費用）だけを足す。★営業損失が生じている期間なら【(経常費−営業損失)÷営業収益】。★26-1 Q42＝(1億＋9億)÷20億＝【50%】（変動費10億は無視する）。",s:"2026-1 Q42★Tier1"},
 {id:"R44",t:1,q:"◆企業費用・利益総合保険で、補償期間中に支出を免れた経常費がある場合、喪失利益からいくらを差し引くか?",c:["支出を免れた経常費の全額","支出を免れた経常費×（約定補償率÷利益率）","支出を免れた経常費×利益率","差し引かない"],a:1,e:"★差し引くのは【支出を免れた経常費×(約定補償率÷利益率)】。約定補償率と利益率が同じなら結果的に全額控除になるが、算式としては比率を掛ける。★喪失利益＝【収益減少額×約定補償率】−【支出を免れた経常費×(約定補償率÷利益率)】。★収益減少防止費用も同じ比率を掛けて【加算】する（その費用によって減少を免れた営業収益×約定補償率が限度）。★最後に免責金額を引く。",s:"2026-1 Q42★Tier1"},
 {id:"R45",t:1,q:"◆企業費用・利益総合保険で、約定補償率が利益率より大きいときの取扱いは?",c:["約定補償率をそのまま使う","保険金は支払われない","保険金額を按分する","算式中の『約定補償率』を『利益率』に読み替えて計算する"],a:3,e:"★約定補償率＞利益率のときは、算式中の【約定補償率】を【利益率】に読み替える＝実際の利益率を超えて補償はしない仕組み。★逆に約定補償率≦利益率なら読み替え不要でそのまま計算。★手順の第一歩は【利益率と約定補償率を並べて比較する】こと。26-1 Q42は両方50%＝読み替え不要だった。",s:"2026-1 Q42★Tier1"},
 {id:"R46",t:1,q:"◆【2026-1 Q42の設例】AK社の企業費用・利益総合保険（利益条項）＝補償期間1年・約定補償率50%・免責金額0円・その他特約なし。直近1年の会計＝営業収益20億円／経常費9億円（うち人件費3億円）／変動費10億円／営業利益1億円。事故後＝営業収益減少額4億円／支出を免れた経常費1億円／収益減少防止費用0円。支払われる保険金は?",c:["5,000万円","1億円","1億5,000万円","2億円"],a:1,e:"【手順】①利益率＝(1＋9)÷20＝【50%】（変動費10億は入れない）。②約定補償率50%≦利益率50%→【読み替え不要】。③喪失利益＝4億×50%＝【2億】。④支出を免れた経常費の控除＝1億×(50%÷50%)＝【1億】。⑤2億−1億＝【1億円】（収益減少防止費用0・免責0）。★誤答2億＝④の控除を忘れたもの。★時間切れで適当マークした問題だが、算式さえ入っていれば3分で取れる。",s:"2026-1 Q42（実際に失点した設例）★Tier1"},
 {id:"R47",t:1,q:"◆固定資産が滅失し保険金を受け取って代替資産を取得した場合の圧縮記帳。『保険差益』の算式は?",c:["保険金等の額−滅失により支出した経費−滅失した資産の帳簿価額","保険金等の額−代替資産の取得価額","保険金等の額−滅失した資産の帳簿価額","代替資産の取得価額−滅失した資産の帳簿価額"],a:0,e:"★保険差益＝【保険金等の額−滅失により支出した経費（片づけ費用・取壊し費用など）−滅失資産の帳簿価額】。★支出経費は【保険差益の計算でも、圧縮限度額の分母でも】差し引く＝2ヵ所に効く。★26-1 Q46＝400万−25万−300万＝【75万円】。★対象は【固定資産】の滅失。棚卸資産（商品）の損害に対する保険金は圧縮記帳できない。",s:"2026-1 Q46★Tier1"},
 {id:"R48",t:1,q:"◆圧縮記帳の圧縮限度額の算式は?",c:["保険差益×（代替資産の取得価額÷保険金等の額）","保険差益の全額","代替資産の取得価額×（保険差益÷保険金等の額）","保険差益×｛代替資産の取得価額÷（保険金等の額−滅失により支出した経費）｝"],a:3,e:"★圧縮限度額＝【保険差益×｛代替資産の取得価額÷(保険金等の額−支出経費)｝】。分母は【保険金そのものではなく、保険金−支出経費】。★カッコ内の分数は1を超えない（取得価額が分母以上なら分子＝分母として扱い、保険差益の全額が圧縮限度）。★代替資産の帳簿価額＝取得価額−圧縮限度額。★取得が翌事業年度になる場合は特別勘定を設ける。",s:"2026-1 Q46★Tier1"},
 {id:"R49",t:1,q:"◆【2026-1 Q46の設例】DJ社の社有車（帳簿価額300万円）が業務中の事故で全損となり、自動車保険から車両保険金400万円を受け取った。2ヵ月後にこの保険金で同じ車種の車両（代替資産）を350万円で取得し、圧縮記帳限度額まで圧縮記帳の適用を受けた。廃車等のために支出した費用は25万円である。再取得車両の帳簿価額は?",c:["280万円","300万円","325万円","350万円"],a:0,e:"【手順】①保険差益＝400−25−300＝【75万円】。②圧縮限度額＝75×｛350÷(400−25)｝＝75×(350/375)＝【70万円】。③帳簿価額＝350−70＝【280万円】。★分母を400万（保険金そのもの）にすると75×(350/400)＝65.6万→帳簿284.4万で選択肢に無い＝【分母は保険金−支出経費】と気づける。★誤答325万＝350−25と支出経費を引いただけのもの。",s:"2026-1 Q46（実際に失点した設例）★Tier1"},
 {id:"R50",t:1,q:"◆保険契約者等が故意または重大な過失により告知義務に違反し、保険会社が生命保険契約を解除した。告知されなかった事実と保険事故の発生に因果関係がない場合、保険金は?",c:["解除された以上、保険金は支払われない","責任準備金のみが支払われる","半額が支払われる","支払われる（告知されなかった事実と支払事由に因果関係がないときの特則）"],a:3,e:"★【因果関係不存在特則】（保険法59条2項但書）＝告知義務違反で解除されても、告知されなかった事実と支払事由の発生に【因果関係がなければ保険金は支払う】。例＝高血圧の不告知を隠していたが、死因が交通事故だった場合。★『告知義務違反＝必ず不払い』という思い込みが最頻の誤り。★ただし詐欺・不法取得目的による契約は【無効】となり、この特則の適用もない。",s:"2026-1 Q2★Tier1"},
 {id:"R51",t:1,q:"◆債権者等が生命保険契約を差し押さえて解約請求をした場合の『介入権』の説明として正しいものは?",c:["解約請求から1ヵ月以内に、保険金受取人（保険契約者の親族等）が解約返戻金相当額を債権者等に支払えば解約の効力は生じない。行使には保険契約者の同意が必要","保険契約者の同意は不要である","解約請求から3ヵ月以内であれば行使できる","介入権を行使できるのは保険契約者本人だけである"],a:0,e:"★介入権＝債権者による解約から保障を守る制度。要件は①【解約請求の通知が保険会社に到達した時から1ヵ月以内】②行使できるのは【保険契約者の親族等である保険金受取人】③【保険契約者の同意が必要】④解約返戻金相当額を債権者等に支払う。★『同意は不要』と書いてあれば誤り＝26-1 Q2の正解肢。",s:"2026-1 Q2★Tier1"},
 {id:"R52",t:1,q:"◆保険法における生命保険契約の告知義務の方式は?",c:["契約者が重要と考える事項を自発的に申し出る自発的申告義務","医師の診査を受ければ告知は不要である","保険会社が告知を求めた事項について回答する質問応答義務","口頭での申告は一切認められない"],a:2,e:"★保険法では【質問応答義務】＝保険会社が告知を求めた事項（告知書の質問項目）に答えればよく、聞かれていないことを自発的に申し出る義務はない。★告知義務者は【保険契約者または被保険者になる者】。★保険募集人に口頭で伝えただけでは告知したことにならない（告知受領権がないため）＝『告知妨害・不告知教唆』があった場合は保険会社は解除できない。",s:"2026-1 Q2★Tier1"},
 {id:"R53",t:1,q:"◆保険法施行後に契約日がある、保険料払込方法が年払いの生命保険契約が保険期間の途中で消滅した場合、保険料はどうなるか?",c:["既に払い込んだ保険料は一切返還されない","原則として未経過の月数に対応する保険料相当額が返還される","解約返戻金に含めて処理され、別途の返還はない","返還するかどうかは保険会社の任意である"],a:1,e:"★保険法施行（2010年4月1日）後の契約では、保険期間の途中で契約が消滅した場合、【未経過期間に対応する保険料相当額が返還される】のが原則（保険法63条など）。年払・半年払で払い込んだ先の期間分が対象。★施行前の契約は約款によるため取扱いが異なることがある。",s:"2026-1 Q2★Tier1"},
 {id:"R54",t:1,q:"◆平準払いの保険における標準利率の基準として正しいものは?",c:["直近の10年国債の応募者利回りそのもの","全生命保険会社の平均運用利回り","10年国債の応募者利回りの過去3年平均と過去10年平均のいずれか高い方","10年国債の応募者利回りの過去3年平均と過去10年平均のいずれか低い方"],a:3,e:"★標準利率＝責任準備金の積立てに用いる利率で、平準払いの保険では【10年国債の応募者利回りの過去3年平均と過去10年平均のいずれか『低い』方】を基準に設定する。『高い方』は誤り。★保守的に（＝より多く積み立てる方向に）決めるので【低い方】と覚える。★2022年4月1日以後の米ドル建て・豪ドル建て契約についても標準利率の算定方法が定められている。",s:"2026-1 Q3★Tier1"},
 {id:"R55",t:1,q:"★保証期間付終身年金を選択した個人年金保険で、予定死亡率と予定利率をともに低く設定した場合、他の条件が同一なら保険料はどうなるか?",c:["高くなる","安くなる","変わらない","予定利率の影響だけで決まる"],a:0,e:"★【年金保険は生存保障なので、死亡保険と逆になる】。予定死亡率を低く設定＝長生きする前提＝年金を長く払う＝保険料は【高く】なる（死亡保険なら予定死亡率が低いと保険料は安くなる）。★予定利率を低く設定＝運用で増えない前提＝保険料は【高く】なる（これは死亡保険と同じ）。★両方とも保険料を高くする方向なので【高くなる】。★予定事業費率が高い→保険料も高い。",s:"2026-1 Q3（年金は死亡保険と逆）★Tier1"},
 {id:"R56",t:1,q:"◆標準責任準備金を定めるのはどこか?",c:["生命保険協会","日本アクチュアリー会","金融庁","各生命保険会社が自主的に定める"],a:2,e:"★標準責任準備金＝保険契約者保護および保険会社経営の健全性維持の観点から【金融庁】が定める、標準とすべき責任準備金。★責任準備金は保険会社が将来の保険金支払いに備えて積み立てる負債。★破綻時に補償機構が補償するのは、原則として【責任準備金等の90%】（高予定利率契約は別計算）。",s:"2026-1 Q3★Tier1"},
 {id:"R57",t:1,q:"◆生命保険契約者保護機構における『高予定利率契約』の定義と補償率の組合せとして正しいものは?",c:["破綻時に過去3年間常に予定利率が基準利率を超えていた契約。補償率＝80%−｛(各年の予定利率−基準利率)の総和÷2｝","破綻時に過去5年間常に予定利率が基準利率を超えていた契約。補償率＝90%−｛(各年の予定利率−基準利率)の総和÷2｝","破綻時の予定利率が基準利率を超える契約。補償率は一律80%","過去10年間の平均予定利率が基準利率を超える契約。補償率は一律90%"],a:1,e:"★【過去5年間】常に予定利率＞基準利率だった契約が高予定利率契約。補償率＝【90%−｛(過去5年間における各年の予定利率−基準利率)の総和÷2｝】。★通常の契約の補償は【責任準備金等の90%】で、高予定利率契約はそこから引き下げられる。★数字（5年・90%・÷2）をそのまま覚える。26-1 Q12は『3年・80%』に変えた誤り肢だった。",s:"2026-1 Q12★Tier1"},
 {id:"R58",t:1,q:"◆高予定利率契約の判定に用いる『基準利率』は、何を基準に誰が定めるか?",c:["10年国債利回りを基準に日本銀行が定める","生命保険協会が毎年公表する","破綻会社の運用利回りを基準に更生管財人が定める","全生命保険会社の過去5年間の年平均運用利回りを基準に、金融庁長官および財務大臣が定める"],a:3,e:"★基準利率＝【全生命保険会社の過去5年間の年平均運用利回り】を基準に、【金融庁長官および財務大臣】が定める。★『5年』は高予定利率契約の判定期間とセットで覚える。★用語の整理＝標準利率（責任準備金の積立てに使う・10年国債ベース）／基準利率（高予定利率契約の判定に使う・業界平均運用利回りベース）／予定利率（各契約の運用の約束）。3つを混同しない。",s:"2026-1 Q12★Tier1"},
 {id:"R59",t:1,q:"◆生命保険契約者保護機構の補償対象に関する説明として正しいものは?",c:["運用実績連動型保険契約のうち特定特別勘定に係る部分は補償の対象とならない","変額保険は全額が補償対象となる","特別勘定に係る部分のみが補償対象となる","国内で営業する外資系生命保険会社は機構に加入していない"],a:0,e:"★【特定特別勘定（運用実績連動型の特別勘定）部分は補償対象外】＝運用リスクは契約者が負うため。補償されるのは責任準備金等のうち一般勘定に対応する部分。★国内で営業するすべての生命保険会社（外資系・かんぽ生命を含む）が機構に加入している（共済・少額短期保険業者は対象外）。★損害保険にも損害保険契約者保護機構がある（自賠責・地震保険は100%補償）。",s:"2026-1 Q12★Tier1"},
 {id:"R60",t:1,q:"◆生命保険会社が破綻し、責任準備金等の削減や予定利率の引下げが行われた場合の保険金額への影響は?",c:["保障性の高い保険ほど減少幅が大きい","すべての保険で一律に90%となる","貯蓄性の高い保険ほど減少幅が大きい","保険金額は一切減少しない"],a:2,e:"★【貯蓄性の高い保険（養老・個人年金・一時払終身など）ほど減少幅が大きく、保障性の高い保険（定期保険など）は減少しないか小幅】。理由＝責任準備金の削減は積立部分に効くため、積立てが厚い契約ほど影響が大きい。★『責任準備金等の90%が補償』＝保険金額の90%が保証されるという意味ではない点に注意。",s:"2026-1 Q12★Tier1"},
 {id:"R61",t:1,q:"◆JA共済・こくみん共済coop・都道府県民共済などの根拠法を有する共済契約に適用される法律は?",c:["保険業法は適用されるが、保険法は適用されない","保険業法・保険法とも適用される","保険業法は適用されないが、保険法は適用される","保険業法・保険法とも適用されない"],a:2,e:"★制度共済は【農業協同組合法・消費生活協同組合法などの各根拠法】に基づいて運営されるため【保険業法の適用対象外】（監督官庁も金融庁ではなく農林水産省・厚生労働省など）。一方【保険法は共済契約にも適用される】（保険法は契約ルールを定める民事法で、名称にかかわらず適用される）。★26-1 Q19はこれを逆にした誤り肢。★共済は生命保険契約者保護機構の対象外。",s:"2026-1 Q19★Tier1"},
 {id:"R62",t:1,q:"◆保険業法における情報提供義務・意向把握義務についての説明として正しいものは?",c:["財形貯蓄傷害保険の契約にも意向把握義務が適用される","財形貯蓄傷害保険の契約には意向把握義務が適用されない","法人が契約者の場合、全被保険者に対して情報提供義務が及ぶ","保険期間1年以下の契約には情報提供義務が適用されない"],a:1,e:"★【財形貯蓄傷害保険は意向把握義務の適用除外】（貯蓄目的で商品設計が定型的なため）。★情報提供義務・意向把握義務はいずれも【保険契約者】に対するもので、契約者以外の被保険者（家族傷害保険の家族、行事参加者、従業員など）には及ばない。★『誰に対する義務か』『どの商品が除外か』の2軸で整理する。",s:"2026-1 Q33★Tier1"},
 {id:"R63",t:1,q:"◆遺産の代償分割で、代償財産として自己が保有する不動産（現物）を交付した場合の税務上の取扱いは?",c:["交付した者が取得した時点の価格で評価される","相続財産の分割なので譲渡所得は生じない","交付を受けた者に贈与税が課される","交付時の時価で譲渡があったものとされ、譲渡所得が課税される"],a:3,e:"★代償財産として【現物（不動産・有価証券など）】を交付すると、【交付時の時価で譲渡があったもの】とされ、交付した者に【譲渡所得】が課税される。相続税の計算上もその時価で評価する。★『取得した時点の価格』は誤り＝26-1 Q22の正解肢。★現金で交付すれば譲渡所得は生じない＝だから代償交付金の準備に生命保険を使う。",s:"2026-1 Q22★Tier1"},
 {id:"R64",t:1,q:"◆代償分割に関する説明として正しいものは?",c:["代償交付金を分割払いで交付する場合、相続人全員の合意は必要だが家庭裁判所の許可は不要である","代償財産の交付により生じた譲渡所得に係る所得税相当額は相続税額から控除できる","代償交付金を分割払いで交付するには家庭裁判所の許可が必要である","代償分割は現金でのみ行うことができる"],a:0,e:"★代償分割は【遺産分割協議（相続人全員の合意）】で決めるもので、分割払いにする場合も【家庭裁判所の許可は不要】。★譲渡所得に係る所得税相当額を相続税額から控除する制度は【ない】（相続税の取得費加算の特例は、相続財産そのものを売却した場合の話で別物）。★代償財産は現金に限らず現物でもよい（ただし譲渡所得が生じる＝R63）。",s:"2026-1 Q22★Tier1"},
 {id:"R65",t:1,q:"◆祖父母と普通養子縁組をした孫（代襲相続人ではない）が相続により財産を取得した場合、相続税額の2割加算は?",c:["養子は実子と同じ扱いなので2割加算の対象とならない","2割加算の対象となる","孫が未成年の場合のみ対象となる","養子縁組から3年を経過すれば対象外となる"],a:1,e:"★【孫養子は2割加算の対象】。相続を1世代飛ばす（相続税を1回免れる）ことへの調整のため。★例外＝その孫が【代襲相続人】である場合（子が先に死亡しているケース）は2割加算されない。★2割加算の対象＝配偶者・子・父母【以外】の人（兄弟姉妹、孫、甥姪、第三者など）。★養子縁組すれば法定相続人の数には算入できる（実子ありなら1人まで）が、2割加算は別の話＝この2つを混同しない。",s:"2026-1 Q23★Tier1"},
 {id:"R66",t:1,q:"◆実子が3人いる被相続人が孫2人と普通養子縁組をしていた。生命保険金の非課税限度額の計算上、法定相続人の数に算入できる養子の数は?",c:["2人","制限なく2人とも算入できる","1人","0人"],a:2,e:"★養子の算入数は【実子がいる場合は1人まで／実子がいない場合は2人まで】。実子3人がいるので【1人】。★この制限は相続税の基礎控除・生命保険金と死亡退職金の非課税枠・相続税の総額の計算に共通して適用される。★特別養子・配偶者の連れ子を養子にした場合などは実子扱いで制限を受けない。",s:"2026-1 Q23★Tier1"},
 {id:"R67",t:1,q:"◆相続時精算課税制度を適用して毎年110万円の贈与を行い、贈与が継続している期間中に贈与者が死亡した。受贈者が贈与を受けた額の、相続税の課税価格への加算は?",c:["全額を加算する必要がある","半額を加算する","贈与した年数分だけ加算する","基礎控除（年110万円）以内なので加算する必要はない"],a:3,e:"★2024年1月1日以後の贈与から、相続時精算課税にも【年110万円の基礎控除】が新設され、【基礎控除以内の贈与は相続財産に加算しない】（申告も不要）。★対比＝暦年課税の生前贈与加算は【相続開始前7年以内】（2024年から段階的に3年→7年へ延長。延長された4年間分は合計100万円まで控除）で、基礎控除以下でも加算対象。★『精算課税＝全部加算』は改正前の知識。",s:"2026-1 Q23★Tier1"},
 {id:"R68",t:1,q:"◆被相続人から毎年100万円の暦年課税による贈与を受けていた孫が、被相続人の死亡により生命保険金を受け取った。生前に受けた贈与の相続税の課税価格への加算は?",c:["生命保険金を受け取ったことで『相続または遺贈により財産を取得した者』に当たるため、加算が必要","孫は相続人ではないので加算は不要","基礎控除110万円以下の贈与なので加算は不要","贈与税を納めていれば加算は不要"],a:0,e:"★生前贈与加算の対象は【相続または遺贈により財産を取得した者】。相続人でない孫でも、【死亡保険金を受け取れば『遺贈により取得した者』に該当】するので加算が必要になる。★逆に、何も取得しない孫への生前贈与は加算されない＝これが孫への贈与が相続対策として使われる理由。★保険金の受取人にした瞬間に加算対象になる、という設計上のトレードオフを押さえる。",s:"2026-1 Q23★Tier1"},
 {id:"R69",t:1,q:"◆地震により自宅のガレージが倒壊し、中に保管していた自動車に損害が生じた。地震保険（建物・家財を契約）から保険金は支払われるか?",c:["支払われない（自動車は地震保険の対象外）","家財として支払われる","建物の付属物として支払われる","ガレージが全損であれば支払われる"],a:0,e:"★【自動車は家財に含まれず、地震保険の対象外】。地震による車の損害に備えるには、自動車保険に【地震・噴火・津波危険車両全損時一時金特約】を付ける（全損時に50万円）。★地震保険の対象は【居住用建物と家財】。門・塀・垣、屋外設備、通貨・有価証券、1個30万円超の貴金属・美術品なども対象外。★125cc以下の原動機付自転車は家財に含まれる（自動車とは扱いが違う）。",s:"2026-1 Q37★Tier1"},
 {id:"R70",t:1,q:"◆火山の噴火による火砕流で自宅が焼失した。この損害の支払い対象となるのは?",c:["住宅向け火災保険","地震保険","どちらの対象にもならない","傷害保険"]  ,a:1,e:"★【地震・噴火・津波を原因とする損害は火災保険では免責】で、【地震保険】の対象。噴火による火砕流での焼失も地震保険から支払われる。★火災保険で支払われるのは、火災・落雷・破裂爆発・風災・雹災・雪災・水災・水濡れ・盗難など。★『地震が原因で発生した火災』も火災保険では出ない＝地震保険を付けていないと無保険になる、が実務上の要点。",s:"2026-1 Q37★Tier1"},
 {id:"R71",t:1,q:"◆火災により、自宅の敷地内に置いていた自転車に損害が生じた。住宅向け火災保険（建物・家財を契約）の取扱いは?",c:["屋外にあるので補償の対象外","建物として支払いの対象となる","家財として損害保険金の支払い対象となる","自動車保険でなければ補償されない"],a:2,e:"★自転車および125cc以下の原動機付自転車は【家財】として扱われ、敷地内であれば屋外に置いていても火災保険の支払い対象になる。★対象外＝自動車（125cc超のバイクを含む）、通貨・有価証券（盗難補償で一部対応）、動植物、business用の什器備品（住宅用契約の場合）。★『建物』は門・塀・垣・物置・車庫など付属設備を含むのが一般的（契約内容による）。",s:"2026-1 Q37★Tier1"},
 {id:"R72",t:1,q:"◆自動車保険に付帯したファミリーバイク特約（人身傷害型）について、記名被保険者が友人から借用した原動機付自転車（総排気量50cc）を運転中に対物事故を起こした場合の補償は?",c:["借用したバイクは対象外なので補償されない","人身傷害型なので自分のケガのみ補償され、対物賠償は補償されない","原付は125cc超のみ対象なので補償されない","借用したバイクも対象であり、対物賠償も補償される"],a:3,e:"★ファミリーバイク特約は【記名被保険者や家族が運転する125cc以下のバイク】を対象とし、【所有していない借用車も対象】。★【対人賠償・対物賠償は型に関係なく補償される】。『人身傷害型／自損事故型』の違いは【自分（運転者）のケガをどう補償するか】だけ（人身傷害型は過失にかかわらず実損、自損事故型は定額）。★台数無制限・等級に影響しないのが特徴。",s:"2026-1 Q38★Tier1"},
 {id:"R73",t:1,q:"◆自動車保険に付帯した『地震・噴火・津波危険車両全損時一時金特約』で、被保険自動車が地震により全損と認定された場合に支払われるのは?",c:["50万円の一時金","車両保険金額の全額","車両の時価額の全額","修理費の実費"],a:0,e:"★【全損時に50万円の一時金】。車両保険は原則として地震・噴火・津波による損害を免責としているため、この特約で最低限の備えをする。★『全損』の認定が要件で、一部損壊では支払われない。★車両保険金額がいくらであっても支払額は一時金50万円。",s:"2026-1 Q38★Tier1"},
 {id:"R74",t:1,q:"◆自動車保険の車両新価（新車）特約が使えるのは、事故による被保険自動車の損害額が協定新価保険価額の何%以上となった場合か?",c:["30%以上","50%以上","70%以上","全損の場合のみ"],a:1,e:"★損害額が【協定新価保険価額の50%以上】となった場合に、新しい車への買替え費用（または新車価格相当額での修理費）が補償される。★通常の車両保険は【時価】が基準なので、新車購入直後に全損すると同等の新車を買えない。それを埋める特約。★対象は初度登録から一定期間内（例＝25ヵ月以内）の車に限られるのが一般的。",s:"2026-1 Q38★Tier1"},
 {id:"R75",t:1,q:"◆A車（弁護士費用特約付き）とB車（特約なし）を所有する記名被保険者が、B車を運転中に追突されて重傷を負い、相手方への損害賠償請求を弁護士に委任した。弁護士費用の取扱いは?",c:["B車の契約に特約がないので補償されない","相手方が負担すべきものなので補償の対象外","A車に付帯した弁護士費用特約の補償対象となる","人身傷害保険からのみ支払われる"],a:2,e:"★弁護士費用特約は【記名被保険者とその家族】を被保険者とするため、【他の所有車や他人の車に搭乗中の事故、歩行中の事故】でも補償対象になる（自動車事故型の場合）。1台に付けておけば家族全体をカバーできる。★被害事故で相手が賠償に応じないときの弁護士報酬・訴訟費用・法律相談料が対象（保険会社の同意が必要）。★自分に過失が大きい加害事故では、保険会社が示談代行するため対象外。",s:"2026-1 Q38★Tier1"},
 {id:"R76",t:1,q:"★自動車保険の運転者家族限定特約における『家族』の範囲として正しいものは?",c:["記名被保険者の親族であれば同居・別居を問わない","同居の親族であれば婚姻歴を問わないが、別居の子は一切含まれない","別居の子は年齢が35歳未満であれば含まれる","記名被保険者・その配偶者・同居の親族・別居の未婚の子（婚姻歴のない子）"],a:3,e:"★家族の範囲＝【①記名被保険者 ②配偶者 ③同居の親族 ④別居の『未婚』の子】。★【未婚＝これまで婚姻歴がないこと】であって『現在独身』ではない。【離婚歴のある別居の子は対象外】＝26-1 Q39の正解肢。★『同居／別居』『婚姻歴の有無』の2軸で機械的に判定する。設例に『離婚後は一人暮らし』とあれば即座に対象外と判断できる。★同居の親族なら婚姻歴は問わない。",s:"2026-1 Q39★Tier1"},
 {id:"R77",t:1,q:"★運転者年齢条件特約（35歳以上補償）を付帯した自動車保険で、年齢条件の適用を受けない（年齢にかかわらず補償される）のは?",c:["別居の未婚の子、および記名被保険者の友人など第三者","同居の子","配偶者","記名被保険者本人"],a:0,e:"★年齢条件が適用されるのは【記名被保険者・配偶者・同居の親族（およびそれらの業務に従事中の使用人）】。★【別居の未婚の子】と【友人など第三者】は年齢条件の適用外＝35歳未満でも補償される。★26-1 Q39では別居の長男（29歳）を年齢条件違反と誤判定した。運転者限定（誰が乗れるか）と年齢条件（何歳以上か）は【適用される人の範囲が違う】＝別々に判定する。",s:"2026-1 Q39★Tier1"},
 {id:"R78",t:1,q:"◆保険期間1年の地震保険料60,000円を支払った場合の地震保険料控除額（所得税・住民税）の組合せは?",c:["所得税50,000円・住民税50,000円","所得税50,000円・住民税25,000円","所得税60,000円・住民税30,000円","所得税60,000円・住民税25,000円"],a:1,e:"★【所得税＝支払保険料の全額・上限50,000円】→ 60,000円なので【50,000円】。★【住民税＝支払保険料の1/2・上限25,000円】→ 60,000×1/2＝30,000＞25,000なので【25,000円】。★所得税は『全額・5万』、住民税は『半額・2.5万』とセットで覚える。★旧長期損害保険料と併用する場合、所得税は合計50,000円が上限（住民税は25,000円）。",s:"2026-1 Q48★Tier1"},
 {id:"R79",t:1,q:"◆店舗併用住宅の建物を保険の対象とする地震保険の保険料について、その全額を地震保険料控除の対象とできるのは、居住用部分の割合が建物全体のおおむね何%以上の場合か?",c:["50%以上","70%以上","90%以上","100%（居住専用に限る）"],a:2,e:"★【おおむね90%以上】が居住用なら全額を控除対象にできる。90%未満なら【居住用部分に対応する保険料だけ】を按分して控除する。★26-1 Q48は『50%以上』とした誤り肢。★地震保険料控除の対象は【居住用建物・生活用動産】に係る地震保険料。事業用建物の地震保険料は控除の対象外（必要経費にはなる）。",s:"2026-1 Q48★Tier1"},
 {id:"R80",t:1,q:"◆保険期間5年の地震保険料を一括で支払った場合、その年の地震保険料控除の対象となる金額は?",c:["支払った保険料の全額","支払った保険料の1/2","控除の対象とならない","保険期間の年数で按分した1年分"],a:3,e:"★複数年分を一括で払っても、控除できるのは【保険期間で按分した1年分】ずつ（毎年控除できる）。★生命保険料控除の前納保険料も同じ考え方（その年に対応する分だけ）。★一時払は払い込んだ年に全額、という生命保険の一時払とは扱いが違う点に注意。",s:"2026-1 Q48★Tier1"},
 {id:"R81",t:1,q:"◆2006年12月31日までに契約した年金払積立傷害保険について、地震保険料控除（旧長期損害保険に係る経過措置）の適用を受けるための要件は?",c:["2007年1月1日以後に保険期間・保険料等の契約変更をしていないこと","保険期間が20年以上であること以外に要件はない","契約変更の有無にかかわらず適用を受けられる","地震保険を付帯していること"],a:0,e:"★旧長期損害保険の経過措置の要件＝①【2006年12月31日までに締結】②保険期間【10年以上】で満期返戻金があるもの ③【2007年1月1日以後に契約の変更をしていない】こと。★26-1 Q48は『契約変更の有無にかかわらず』とした誤り肢。★控除額（所得税）＝10,000円以下は全額／10,000円超20,000円以下は×1/2＋5,000円／20,000円超は15,000円。地震保険料と合わせて上限50,000円。",s:"2026-1 Q48★Tier1"},
 {id:"R82",t:1,q:"◆自動車を運転中の事故により被保険者が死亡し、相続人が人身傷害保険金を受け取った。課税関係は?",c:["過失割合にかかわらず全額非課税である","被保険者本人の過失割合に対応する部分は相続税の課税対象となる","全額が相続税の課税対象となる","全額が一時所得となる"],a:1,e:"★人身傷害保険金のうち、【相手方の過失割合に対応する部分】は損害賠償金に相当するので【非課税】。【自分（被保険者）の過失割合に対応する部分】は保険契約に基づく給付なので【相続税の課税対象】（死亡保険金として非課税枠の対象になる）。★『過失割合にかかわらず全額非課税』は誤り＝26-1 Q49の正解肢。★過失割合で課税関係が分かれるのが人身傷害保険の特徴。",s:"2026-1 Q49★Tier1"},
 {id:"R83",t:1,q:"◆妻（被保険者）が事故でケガをして入院し、夫（保険契約者）が家族傷害保険から入院保険金を受け取った。課税関係は?",c:["契約者と被保険者が異なるので一時所得となる","贈与税の課税対象となる","非課税である","雑所得となる"],a:2,e:"★【身体の傷害に基因して支払われる保険金】は非課税。受取人が被保険者本人でなくても、【配偶者・直系血族・生計を一にするその他の親族】が受け取る場合は非課税。★入院・手術・通院・障害給付金、特定疾病保険金、高度障害保険金、リビングニーズ特約の給付金なども同様。★死亡保険金は『身体の傷害に基因する』給付ではないので、この非課税規定の対象外（契約形態に応じて相続税・所得税・贈与税）。",s:"2026-1 Q49★Tier1"},
 {id:"R84",t:1,q:"◆個人事業主が対物賠償事故により店舗内に陳列していた商品（棚卸資産）に損害を受け、加害者から損害賠償金を受け取った。所得税の取扱いは?",c:["非課税である","一時所得となる","雑所得となる","事業所得の収入金額に算入する"],a:3,e:"★【棚卸資産（商品・製品）の損害に対する賠償金・保険金は事業所得の収入金額】。棚卸資産は売れば売上になるものなので、その代わりに受け取る金銭も事業の収入として扱う。★非課税になるのは【固定資産の損害】に対する保険金（ただし必要経費に算入した修理費を補填する部分は収入金額）。★個人事業主の設問は【事業に関するものは課税】を軸に判定する。",s:"2026-1 Q50★Tier1"},
 {id:"R85",t:1,q:"◆個人事業主が爆発事故により事業用資産に損害を受けて業務が一時休止し、収益補償として店舗休業保険から保険金を受け取った。所得税の取扱いは?",c:["事業所得の収入金額に算入する","非課税である","一時所得となる","雑所得となる"],a:0,e:"★【休業補償・収益補償の保険金は事業所得の収入金額】。売上が立たなかった代わりに受け取るものなので、売上と同じ扱い。★同様に、必要経費を補填するために受け取る保険金・賠償金も収入金額に算入する。★非課税は【身体の傷害に基因するもの】と【心身に加えられた損害・資産の損害に対する賠償金（事業に関するものを除く）】。",s:"2026-1 Q50★Tier1"},
 {id:"R86",t:1,q:"◆個人事業主が交通事故により業務用自動車を破損し、修理して修理費を必要経費に算入した。支払われた車両保険金の取扱いは?",c:["資産の損害に対する保険金なので全額非課税","必要経費に算入した修理費を補填する部分は事業所得の収入金額に算入する","一時所得となる","修理費との差額のみが非課税となる"],a:1,e:"★【必要経費に算入した修理費を補填する部分】は事業所得の【収入金額】に算入する（経費に落としたうえに保険金も非課税では二重に得をするため）。★修理せず資産の損失として処理した場合、その損害に対応する保険金は非課税だが、必要経費に算入した損失額を補填する部分は同様に収入金額となる。★『資産の損害＝非課税』を機械的に当てはめないこと。",s:"2026-1 Q50★Tier1"},
 {id:"R87",t:1,q:"◆個人事業主が対人賠償事故の被害者となり、所属する商店会から社会通念上相当額の見舞金を受け取った。所得税の取扱いは?",c:["事業所得の収入金額に算入する","一時所得となる","非課税である","雑所得となる"],a:2,e:"★【社会通念上相当額の見舞金は非課税】（所得税法9条・心身に加えられた損害等に基因して受ける見舞金）。事業の収入ではなく、身体の被害に対する見舞いだから。★相当額を超える部分は課税対象になり得る。★対比＝同じ個人事業主でも、棚卸資産の賠償金・休業補償・必要経費を補填する保険金は【事業所得】。【身体・見舞に係るものは非課税／事業に係るものは課税】で切り分ける。",s:"2026-1 Q50★Tier1"},
 {id:"R88",t:1,q:"◆サイバー保険（利益損害補償特約付帯）の補償対象として【誤っている】ものは?",c:["サイバー攻撃を検知し事故原因を調査するために外部専門機関へ支払う費用","ランサムウェア攻撃でシステムが中断し工場を稼働させられなかった場合の喪失利益","従業員のメール誤送信で個人情報が流出した場合に会社が支出した被害者への見舞金","ビジネスメール詐欺に遭い、誤って加害者の指定口座に振り込んだ金銭"],a:3,e:"★【ビジネスメール詐欺（BEC）で詐取された金銭そのものは補償対象外】。サイバー保険が補償するのは①第三者への【損害賠償責任】②【事故対応費用】（原因調査・コールセンター・見舞金・広告費用など）③特約による【喪失利益】であって、【だまし取られた送金額】は含まれない。★金銭の詐取に備えるには別途『不正送金・詐欺被害』を対象とする保険や犯罪保険が必要。",s:"2026-1 Q43★Tier1"},
 {id:"R89",t:1,q:"◆生産物賠償責任保険（食中毒・特定感染症利益担保特約付帯）の補償対象について正しいものは?",c:["製品の回収・廃棄費用、異物混入による賠償、店舗の営業休止による喪失利益はいずれも補償の対象となる","製品の回収・廃棄費用は対象外である","店舗の休業による喪失利益は対象外である","食物アレルギー表示の不備による賠償は対象外である"],a:0,e:"★生産物賠償責任保険（PL保険）は、製造・販売した製品が原因で他人の身体・財物に損害を与えた場合の【法律上の損害賠償責任】を補償。異物混入によるケガ、アレルギー表示の不備による発症などが典型。★【回収費用特約（リコール保険）】で回収・廃棄費用、【食中毒・特定感染症利益担保特約】で営業休止による喪失利益・収益減少防止費用まで広げられる。★製品そのものの損害（作り直し費用）は対象外＝『他人に与えた損害』を補償する保険。",s:"2026-1 Q44★Tier2"},
 {id:"R90",t:1,q:"◆個人年金保険で保険料の払込期間が満了して年金受給権が発生した後、一定期間年金を受給せずに据え置いた場合、据置期間中の年金の所得税の取扱いは?",c:["実際に指定口座へ入金されるまで課税されない","入金がなくても、契約上の年金支払日の属する年の所得として課税対象となる","据置期間が終了した年に一括して課税される","据え置いたことにより非課税となる"],a:1,e:"★雑所得の収入計上時期は【権利確定主義】＝契約上の年金支払日が到来すれば、実際に受け取っていなくてもその年の所得になる。★『入金がないから課税されない』は誤り＝26-1 Q1で迷った論点。★据置期間中に付く利息は、受け取ったときにその年の雑所得（または年金額に上乗せして課税）。",s:"2026-1 Q1★Tier1"},
 {id:"R91",t:1,q:"◆生命保険料控除証明書を提出して年末調整を済ませた後、同じ年の11月に保険料の割戻しを受けた。年末調整書類の事業主への提出期限が過ぎている場合の手続きは?",c:["支払保険料から差し引く必要はない","会社が再年末調整を行うので本人の手続きは不要である","支払保険料の総額から割戻額を差し引いたうえで、確定申告により訂正する必要がある","翌年の控除額から差し引けばよい"],a:2,e:"★割戻しを受けたら【その年の支払保険料の総額から差し引く】＝控除額が減り、納める税額が増える。★年末調整のやり直しができない（提出期限後）場合は【確定申告で訂正する】。『提出期限が過ぎていれば不要』は誤り＝26-1 Q1の正解肢。★納税者に不利な訂正でも申告義務があることを押さえる。",s:"2026-1 Q1★Tier1"},
 {id:"R92",t:1,q:"◆相続または贈与により取得した年金受給権に基づいて支払われる年金について、生命保険会社が所轄税務署へ支払調書を提出する基準は?",c:["支払金額が年20万円を超える場合に提出する","支払金額が年100万円を超える場合に提出する","提出義務はない","支払金額にかかわらず提出する義務がある"],a:3,e:"★【相続・贈与に係る年金の支払調書は金額基準なしで提出義務がある】。相続税・贈与税の課税漏れを防ぐため、少額でも税務署が把握する必要があるから。★通常の年金（自分で保険料を負担したもの）の支払調書は年20万円超が提出基準。★26-1 Q13は『年100万円以下なら提出不要』とした誤り肢。★設問に資料（支払調書）が添付されているときは、まず資料の注記を読む。",s:"2026-1 Q13★Tier1"},
 {id:"R93",t:1,q:"◆保証期間付終身年金について、保証期間分の年金を繰上げ請求して一時金で受け取った場合の所得区分は?",c:["雑所得","一時所得","退職所得","非課税"],a:0,e:"★保証期間分の一括受取（繰上げ請求）は【雑所得】。年金として受け取るはずのものをまとめて受け取っただけなので、性格は年金のまま。★『一時金だから一時所得』としないこと＝26-1 Q14の失点論点。★対比＝死亡給付金を一時金で受け取る場合は契約形態に応じて相続税・一時所得・贈与税。解約返戻金・満期保険金は一時所得。",s:"2026-1 Q14★Tier1"},
 {id:"R94",t:1,q:"◆変額個人年金保険で、特別勘定のファンド間で資金を移動（スイッチング）して差益が生じた場合の課税は?",c:["その時点で源泉分離課税の対象となる","課税されない（保険契約内での運用の移動にすぎないため）","一時所得として総合課税の対象となる","雑所得として課税される"],a:1,e:"★スイッチングは【保険契約の中で運用先を変えるだけ】なので、その時点では【課税されない】。課税されるのは解約・年金開始・死亡など保険金等を受け取るとき。★投資信託を売却して別のファンドを買えばその都度課税されるのと対照的＝変額保険の税制上の特徴。★26-1 Q14の正解肢。★据置期間中（契約日から5年以内）の一部引出しは、一時払変額個人年金（確定年金）なら金融類似商品として源泉分離課税。",s:"2026-1 Q14★Tier1"},
 {id:"R95",t:1,q:"◆個人年金保険料税制適格特約が付加された契約について、年金受取人を契約者本人から契約者の母へ変更することは?",c:["いつでも変更できる","契約後10年を経過すれば変更できる","できない（年金受取人は契約者本人またはその配偶者に限られる）","被保険者の同意があれば変更できる"],a:2,e:"★税制適格特約の要件＝①年金受取人が【契約者本人またはその配偶者】②年金受取人＝被保険者 ③保険料払込期間【10年以上】④確定年金・有期年金は年金支払開始時の被保険者の年齢が【60歳以上】かつ支払期間【10年以上】。★母への変更は①に反するのでできない。★要件を外れると特約は消滅し、以後は【一般生命保険料控除】の扱いになる（過去の控除の遡及是正はない）。",s:"2026-1 Q14★Tier1"},
 {id:"R96",t:1,q:"★保険金で代替資産を取得したときに圧縮記帳が認められるのは、何のためか?",c:["保険差益が非課税になるため","代替資産の減価償却費を増やすため","支払保険料を損金算入するため","保険差益への課税で代替資産の取得資金が不足するのを防ぐため（課税の繰延べ）"],a:3,e:"★圧縮記帳は【非課税ではなく『課税の繰延べ』】。保険差益に今すぐ課税されると代替資産を買う資金が足りなくなるので、【今年の利益を消す代わりに帳簿価額を下げ、将来取り戻す】仕組み（以後の減価償却費が小さくなる／売却時の簿価が低いので所得が増える）。★『税金が消える制度』と誤解していると算式の意味が入らず、毎回どこかを取り違える。★対象＝保険金のほか、国庫補助金・工事負担金・交換・収用など。",s:"2026-1 Q46（真因＝アルゴリズムの理解不足）★Tier1"},
 {id:"R97",t:1,q:"★圧縮限度額の算式にある『代替資産の取得価額 ÷（保険金等の額−支出経費）』という分数は、何を表しているか?",c:["代替資産の値引率","代替資産の減価償却率","受け取った正味の保険金のうち、代替資産の取得に充てた割合","保険金の受取率"],a:2,e:"★分数＝【正味の保険金のうち、どれだけを代替資産の取得に充てたか】の割合。★全額を代替資産に充てれば1（＝保険差益の全額を圧縮できる）／半分しか充てず手元に残せば0.5（＝【残したお金には課税する】ので半分だけ）。★分母が【保険金そのものではなく保険金−支出経費】なのは、支出経費は手元に残らないから＝『差し引き後に手元にある金額で割る』と考えれば忘れない。★意味が分かれば、算式を暗記していなくても組み立て直せる。",s:"2026-1 Q46★Tier1"},
 {id:"R98",t:1,q:"◆保険金400万円（滅失により支出した経費はなし・滅失資産の帳簿価額300万円）を受け取り、自己資金100万円を追加して代替資産を500万円で取得した。圧縮限度額は?",c:["0円","80万円","100万円（保険差益の全額）","125万円"],a:2,e:"★保険差益＝400−0−300＝【100万円】。分数＝500÷400＝1.25だが、【分数は1を超えない】（分子は分母が上限）。→ 圧縮限度額＝100万×1＝【100万円】＝保険差益の全額。★受け取った保険金以上を代替資産に充てている＝手元に残していないので、全額を圧縮できる。★誤答125万＝分数1.25をそのまま掛けたもの（保険差益を超える圧縮はできない）。★逆に代替資産が保険金より安ければ、その割合分しか圧縮できず残りは課税される。",s:"2026-1 Q46（分数が1で頭打ちになるケース）★Tier1"},
 {id:"R99",t:1,q:"★最高解約返戻率88.4%（85%超）の定期保険。年払保険料2,341,600円を6年目（当初10年以内）に支払ったときの資産計上額は?",c:["1,404,960円","1,862,976円","2,070,374円","2,107,440円"],a:1,e:"★正しい式＝【保険料 × 最高解約返戻率 × 90%】＝2,341,600×88.4%×90%＝【1,862,976円】。★誤答2,107,440＝【保険料×90%】＝『90%は保険料に掛ける』という誤記憶（最頻・2026-08-03に判明）。90%は【最高解約返戻率に掛ける】係数。★誤答2,070,374＝保険料×88.4%（90%の掛け忘れ）。★誤答1,404,960＝保険料×60%（70%超85%以下の区分と取り違え）。★【保険料 →×最高解約返戻率 →×90%】の3段を必ず書き下す。",s:"2026-1 Q27（誤記憶を実数で潰す）★Tier1"},
 {id:"R100",t:1,q:"【2025-2 Q8の設例】生命保険料控除で、一般生命保険料控除の対象が②終身保険84,000円（2007年契約＝旧）と③介護保障保険23,800円（2020年契約＝新）の2つであるとき、一般生命保険料控除の額として正しいものは?",c:["2つを合算した107,800円を旧制度の速算表に入れて50,000円","旧の②のみで計算した46,000円","新旧を併用して上限の40,000円","新の③のみで計算した21,900円"],a:1,e:"★【新契約と旧契約の保険料を足してから速算表に入れることは絶対にない】。新は新の表、旧は旧の表で【それぞれ控除額まで出してから】比べる。②旧84,000→84,000×1/4＋25,000＝46,000／③新23,800→23,800×1/2＋10,000＝21,900／併用すると【新旧併用時の上限40,000円】に縛られる。よって最大は【旧のみの46,000円】＝③は使わない方が得。★2025-2 Q8では107,800円を旧表に入れて50,000円とし、合計113,600円と誤答した（正解109,600円）。★上限＝旧のみ50,000円／新のみ40,000円／併用40,000円。介護医療は新制度のみで40,000円。★③介護保障保険が『介護医療』ではなく『一般』に入る理由＝死亡保険金と介護保険金が同額で保険料の区分がないため（主たる保障が明確でない場合は一般）＝R117参照。",s:"2025-2 Q8(実際に失点した設例)★Tier1／26①Q6に続く【RC4の2回連続失点】／2026-08-06 新規"},
 {id:"R101",t:1,q:"生命保険料控除の新旧併用の有利判定について、正しいものはどれか?",c:["対象になる契約はすべて足し合わせて計算するのが常に有利である","新契約を計算に入れない方が控除額が大きくなる場合がある","旧契約がある場合は必ず新契約と併用して計算する","新契約が1つでもあれば全体を新制度のみで計算する"],a:1,e:"★【全部足すのが有利とは限らない】。新旧を併用すると各区分の上限が【40,000円】に下がるため、旧契約だけで40,000円を超える控除が取れるなら【新契約を捨てた方が得】になる。★2025-2 Q8の一般区分＝旧のみ46,000円 ＞ 併用40,000円 となり、新契約（21,900円）を使わないのが正解だった。★手順化＝【新のみ／旧のみ／併用】の3通りを全部出してから最大を選ぶ。『対象になるものは全部入れる』という反射で処理しない。",s:"2025-2 Q8の派生論点★Tier1／2026-08-06 新規"},
 {id:"R102",t:1,q:"税制適格特約付個人年金保険について、2025年11月までに66,000円を支払ったが、12月分6,000円は口座残高不足で引き落とせず2026年1月に支払った。2025年分の個人年金保険料控除の計算に使う金額は?",c:["72,000円（年間の契約上の保険料）","66,000円（実際に支払った額）","60,000円","0円（未払いがあるため対象外）"],a:1,e:"★【生命保険料控除はその年に実際に支払った額だけが対象】。引き落とし不能で翌年に払った分は【翌年分】の控除になる。★2025-2 Q8で72,000円として計算すると個人年金の控除が41,500円ではなく43,000円となり、合計111,100円の誤答肢に着地する。★逆に【自動振替貸付で充当された保険料は『支払った』ものとして含める】（貸付だが保険料に充当済みのため）。この2つは必ずセットで覚える。",s:"2025-2 Q8(注4)★Tier1／2026-08-06 新規"},
 {id:"R103",t:1,q:"【2025-2 Q5の設例】5年保証期間付終身年金（年金年額30万円）に加入。年金の支給開始年齢は65歳で、現在67歳の女性である。必要経費の計算に使う年金総支給見込額を出すとき、余命年数表は何歳で引くか?",c:["現在の年齢である67歳（17年）","年金の支給開始日における年齢である65歳（18年）","保証期間の5年","平均寿命までの年数"],a:1,e:"★【余命年数は『年金の支給開始日における年齢』で引く】。現在年齢で引くと総支給見込額が変わり、必要経費割合から先が全部ずれる。★2025-2 Q5＝65歳女性→18年→総支給見込額＝30万×18年＝540万→必要経費割合＝500万÷540万＝0.9259…→（小数点以下第3位切上げ）0.93→必要経費＝30万×0.93＝27.9万→雑所得＝2.1万円。★保証期間付終身年金の総支給見込額は【余命年数と保証期間の長い方】を使う（18年＞5年なので18年）。",s:"2025-2 Q5(実際に失点した設例)★Tier1／26①Q7に続く【RC6の2回連続失点】／2026-08-06 新規"},
 {id:"R104",t:1,q:"【2025-2 Q5の設例】父から相続した個人年金保険（10年確定年金・年金額90万円・父の払込保険料総額810万円）について、資料に『総収入金額算入額（課税部分）：1.2万円』とある。雑所得に算入すべき金額は?",c:["1.2万円（課税部分をそのまま算入する）","0.12万円（課税部分1.2万円から必要経費1.08万円を引く）","90万円（年金額の全額）","0円（相続税が課税済みなので所得税は非課税）"],a:1,e:"★【課税部分にも必要経費がある】。相続税と所得税の二重課税を排除した後の課税部分1.2万円に対しても、払込保険料の按分を必要経費として控除する。年金総額＝90万×10年＝900万→必要経費割合＝810万÷900万＝0.9→必要経費＝1.2万×0.9＝1.08万→雑所得＝【0.12万円】。★課税部分1.2万円をそのまま足すと合計103.42万円となり、用意された誤答肢に着地する（正解102.22万円）。",s:"2025-2 Q5(実際に失点した設例)★Tier1／2026-08-06 新規"},
 {id:"R105",t:1,q:"【2025-2 Q10の設例】保険証券から死亡時の受取額を集計する。見直し後の証券に『死亡保険金受取人：死亡保険金はございません』と記載されている場合、この契約から死亡時に受け取れる金額は?",c:["0円（死亡保険金がないため）","10万円（死亡時払戻金＝入院給付金日額10,000円の10倍）","100万円（がん診断給付金）","証券に記載がないので判断できない"],a:1,e:"★【『死亡保険金なし』で終わらせない】。死亡時払戻金・死亡給付金・死亡返戻金など【別の名前で死亡時に出る項目】が特約表の下に紛れている。2025-2 Q10では死亡時払戻金＝入院給付金日額×10倍＝10万円があり、これを落とすと差額が3,540万円（誤答）になる（正解3,530万円）。★【年金型の特約も死亡時に足す】＝特定状態収入保障特約には『年金支払開始日前に死亡されたとき、特約死亡給付金（年金額1年分＝240万円）』がある。『年金』と書いてあるから死亡には関係ない、と飛ばさない。★RC8は難しい計算ではなく【拾い切る作業】＝表の全行を上から最後まで潰す。",s:"2025-2 Q10(実際に失点した設例)★Tier1／RC8＝第2回限定の型で次回も出る／2026-08-06 新規"},
 {id:"R106",t:1,q:"事業保障資金の必要額を生命保険の死亡保険金で準備する場合、法人税等控除後でも必要額を確保できる保険金額の求め方として正しいものは?",c:["必要額をそのまま保険金額とする","必要額 ÷（1−法人税等の実効税率）で割り戻す","必要額 ×（1−法人税等の実効税率）","必要額 ×（1＋法人税等の実効税率）"],a:1,e:"★【死亡保険金は益金に算入され法人税等が課される】ため、必要額そのままの保険金額では税引後に足りなくなる。【必要額÷(1−実効税率)】で割り戻す。例＝必要額1億円・実効税率30%なら 1億÷0.7＝約1億4,286万円。★掛ける(×)と割る(÷)を逆にするのが最頻の誤り。『税金で目減りするから、あらかじめ多めに用意する＝割り戻す』と方向を先に決めてから電卓を打つ。★事業保障資金の必要額そのものは、短期借入金・買掛金・当面の固定費など設例の指示どおりに積み上げる。",s:"2025-2 Q26★Tier1／26①Q42(利益総合)に続くRC9c帯の2回連続失点／2026-08-06 新規"},
 {id:"R107",t:1,q:"従業員の退職金準備制度に関する次の記述のうち、正しいものはどれか?",c:["中小事業主掛金納付制度（iDeCo＋）では、従業員が掛金を拠出せず中小事業主のみが拠出することも可能である","iDeCo＋は従業員が拠出することが必須で、事業主のみの拠出はできない","中退共で懲戒解雇により減額された退職金は、掛金を拠出した企業に返金される","法人契約の養老保険による退職金準備では、被保険者となる従業員の告知は不要である"],a:0,e:"★【iDeCo＋は事業主のみの拠出も可能】（従業員の拠出が0円でもよい）。対象は従業員300人以下の企業。★【中退共の減額分は企業に返金されない】。掛金は事業主が全額負担し、いったん納付した掛金は返還されないのが原則。★【法人契約の養老保険でも被保険者の告知は必要】＝生命保険である以上、健康状態の確認は避けられない。『告知不要で確実に準備できる』という言い回しは誤り。",s:"2025-2 Q28★Tier1／26①Q28に続く退職金制度帯の失点／2026-08-06 新規"},
 {id:"R108",t:1,q:"保険料の未払いで失効した終身保険を元に戻す『復活』について、正しいものはどれか?",c:["未払いの保険料を払い込めばよく、告知や医師の診査は不要である","未払いの保険料の払込みに加えて、告知（必要に応じて医師の診査）が必要である","いったん失効した契約を復活させることはできない","復活すると保険料は復活時の年齢で再計算される"],a:1,e:"★【復活には告知（必要に応じて医師の診査）が必要】。健康状態が悪化していると復活できないことがある。『未払保険料を払えばよい』は誤り＝2025-2 Q1の誤答肢。★復活できる期間は失効から一般に3年以内。★【保険料は失効前と同じ】＝契約時の年齢・予定利率が引き継がれるため、新規に入り直すより有利になりうる（復活時の年齢で再計算されるわけではない）。★同じ問の正解肢＝【保険期間中に受け取る配当金には所得税・住民税は課税されない】（保険金等と一体で課税されるため）。",s:"2025-2 Q1★Tier1／2026-08-06 新規"},
 {id:"R109",t:1,q:"生命保険会社のディスクロージャー資料の用語に関する次の記述のうち、誤っているものはどれか?",c:["エンベディッド・バリュー（EV）は、業界統一の技術的手法を用いて算出する","EVは修正純資産と保有契約価値を合算した額である","格付けの対象項目や定義・記号は、格付機関により異なる","変額保険や変額個人年金保険の特別勘定は、他の勘定と分離して運用している"],a:0,e:"★【EVの算出方法は各社で異なり、業界統一の手法ではない】＝これが誤り（2025-2 Q2）。EV＝修正純資産＋保有契約価値、という構成自体は正しい。★選択肢に【統一・一律・必ず・すべて】という語が出たら疑うのが読解の定石。★保有契約高（個人年金保険）＝年金支払開始【前】の契約は年金支払開始時における年金原資の額、支払開始【後】の契約は責任準備金の額、の合計。",s:"2025-2 Q2★Tier1／2026-08-06 新規"},
 {id:"R110",t:1,q:"医療費控除の対象になる通院費として、正しいものはどれか?",c:["自家用車で通院した場合のガソリン代・駐車場代","電車・バスなど公共交通機関を利用した通院費","自家用車で通院した場合の高速道路料金","付添いを頼んだ親族へ支払った謝礼"],a:1,e:"★【自家用車のガソリン代・駐車場代・高速道路料金は医療費控除の対象外】。対象は【公共交通機関（電車・バス）の通院費】で、領収書が出ないものは日付・区間・金額の記録があればよい。★タクシー代は【公共交通機関が利用できない事情がある場合（急病・深夜・歩行困難など）に限り対象】。★2025-2 Q7では自家用車の通院費を対象に含めて計算していた（結果的に近い選択肢を選んで正答したが計算自体は誤り）。★その他の対象外＝本人希望の差額ベッド代／医師への謝礼／入院中の身の回り品／予防目的のビタミン剤／異常なしだった健康診断の費用。",s:"2025-2 Q7(計算過程の誤り・結果的正答)★Tier1／2026-08-07 新規"},
 {id:"R111",t:1,q:"2024年（令和6年）10月から導入された、先発医薬品（長期収載品）を希望した場合に支払う『特別の料金』（選定療養）は、医療費控除の対象になるか?",c:["対象になる。先発医薬品の価格の一部に相当する額の支払いであり、治療・療養に必要な医薬品の購入の対価にあたるため","対象にならない。保険が適用されない特別料金であるため","対象になるが、支払額の2分の1のみである","処方箋に基づく場合に限り対象外となる"],a:0,e:"★【対象になる】。国税庁の見解では、この特別の料金は【対象となる先発医薬品の価格の一部に相当する金額を支払うもの】と位置づけられ、【治療または療養に必要な医薬品の購入の対価】として医療費控除の対象になる。★2024年10月導入の新しい論点＝出題されやすい。★判定軸は【保険が効くかどうか】ではなく【治療・療養に必要な対価かどうか】。『保険外だから対象外』と反射しない。★2025-2 Q7ではこれを対象外として計算していた。",s:"2025-2 Q7(令和6年10月導入の新論点)★Tier1／2026-08-07 新規"},
 {id:"R112",t:1,q:"【2025-2 Q5 Step1】マッチング拠出により本人が250万円を拠出していた企業型確定拠出年金（企業型DC）から受け取る年金30万円は、雑所得の計算上どう扱うか?",c:["公的年金等に該当し、収入金額に全額を算入する","私的年金として、本人拠出額250万円を必要経費に按分する","本人が拠出した部分に対応する金額は非課税となる","一時所得として扱う"],a:0,e:"★【企業型DCの年金は公的年金等】。マッチング拠出（本人拠出）分も含めて【全額】が公的年金等の収入金額になる。★理由＝掛金を拠出した時点で【小規模企業共済等掛金控除】として全額が所得控除されており、拠出時に課税されていないため、受取時に課税するのが原則。『自分で250万円出したから一部は非課税では?』は誤り。★公的年金等に入るもの＝老齢基礎・老齢厚生／確定拠出年金（企業型DC・iDeCo）／確定給付企業年金・厚生年金基金／小規模企業共済の分割受取。★この仕分けを誤ると2025-2 Q5では選択肢1（89.62万円）に着地する。",s:"2025-2 Q5 Step1(仕分け)★Tier1／26①Q7と同じ論点＝2回連続／2026-08-07 新規"},
 {id:"R113",t:1,q:"【2025-2 Q5 Step3】5年保証期間付終身年金（年金年額30万円・支給開始65歳・女性・支給開始時の余命年数18年）の必要経費を計算するとき、年金支給総額の見込額はいくらか?",c:["150万円（30万×保証期間5年）","540万円（30万×余命年数18年）","690万円（30万×（18年＋5年））","300万円（30万×10年）"],a:1,e:"★【保証期間付終身年金の支給総額見込額＝年金年額×（余命年数と保証期間の『長い方』）】。18年＞5年なので18年を採用し、30万×18年＝【540万円】。足し算（18＋5）ではない。★対して【確定年金】は単純に年金年額×確定期間（10年確定年金なら×10年）。★まず【契約種別（終身か確定か）】を確認してから使う年数を決める、を手順として固定する。★続き＝必要経費割合500万÷540万＝0.9259…→（小数点以下第3位切上げ）0.93→必要経費＝30万×0.93＝27.9万→雑所得＝2.1万円。",s:"2025-2 Q5 Step3(支給総額見込額)★Tier1／2026-08-07 新規"},
 {id:"R114",t:1,q:"【2025-2 Q5 通し計算】①老齢厚生・老齢基礎年金180万円＋②企業型DC30万円／③個人年金の雑所得2.1万円／④相続した個人年金の雑所得0.12万円。67歳・他に所得なしのとき、2025年分の雑所得の合計は?（公的年金等控除＝65歳以上・収入330万円以下で110万円）",c:["89.62万円","102.22万円","103.42万円","111.10万円"],a:1,e:"★公的年金等＝180万＋30万＝210万−110万＝【100万円】／③個人年金【2.1万円】／④相続年金【0.12万円】→合計【102.22万円】。★4つの選択肢は、それぞれ次の誤りに対応して作られている。【89.62万】＝②企業型DCを公的年金等に入れず私的年金として計算した（180−110＝70万＋DC17.4万＋2.1＋0.12）。【103.42万】＝④の課税部分1.2万円から必要経費1.08万円を引き忘れた。【111.10万】＝④の二重課税調整を無視し、通常の年金として90万×(1−0.9)＝9万円を雑所得とした。★得点ポイントは3つ＝①企業型DCは公的年金等、②保証期間付終身年金は余命年数と保証期間の長い方、③相続年金は課税部分にも経費按分がある。",s:"2025-2 Q5 通し★Tier1／2026-08-07 新規"},
 {id:"R115",t:1,q:"【2025-2 Q6】父が契約者だった変額保険（満期保険金700万円・払込保険料総額500万円）について、父から本人へ名義変更が行われた（相続・遺贈ではなく父は存命）。払込保険料の内訳は父200万円・本人300万円である。本人が満期保険金を受け取った場合、一時所得の総収入金額はいくらか?",c:["700万円（満期保険金の全額）","500万円（満期保険金から父の負担額200万円を引いた額）","420万円（700万円×本人の負担割合300万÷500万）","300万円（本人が負担した保険料の額）"],a:2,e:"★【保険金は『負担割合』で按分する。『負担金額』を引くのではない】。本人の負担割合＝300万÷500万＝0.6 → 一時所得の総収入金額＝700万×0.6＝【420万円】。必要経費は本人が負担した300万円なので、差益＝420−300＝【120万円】。★父が負担した部分に対応する700万×0.4＝280万円は【贈与税】の対象であって所得税ではない。★2025-2 Q6の誤答要因＝この按分を金額の引き算で処理したこと。★名義変更が【相続・遺贈】による場合は扱いが変わる（相続税の対象）ので、まず変更の原因を確認する。",s:"2025-2 Q6(本人申告で判明した真因)★Tier1／2026-08-07 新規"},
 {id:"R116",t:1,q:"【2025-2 Q6 通し計算】①変額保険（名義変更の按分後の差益120万円）②養老保険（満期300万−払込320万）③終身保険の死亡保険金（契約者・受取人＝本人／被保険者＝母。保険金1,000万から契約者貸付金と利息60万を控除した940万を受領・払込500万）④一時払終身保険の解約（返戻金360万−払込300万・4年8ヵ月で解約）。総所得金額に算入すべき一時所得の金額は?",c:["275万円","305万円","315万円","345万円"],a:1,e:"★差益を合計してから【特別控除50万円】を引き、【2分の1】する。①120万＋②▲20万＋③500万＋④60万＝660万 →（660−50）×1/2＝【305万円】。★③の契約者貸付金は【控除前の1,000万円】が総収入金額（貸付金は借入金であり、保険金と相殺されただけ）。940万で計算すると差益440万となり315万円の誤答に着地する。★②の損失20万円は同じ一時所得内で通算する。★④一時払終身保険は【金融類似商品に該当しない】ため、5年以内の解約でも源泉分離課税ではなく一時所得（金融類似商品は一時払養老保険・一時払損害保険等）。",s:"2025-2 Q6 通し★Tier1／2026-08-07 新規"},
 {id:"R117",t:1,q:"【2025-2 Q8】2020年契約の介護保障保険で、死亡保険金額と介護保険金額が同額であり、各保障に応じた保険料の区分がない場合、生命保険料控除のどの区分に入るか?",c:["介護医療保険料控除（商品名が介護保障保険であるため）","一般生命保険料控除（主たる保障がどちらか明確でないため）","死亡と介護で保険料を2分の1ずつ按分してそれぞれの区分に入れる","生命保険料控除の対象外"],a:1,e:"★【保険料の区分がなく、主たる保障がどちらか明確でない場合は『一般生命保険料控除』】。商品名に『介護』が付いていても介護医療には入らない＝2025-2 Q8のひっかけ。★名前で判断せず【保障内容と保険料区分の有無】で判定する。★対比して覚える＝【損害保険会社が販売する医療保険・がん保険は『介護医療』】（引受会社ではなく保障内容で決まる）。どちらも『名前や会社で決めない』という同じ原則の裏表。★この設例では一般区分に旧契約の終身保険（84,000円）もあるため、旧のみ46,000円／新のみ21,900円／併用（上限40,000円）を比べ、【旧のみの46,000円】が最大になる。",s:"2025-2 Q8(本人申告で判明した論点)★Tier1／2026-08-07 新規"},
 {id:"R118",t:1,q:"【2025-2 Q8 通し計算】①団体医療保険24,200円（2010年契約・毎年4月1日に自動更新）②終身保険84,000円（2007年契約）③介護保障保険23,800円（2020年契約・保険料区分なし）④税制適格特約付個人年金66,000円（2008年契約・12月分6,000円は残高不足で翌年払い）。所得税の生命保険料控除の合計額は?",c:["103,600円","109,600円","111,100円","113,600円"],a:1,e:"★区分ごとに【新は新の表・旧は旧の表】で控除額まで出してから比べる。★一般＝②旧84,000→84,000×1/4＋25,000＝46,000／③新23,800→23,800×1/2＋10,000＝21,900／併用は上限40,000 →【旧のみ46,000円】が最大。★介護医療＝①【自動更新は更新のたびに新契約＝新制度】24,200→24,200×1/2＋10,000＝【22,100円】。★個人年金＝④旧・税制適格で【実際に支払った66,000円】→66,000×1/4＋25,000＝【41,500円】。合計【109,600円】。★誤答の型＝111,100円は④を72,000円（未払の12月分を含めた）で計算したもの／113,600円は②旧と③新を合算して107,800円とし旧表の上限50,000円としたもの。",s:"2025-2 Q8 通し★Tier1／26①Q6に続くRC4の2回連続失点／2026-08-07 新規"},
 {id:"R119",t:1,q:"生命保険契約の『名義変更（契約者変更）』について、変更の方向ごとの扱いとして正しい組み合わせはどれか?",c:["方向にかかわらず、変更した時点で変更後の契約者に課税される","個人から個人＝変更時は課税されず保険金受取時に負担割合で按分／個人から法人＝法人がその時点の解約返戻金相当額で買い取る／法人から個人＝解約返戻金相当額で評価して現物支給する","個人から個人の変更のみ課税対象で、法人が関わる変更に課税関係は生じない","すべて贈与税の対象となる"],a:1,e:"★【名義変更は『誰から誰へ』で課税される人・税目・経理処理がすべて変わる】。1つの論点として括らず、設問を読んだら【まず矢印を書く】。★2024-2では名義変更が3問（Q7＝法人→個人の現物支給／Q13＝個人→個人の税務／Q15＝個人→法人の経理処理）出題され、3問とも落とした。★個人→個人＝変更時点では課税されず、【保険金受取時に負担割合で按分】し他人負担分は贈与税（R115）。★個人→法人・法人→個人＝いずれも【その時点の解約返戻金相当額】を基準に評価する。",s:"2024-2 Q7・Q13・Q15(3問とも失点)★Tier1／2026-08-09 新規"},
 {id:"R120",t:1,q:"損害保険に関連する紛争解決機関について、正しいものはどれか?",c:["そんぽADRセンターは共済契約に関する紛争解決手続きも取り扱う","保険オンブズマンは、外資系損害保険会社や保険仲立人との間の紛争解決を取り扱う","日本損害保険協会は自賠責保険に関する紛争を一切取り扱わない","紛争解決機関は業態を問わず1つに統一されている"],a:1,e:"★【機関ごとに『誰との紛争を扱うか』が決まっている】。そんぽADRセンター（日本損害保険協会）＝会員である損害保険会社との紛争／保険オンブズマン＝【外資系損害保険会社・保険仲立人】との紛争／日本共済協会など＝共済。★共済は根拠法が異なるため、損保協会のADRの対象外になる点が繰り返し問われる。★2025-2 Q33と2024-2 Q32で【2回連続失点】。機関名と対象をセットで暗記する。",s:"2025-2 Q33 → 2024-2 Q32（2回連続失点）★Tier1／2026-08-09 新規"},
 {id:"R121",t:1,q:"労働災害総合保険の2つの条項について、正しいものはどれか?",c:["法定外補償条項は、政府労災保険の認定を基に、上乗せの補償を支払う","法定外補償条項は、事業主に法律上の賠償責任がある場合にのみ支払われる","使用者賠償責任条項は、政府労災保険の給付額をそのまま補償する","2つの条項はいずれか一方しか契約できない"],a:0,e:"★【役割分担で覚える】。法定外補償条項＝政府労災保険の【認定を基に】、法定給付に上乗せして支払う（事業主に賠償責任がなくても支払われる）。使用者賠償責任条項＝事業主に【法律上の損害賠償責任】が生じた場合に、政府労災の給付を超える部分を補償する（和解費用なども対象）。★2025-2 Q45と2024-2 Q46で【2回連続失点】。『上乗せ給付か、法的賠償責任か』の一点で切り分ける。",s:"2025-2 Q45 → 2024-2 Q46（2回連続失点）★Tier1／2026-08-09 新規"},
 {id:"R122",t:1,q:"【2024-2 Q4】相続により取得した年金受給権に基づき、相続開始の年（1年目）に受け取った確定年金について、所得税の雑所得に算入すべき金額は?",c:["受取額から必要経費を差し引いた金額を算入する","1年目は課税部分がゼロなので算入しない（非課税）","受取額の全額を算入する","相続税評価額との差額を算入する"],a:1,e:"★【相続等で取得した年金は、課税部分が年数の経過に応じて階段状に増える方式で、1年目の課税部分はゼロ＝非課税】（所得税法施行令。最高裁平成22年判決を受けた二重課税調整）。受給権にすでに相続税が課税されているため、初年度は所得税の対象にならない。★2024-2 Q4では、必要経費を除いた18,000円を雑所得に計上して失点した。★対比＝2025-2 Q5では受給が2年目以降のため【総収入金額算入額（課税部分）1.2万円】が与えられ、そこからさらに必要経費を按分して引いた（R104）。★手順＝①相続で取得した年金か → ②何年目か → 1年目なら計上ゼロ／2年目以降は課税部分から必要経費を引く。",s:"2024-2 Q4(実際に失点した設例)★Tier1／RC6は26①Q7・25②Q5に続く3回連続失点／2026-08-09 新規"},
 {id:"R123",t:1,q:"医療費控除の対象について、正しい組み合わせはどれか?",c:["薬局で購入した治療目的の一般用医薬品＝対象／視力矯正用のコンタクトレンズ＝対象外","薬局で購入した一般用医薬品＝対象外／視力矯正用のコンタクトレンズ＝対象","どちらも対象になる","どちらも対象外である"],a:0,e:"★【治療目的なら、医師の処方がなくても薬局で購入した一般用医薬品（風邪薬・胃腸薬など）は対象】。処方薬か市販薬かで決まらない。★【視力矯正用のメガネ・コンタクトレンズは対象外】（治療ではなく矯正のため）。ただし白内障術後など【治療のために医師の指示で購入する特殊なものは対象】。★2024-2 Q5では一般用医薬品を除外して失点した（コンタクトレンズを除外した判断は正しかった）。★判定軸は一貫して【治療・療養に必要な対価か】＝R111の選定療養費と同じ原則。予防・健康増進目的（ビタミン剤・サプリ）は対象外。",s:"2024-2 Q5(実際に失点した設例)★Tier1／医療費控除は26①Q5◯・25②Q7◯から初失点／2026-08-09 新規"},
 {id:"R124",t:1,q:"【2024-2 Q6・難問】2011年以前に契約した生命保険（旧制度）に、2024年の年の途中で医療保障の特約を中途付加した。この年に支払った保険料の生命保険料控除の扱いとして正しいものは?",c:["その年の保険料は全額が新制度の対象になる","中途付加日以後に支払った保険料は新制度、付加日前に支払った保険料は旧制度のまま区分する","その年の保険料は全額が旧制度のままである","翌年から新制度に切り替わる"],a:1,e:"★【切り替えは『年単位』ではなく『中途付加日』で区切る】。付加日以後に支払った保険料＝新制度／付加日前に支払った保険料＝旧制度のまま。年の途中の付加なら、その年の保険料は【日付で2つに分けて】それぞれの速算表で計算する。★2024-2 Q6ではこれを年単位で丸ごと新制度へ切り替えたため3,000円ズレた。★対比＝2025-2 Q8の【指定代理請求特約】の中途付加は保障内容の変更にあたらないため【旧制度のまま】。★つまり付加した特約が【保障内容を変えるものか】をまず判定し、変えるものなら【付加日で区切る】。★この問題は生成AI（Gemini Pro・Fable 5）も同じ誤答を選んだ難問。RC4は『易・満点狙い』と決めつけず、難問化しうる型として扱う。",s:"2024-2 Q6(実際に失点した設例・超難問)★Tier1／RC4は26①Q6・25②Q8に続く3回連続失点／2026-08-09 新規"},
 {id:"R125",t:1,q:"長期平準定期保険（2019年7月8日以前契約）の保険料の経理処理として正しいものは?",c:["保険期間の全期間にわたり支払保険料の全額を損金に算入する","保険期間の前半6割の期間は支払保険料の1/2を前払保険料として資産計上し残り1/2を損金算入、後半4割の期間は全額を損金算入しつつ前払保険料を期間の経過に応じて均等に取り崩して損金算入する","前半4割の期間で1/2を資産計上し、後半6割で取り崩す","支払保険料の全額を保険期間にわたり資産計上する"],a:1,e:"★【前半6割＝1/2資産（前払保険料）＋1/2損金／後半4割＝全額損金＋前払保険料を均等取崩し】。取り崩した分も損金になるため、後半は損金が大きくなる。★『6割・4割』と『1/2』の2つの数字をセットで覚える。★2024-2 Q7ではこの計算ステップが未定着で、名義変更時の前払保険料の帳簿残高を出せず失点した。★区別＝2019年7月8日【以後】の契約は長期平準の区分ではなく【最高解約返戻率】による区分（50%以下／50%超70%以下／70%超85%以下／85%超）で判定する（R25〜R30）。契約日で適用ルールが変わる。",s:"2024-2 Q7★Tier1／2026-08-09 新規"},
 {id:"R126",t:1,q:"【2024-2 Q7】役員退職慰労金8,000万円を、生命保険の名義変更（現物支給）と現金で支給する。名義変更時の解約返戻金相当額は4,200万円、前払保険料の帳簿残高は26,928,000円である。この場合の経理処理として正しいものは?",c:["借方 退職金80,000,000／貸方 現金38,000,000・前払保険料26,928,000・雑収入15,072,000","借方 退職金80,000,000／貸方 現金80,000,000","借方 退職金42,000,000／貸方 前払保険料42,000,000","借方 退職金80,000,000・雑損失15,072,000／貸方 現金38,000,000・前払保険料26,928,000"],a:0,e:"★手順＝①【現物の評価は名義変更時の解約返戻金相当額】＝4,200万円 → ②現金支給額＝8,000万−4,200万＝【3,800万円】 → ③保険が会社の手を離れるので【前払保険料の帳簿残高を全額取り崩す】＝26,928,000円 → ④借方8,000万と貸方(3,800万＋2,692.8万＝6,492.8万)の差額【15,072,000円を雑収入】として益金算入。★差額が貸方に出る＝【雑収入】（解約返戻金相当額が帳簿残高を上回っているため）。借方に出れば雑損失。どちら側に立つかを毎回確認する。★退職金は損金だが、雑収入で相殺される分だけ課税所得への影響は小さくなる。",s:"2024-2 Q7(実際に失点した設例)★Tier1／2026-08-09 新規"},
 {id:"R127",t:1,q:"【2024-2 Q13】被相続人が契約者・被保険者であった年金保険の年金受給権を相続で取得し、契約者を自身に変更して継続する場合の課税関係として正しいものは?",c:["年金受給権は贈与税の対象となる","年金受給権は相続税の対象となり、その後受け取る年金は雑所得として所得税の対象となる","年金受給権にも受け取る年金にも課税されない","受け取る年金は一時所得となる"],a:1,e:"★【相続で取得したのだから相続税】。生前贈与ではないので贈与税の対象にはならない。受給権に相続税が課税され、その後【受け取る年金は雑所得】として所得税の対象（ただし二重課税調整により1年目は非課税＝R122）。★2024-2 Q13では『贈与税の対象』とする肢を選んで失点した。★取得原因で税目が決まる＝【相続→相続税／生前贈与→贈与税／自分で払った→所得税】。名義変更の設問では【まず取得原因を確認する】。★選択肢に『全額が』などの強い限定語があっても、それだけで誤りとは判断しない（同問では『全額が』を含む肢が正解だった）。",s:"2024-2 Q13(実際に失点した設例)★Tier1／2026-08-09 新規"},
 {id:"R128",t:1,q:"【2024-2 Q15】法人成りに伴い、法人が個人から生命保険契約を【有償で】買い取る（解約返戻金相当額317万円＋積立配当金8万円＝325万円を支払う）場合の法人の経理処理は?",c:["支払額325万円の全額を支払保険料として損金に算入する","325万円の全額を保険積立金・配当金積立金として資産計上する（直ちに損金算入はできない）","325万円を雑損失として損金に算入する","資産計上せず、簿外で管理する"],a:1,e:"★【有償で買い取った＝価値ある財産を対価を払って取得した】ので、支払額は【全額を資産計上】（保険積立金317万・配当金積立金8万）。直ちに損金にはできない。★『保険料を払った』のではなく『保険という資産を買った』と捉えるのが核。★対比＝【無償譲渡】なら資産計上に加えて【同額を雑収入（受贈益）として益金算入】（R129）。★有償か無償かで益金が出るかどうかが変わるので、設問で【対価の授受があるか】を最初に確認する。",s:"2024-2 Q15(実際に失点した設例)★Tier1／2026-08-09 新規"},
 {id:"R129",t:1,q:"【2024-2 Q15】法人成りに伴い、法人が個人から生命保険契約を【無償で】譲り受ける場合（解約返戻金相当額317万円・積立配当金8万円）の法人の経理処理は?",c:["何も計上しない（対価を支払っていないため）","317万円を保険料積立金・8万円を配当金積立金として資産計上し、その合計額325万円を雑収入として益金に算入する","325万円を支払保険料として損金に算入する","317万円のみ資産計上し、配当金は無視する"],a:1,e:"★【無償で価値ある財産をもらった法人は、時価で資産計上し、同額を受贈益（雑収入）として益金算入する】。タダでもらって得をした分に課税されるという考え方。★時価＝解約返戻金相当額317万＋積立配当金8万＝【325万円】。★有償（R128）との違いは【益金が出るかどうか】の一点。有償＝資産計上のみ／無償＝資産計上＋雑収入。★2024-2 Q15はこの場合分けと仕訳アルゴリズムが未定着で失点した。名義変更の設問では【方向（誰から誰へ）】と【対価の有無】の2つを最初に確認する。",s:"2024-2 Q15(実際に失点した設例)★Tier1／2026-08-09 新規"},
 {id:"R130",t:3,q:"【2024-2 Q28】収入保障保険（年金年額360万円・支払回数5回・既払込正味保険料総額330万円・年金受給権の相続税評価額1,764万円）。相続税評価割合に対応する課税割合は2%、経過年数2年のとき、2036年分の雑所得の金額は?（必要経費の計算過程は小数点以下第3位切上げ・第2位まで）",c:["0円","58,320円","72,000円","87,480円"],a:1,e:"★【課税部分を出したら終わりではない。必要経費を引いて『雑所得』にするまでが解答】。参考式の④まで必ず実行する。★手順＝支払総額360万×5回＝1,800万／相続税評価割合＝1,764万÷1,800万＝98%→課税割合【2%】／課税単位数＝5×(5−1)÷2＝【10】／一課税単位当たり＝1,800万×2%÷10＝【36,000円】／②課税部分＝36,000×経過2年＝【72,000円】／③必要経費＝72,000×(330万÷1,800万＝0.1833…→切上げ【0.19】)＝【13,680円】／④雑所得＝72,000−13,680＝【58,320円】。★誤答の型＝72,000円は②の課税部分で止めた値（実際にこれを選んで失点）。★R104（相続年金は課税部分からも必要経費を引く）と完全に同じ論点。【式が印字されている問題ほど、最後の行まで指を置いて追う】。",s:"2024-2 Q28（8/10の再解答で誤答）／R104と同一論点／2026-08-10 新規／★2026-08-11 t1→t3へ降格＝【設問の不備】課税単位数の式を与えず・不要な相続税評価額を提示・経過年数を与えて本来の引っかけを消していた。加えて答えを記憶済み。後継＝R140（参考式込みの本番形式）・R141（経過年数）"},
 {id:"R131",t:1,q:"保険証券に『入院5日目から入院給付金を支払います』とある契約で、12日間入院した場合、入院給付金の支給対象となる日数は?",c:["12日","8日（12日−4日）","7日（12日−5日）","5日"],a:1,e:"★【『◯日目から』の免責日数は（◯−1）日】。5日目から支払われる＝1日目から4日目が不支給＝【免責4日】。支給日数＝入院日数−4＝12−4＝【8日】。★2024-2 Q10では『免責5日』として1日多く引いて失点した（12−5＝7日）。★日数の起点は毎回機械的に処理する（『◯日目から』なら◯−1を引く／『◯日を超えて』なら◯を引く）。★入院給付金は【日額×支給対象日数】。手術給付金は【日額×倍率】で別枠。",s:"2024-2 Q10（8/10の再解答で誤答）★Tier1／2026-08-10 新規"},
 {id:"R132",t:1,q:"保険証券から給付額を集計する際、拾い落としやすい項目として最も注意すべきものはどれか?",c:["入院給付金の日額","初回通院時の一時金や診断一時金などの単発の給付","手術給付金の倍率","保険料払込免除特約"],a:1,e:"★【単発の給付を足し忘れる】のがRC8の典型的な失点。日額×日数・日額×倍率という『掛け算の項目』に気を取られると、初回通院時の一時金・診断一時金・死亡時払戻金といった【1回だけ出る定額の給付】を落とす。★2024-2 Q10では初回通院時の1万円を足し忘れて失点した。★対策＝証券の表を【上から1行ずつ指でなぞり、支払事由に該当する行に印をつけてから合計する】。RC8は計算の難しさではなく【拾い切る作業の精度】で決まる。★あわせてR105（『死亡保険金はございません』でも死亡時払戻金がある）も確認する。",s:"2024-2 Q10（8/10の再解答で誤答）★Tier1／2026-08-10 新規"},
 {id:"R133",t:1,q:"★横断★ 地震・噴火・津波による損害について、次のうち原則として保険金が支払われるものはどれか（特約を付帯していない場合）",c:["噴火により被保険自動車が全損となった場合の一般車両保険","業務中に発生した地震で従業員が転倒しケガをした場合の普通傷害保険","地震により店舗が損壊し休業した場合の企業費用・利益総合保険","いずれも原則として支払われない（補償するには特約が必要）"],a:3,e:"★【地震・噴火・津波は原則すべての損保で対象外。補償するには必ず特約が必要】。火災保険（→地震保険が別途必要）／車両保険（→地震・噴火・津波危険『車両全損時一時金』特約）／傷害保険（→地震危険補償特約）／企業費用・利益総合保険（→地震危険補償特約）。★2024-2ではこの論点が【3問】に仕込まれていた（問39肢3＝噴火で車両全損／問42肢2＝地震で転倒／問43肢2＝地震で休業）。うち2問を落とした＝【このルール1つで3問取れた】。★選択肢に『地震』『噴火』『津波』の語を見たら、まず『対象外ではないか』を疑う。",s:"2024-2 Q39肢3・Q42肢2・Q43肢2（同じ回で3問）★Tier1／2026-08-10 新規"},
 {id:"R134",t:1,q:"【2024-2 Q29】定期保険（年払保険料3,025,800円）で、解約返戻率の推移から最高解約返戻率は18年経過時の86.7%と判定した。保険期間の開始から【13年】を経過する日における保険料支払時の資産計上額はいくらか?（円未満切捨て）",c:["2,361,031円（＝3,025,800×86.7%×90%）","1,836,358円（＝3,025,800×86.7%×70%）","1,210,320円","1,815,480円"],a:1,e:"★【85%超の区分は2段階。当初10年＝×90%／11年目以降＝×70%】。13年経過は11年目以降なので【70%】を使う。3,025,800×86.7%×70%＝【1,836,358円（前払保険料）】、支払保険料＝3,025,800−1,836,358＝1,189,442円。★誤答の型＝2,361,031円は当初10年の90%を13年目に適用したもの（実際にこれを選んで失点）。★【最高解約返戻率は『表の最大値』を探す】。この設例では13年経過時の84.8%ではなく18年経過時の86.7%が最大＝問われている年の返戻率をそのまま使わない。★R99は6年目（当初10年内＝90%）の設例なので、本問と対にして両方の期間を練習する。",s:"2024-2 Q29(実際に失点した設例)★Tier1／R99(6年目=90%)と対で練習／2026-08-10 新規"},
 {id:"R135",t:1,q:"雑損控除と災害減免法の比較として、正しいものはどれか?",c:["雑損控除は災害・盗難・横領による損害が対象で、詐欺による損害は対象外。控除しきれない金額は翌年以後3年間繰り越せる","雑損控除は詐欺による損害にも適用できる","雑損控除の繰越期間は翌年以後7年間である","災害減免法は自然災害だけでなく盗難・横領による損害も対象となる"],a:0,e:"★【表で覚える】。■雑損控除＝対象は【災害・盗難・横領】（詐欺・恐喝は対象外）／所得制限なし／控除しきれない分は【翌年以後3年間】繰越。■災害減免法＝対象は【災害のみ】（盗難・横領は対象外）／その年の所得金額の合計が【1,000万円以下】であることが要件／繰越なし。★2024-2 Q50では『7年間繰越』を選んで失点した（正しくは3年）。★2つの制度は【選択適用】＝有利な方を選ぶ。",s:"2024-2 Q50★Tier1／2026-08-10 新規"},
 {id:"R136",t:1,q:"生命保険契約照会制度（平時利用）の対象となる契約はどれか?",c:["照会受付日現在、有効に継続している契約のみ","有効に継続している契約に加え、すでに解約した契約も対象となる","過去10年間に締結されたすべての契約","保険金の支払いが完了した契約も含むすべての契約"],a:0,e:"★【照会受付日現在、有効に継続している契約だけが対象】。すでに解約した契約や、保険金の支払いが完了した契約は【対象外】。★2024-2 Q1では『解約した契約も対象となる』という記述を適切と判断して失点した（これが最も不適切＝正解肢）。★制度の趣旨＝認知症や災害・死亡で契約の把握が困難になったときに、生命保険協会を通じて【会員会社に契約の有無を確認】するもの。契約内容そのものを教えてくれる制度ではない。★同じ問の適切な記述＝【契約期間中に受け取る配当金は支払保険料から控除され課税されない／満期保険金と一緒に受け取る場合は一時所得】（2025-2 Q1の正解肢と同じ論点＝2回連続で問われている）。",s:"2024-2 Q1★Tier1／配当金の課税は25②Q1と2回連続／2026-08-10 新規"},
 {id:"R137",t:1,q:"外貨建て保険と標準責任準備金制度に関する記述として、正しいものはどれか?",c:["2022年4月1日以降に締結する契約より、すべての通貨での外貨建て保険が標準責任準備金制度の対象となった","標準責任準備金制度の対象となる外貨建て保険は一部の通貨に限られる","外貨建て保険は現在も標準責任準備金制度の対象外である","標準責任準備金は生命保険会社が任意に定める"],a:1,e:"★【対象は『すべての通貨』ではなく一部の通貨】（円換算した標準利率を算定できる通貨に限られる）。★2024-2 Q3では『すべての通貨』という記述を見抜けず、別の肢を誤りと判断して失点した。★【限定語（すべて・全額・統一・必ず）は『疑うきっかけ』になるが、それだけで切らない】。25②Q2は『業界統一の技術的手法』が誤りだったが、24②Q13は『全額が』を含む肢が正解だった。→ 手順＝①限定語に印をつける ②内容の正誤を確認する ③他の肢と比べて『最も』を選ぶ。★標準責任準備金＝【金融庁】が定める標準となる責任準備金（保険会社が任意に定めるものではない）。",s:"2024-2 Q3★Tier1／限定語の扱いは25②Q2・24②Q13と横断／2026-08-10 新規"},
 {id:"R138",t:1,q:"普通傷害保険（就業中のみの危険補償特約を付帯・その他の特約なし）で、補償の対象となるものはどれか?",c:["毎日の業務作業が原因で発症したけんしょう炎による通院","業務中に発生した地震により転倒してケガをし通院","出張中に熱中症にかかり入院","出勤途中の交通事故によるケガで死亡"],a:3,e:"★傷害保険は【急激・偶然・外来】の3要件を満たす事故が対象。★けんしょう炎＝反復動作による【疾病】で『急激』を満たさない→対象外。★熱中症＝原則【対象外】（熱中症危険補償特約が必要）。★地震・噴火・津波＝【対象外】（地震危険補償特約が必要）→R133。★【就業中のみの危険補償特約は、業務中に加えて『通勤中』も補償する】ので、出勤途中の交通事故によるケガは対象＝正解。★2024-2 Q42では地震の肢を選んで失点した。",s:"2024-2 Q42★Tier1／地震の論点はR133と共通／2026-08-10 新規"},
 {id:"R139",t:1,q:"自動車保険について、補償の対象となるものはどれか?",c:["運転中に誤って塀に衝突し、同乗していた配偶者がケガをした場合の対人賠償責任保険","噴火により被保険自動車が全損となった場合の一般車両保険","家族が運転中に他の自動車と衝突してケガをし通院した場合の人身傷害保険","被保険自動車で自宅の車庫を壊した場合の対物賠償責任保険"],a:2,e:"★【対人・対物賠償責任保険は『家族』を補償しない】。記名被保険者・配偶者・同居の親族・別居の未婚の子に対する賠償、および【自分や家族の財物】への損害は対象外（他人への賠償が目的の保険だから）。→ 配偶者のケガ（肢1）も自宅の車庫（肢4）も対象外。★噴火・地震・津波は車両保険の対象外→R133。★【人身傷害保険は、過失割合に関係なく被保険者本人と家族の損害を実損で補償する】＝正解。★2024-2 Q39で失点。あわせて運転者限定・年齢条件の判定（同居/別居・婚姻歴の2軸）も確認する。",s:"2024-2 Q39★Tier1／25②Q39(運転者限定)に続く自動車保険の失点／2026-08-10 新規"},
 {id:"R140",t:1,q:"【2024-2 Q28・本番形式】収入保障保険（年金年額360万円・支払回数5回・既払込正味保険料総額330万円・年金受給権の相続税評価額1,764万円）。2034年4月に被保険者が死亡し年金の支払いが開始、2036年4月に3回目の年金を受け取った。2036年分の所得税の雑所得はいくらか?　■参考式：相続税評価割合＝相続税評価額÷年金の支払総額／課税単位数＝残存期間年数×(残存期間年数−1)÷2／一課税単位当たりの金額＝支払総額×課税割合÷課税単位数／課税部分＝一課税単位当たりの金額×経過年数（1年未満切捨て）／必要経費＝課税部分×(既払込正味保険料総額÷支払総額)／雑所得＝課税部分−必要経費　■課税割合：92%超95%以下＝5%、95%超98%以下＝2%、98%超＝0%　※必要経費の計算過程は小数点以下第3位切上げ・第2位まで",c:["0円","58,320円","72,000円","87,480円"],a:1,e:"★参考式を上から順に埋めるだけ。【最後の行（雑所得＝課税部分−必要経費）まで指を置いて追う】。★①支払総額＝360万×5回＝【1,800万円】。②相続税評価割合＝1,764万÷1,800万＝【98%】→表より課税割合【2%】（95%超98%以下。98%『超』なら0%なので境界に注意）。③課税単位数＝残存期間5年×(5−1)÷2＝【10】。④一課税単位当たり＝1,800万×2%÷10＝【36,000円】。⑤経過年数＝2034年4月→2036年4月＝【2年】（3回目だから3年ではない→R141）。課税部分＝36,000×2＝【72,000円】。⑥必要経費＝72,000×(330万÷1,800万＝0.1833…→切上げ【0.19】)＝【13,680円】。⑦雑所得＝72,000−13,680＝【58,320円】。★誤答の型＝72,000円は課税部分で止めた値／87,480円は経過年数を3年とした値（36,000×3＝108,000→108,000×0.19＝20,520→87,480）／0円は1年目と誤ったもの。",s:"2024-2 Q28（R130の後継・参考式込みの本番形式）★Tier1／R104・R122と同一制度／2026-08-11 新規"},
 {id:"R141",t:1,q:"相続等で取得した年金の課税部分を計算する際の『経過年数』について、2034年4月に年金の支払いが開始され、2036年4月に3回目の年金を受け取った場合の経過年数は?",c:["1年","2年","3年","5年"],a:1,e:"★【経過年数＝年金の支払開始日から、その支払いを受ける日までの年数（1年未満切捨て）】。2034年4月→2036年4月＝【2年】。★【『3回目だから3年』ではない】。回数と経過年数は別物で、1回目＝経過0年、2回目＝1年、3回目＝2年、と1つずれる。★2024-2 Q28でこれを3年とすると、課税部分36,000×3＝108,000円→必要経費20,520円→雑所得87,480円となり、用意された誤答肢にちょうど着地する。★あわせて【残存期間年数】は年金の支払開始日における残りの期間（1年未満切上げ）で、課税単位数＝残存期間年数×(残存期間年数−1)÷2 に使う。経過年数と残存期間年数を取り違えないこと。",s:"2024-2 Q28の派生論点（R130の設問不備で消えていた引っかけを独立させたもの）★Tier1／2026-08-11 新規"},
 {id:"R142",t:1,q:"生命保険契約のクーリング・オフについて、対象と【ならない】ものはどれか?",c:["申込者が自ら指定して自宅で申し込んだ保険契約","保険期間が1年以内の保険契約","個人事業主が事業のために締結した保険契約","既存の保険契約に特約を中途付加した場合"],a:0,e:"★【自宅を『自ら指定』してもクーリング・オフの対象になる】＝これだけが対象。適用除外になるのは【保険会社の営業所等に自ら出向いて申し込んだ場合】で、自宅・勤務先は除外の対象外。★対象とならない（＝除外される）のは【保険期間1年以内】【営業・事業のための契約（個人事業主が事業のために締結）】【特約の中途付加】【保険会社の指定した医師の診査を受けた後】など。★2023-2 Q2では『自ら指定して自宅で申込み＝対象外』という記述を適切と判断して失点した。★クーリング・オフ期間＝申込日または書面交付日のいずれか【遅い日】から8日以内。",s:"2023-2 Q2★Tier1／2026-08-12 新規"},
 {id:"R143",t:1,q:"生命保険会社の勘定について、正しいものはどれか?",c:["一般勘定では、変額保険や変額個人年金保険など資産運用実績が直接保険金等に反映される資産も含めて運用・管理する","変額保険や変額個人年金保険の資産は特別勘定で、他の勘定と分離して運用・管理する","一般勘定と特別勘定に法令上の区別はない","特別勘定には予定利率による最低保証がある"],a:1,e:"★【変額保険・変額個人年金は『特別勘定』で、他の勘定と分離して運用する】。一般勘定は予定利率による最低保証があり、特別勘定は運用実績が直接保険金等に反映される（最低保証は原則なし）。★2023-2 Q3では『一般勘定で変額保険も運用する』という記述を見抜けず失点。★同じ論点が2025-2 Q2でも出ており（そちらは『特別勘定は他の勘定と分離して運用』＝正しい記述として提示）、【表裏の形で2回連続】出題されている。★ディスクロージャー用語はセットで＝基礎利益（経常利益からキャピタル損益と臨時損益を控除）／実質純資産額（時価ベース資産−資本性の高い負債を除く負債）／含み損益の一部はソルベンシー・マージン比率の分子に算入／EVは各社で算出方法が異なる（→R109）。",s:"2023-2 Q3★Tier1／25②Q2と表裏で2回連続／2026-08-12 新規"},
 {id:"R144",t:1,q:"契約者（保険料負担者）を父から母へ名義変更した保険で、母が保険料を払い込んだ後に母が死亡し、子が死亡給付金を受け取った。この給付金の課税関係として正しいものは?",c:["全額が相続税の課税対象となる","母が負担した保険料に対応する部分が相続税の対象で、父が負担した部分に対応する金額は別の扱いになる（負担割合で按分する）","全額が所得税（一時所得）の対象となる","全額が贈与税の対象となる"],a:1,e:"★【名義変更があった契約は『負担割合で按分』する。『全額が』とはならない】。誰がいくら保険料を負担したかで課税関係が分かれる。★2023-2 Q15では『全額が相続税の課税対象』という記述を見抜けず失点（これが最も不適切＝正解肢）。★【名義変更は方向と対価で判定】＝R119、【保険金は負担割合で按分】＝R115と同じ核。**名義変更の論点は26①Q8→25②Q6→24②Q13/Q15→23②Q15と繰り返し出ている**。★同じ問の適切な記述＝契約者変更には【被保険者の同意が必要】／変更後に自分が支払った保険料は【生命保険料控除の対象になる】。",s:"2023-2 Q15★Tier1／名義変更は4回連続で出題・R115/R119と同一核／2026-08-12 新規"},
 {id:"R145",t:1,q:"代償分割に関する記述のうち、正しいものはどれか?",c:["代償交付金を交付した場合と交付しなかった場合とで、交付した相続人が負担する相続税額は同額である","代償交付金を交付した相続人の課税価格は交付した額だけ減り、受け取った相続人の課税価格は増えるため、相続税額は変わる","代償交付金を分割払いで交付するには家庭裁判所の許可が必要である","遺留分侵害額の請求では現物の返還を求めることになる"],a:1,e:"★【代償分割は課税価格を付け替える】。交付した側は課税価格が減り、受け取った側は増えるので、各人の相続税額は当然変わる。『同額』は誤り（2023-2 Q20の正解肢）。★代償交付金の分割払いは【相続人全員の合意があればよく、家庭裁判所の許可は不要】。★2019年改正で遺留分侵害額請求は【金銭債権】となり、現物返還ではなく金銭の支払いを請求する。★代償金の準備には【契約者＝被相続人または後継者／被保険者＝被相続人／死亡保険金受取人＝後継者】の生命保険が使われる。★この論点は9月の相続科目と重複するので、先取りとして押さえる。",s:"2023-2 Q20★Tier1／相続科目と重複（先取り）／2026-08-12 新規"},
 {id:"R146",t:1,q:"法人が低解約返戻金型逓増定期保険に加入し、低解約返戻金期間中に役員個人へ名義変更（現物支給）する場合の評価として正しいものは?",c:["常に解約返戻金相当額で評価する","解約返戻金の額が資産計上額の70%相当額未満のときは、資産計上額相当を現物支給したものとして評価する","解約返戻金の額が資産計上額の70%相当額以上のときも、資産計上額で評価する","払済保険に変更してから名義変更すれば必ず洗替えが行われる"],a:1,e:"★【低解約返戻金型の名義変更は『70%ルール』】。解約返戻金が資産計上額の【70%相当額未満】のときは、解約返戻金ではなく【資産計上額】で評価する（低い解約返戻金を使って安く移転するのを防ぐため）。70%以上のときは解約返戻金額で評価し、資産計上額との差額を雑収入または雑損失で処理する。★【復旧することのできる払済保険への変更は『洗替えを行わない』】（2023-2 Q24の正解肢＝これを『洗替えされた資産計上額で評価する』と書いた肢が最も不適切）。★名義変更後に受け取るがん保険等の給付金は【身体の傷害に基因するため全額非課税】。★24②Q7（長期平準定期の現物支給）に続く【現物支給2回目の失点】。",s:"2023-2 Q24★Tier1／24②Q7に続く現物支給の失点／2026-08-12 新規"},
 {id:"R147",t:1,q:"中小企業退職金共済（中退共）に関する記述のうち、誤っているものはどれか?",c:["退職金は原則として退職者本人が請求するが、死亡退職の場合は会社が請求し、受け取った退職金を遺族へ支給する","会社都合で退職し請求せずに転職した場合、一定期間内なら前の勤務先の掛金納付月数を通算できる","懲戒解雇した従業員でも、中退共から支給される退職金を会社が不支給にすることはできない","掛金月額は従業員ごとに異なる額とすることができる"],a:0,e:"★【中退共の退職金は、中退共事業本部から『直接』退職者本人（死亡の場合は遺族）へ支払われる。会社を経由しない】＝これが誤り（2023-2 Q29の正解肢）。★この『会社は関与しない』という性質は一貫していて、24②Q28の【懲戒解雇で減額された分も企業には返金されない（国庫等に帰属）】と同じ構造。**中退共は2回連続で出題**。★掛金は事業主が全額負担し、従業員ごとに異なる額を設定できる。★通算制度＝退職後一定期間内に再就職して被共済者になれば掛金納付月数を通算できる。",s:"2023-2 Q29★Tier1／24②Q28に続く中退共2回目／2026-08-12 新規"},
 {id:"R148",t:1,q:"総合福祉団体定期保険および団体定期保険（Bグループ保険）に関する記述のうち、正しいものはどれか?",c:["総合福祉団体定期保険は原則全員加入だが、被保険者となることに同意しなかった従業員を被保険者とすることはできない","ヒューマン・ヴァリュー特約の特約死亡保険金は、保険会社から直接従業員の遺族へ支払われる","Bグループ保険では、加入者を性別・年齢で区分し区分ごとに料率を定める方式を『平均保険料率』という","Bグループ保険はどの企業でも退職後に継続加入できる"],a:0,e:"★【被保険者の同意がなければ被保険者にできない】（原則全員加入でも同意は必須）＝正解。★【ヒューマン・ヴァリュー特約の受取人は『法人』】。従業員の死亡による企業の経済的損失（採用・教育コスト等）を補填するもので、遺族へ直接支払われるのではない。主契約の死亡保険金の受取人が遺族であるのと対照的。★【用語の取り違えに注意】性別・年齢で区分する方式＝『年齢群団別保険料率』／全員一律の料率＝『平均保険料率』。2023-2 Q30ではこれを逆にした肢を選んで失点した。",s:"2023-2 Q30★Tier1／2026-08-12 新規"},
 {id:"R149",t:1,q:"法人契約の自動車保険で、対人賠償責任保険の補償の対象と【ならない】ものはどれか?",c:["従業員が業務で社有車を運転中に、構内で作業中の他の従業員を負傷させた場合","従業員が業務で社有車を運転中に、通行人を負傷させた場合","従業員が業務で社有車を運転中に、取引先の来訪者を負傷させた場合","従業員が私用で許可を得て社有車を運転中に、歩行者を負傷させた場合"],a:0,e:"★【対人賠償は『記名被保険者の業務に従事中の使用人』を免責】。従業員同士の事故は労災の領域であり、自動車保険では補償されない（2023-2 Q43の正解肢＝最も不適切）。★対人賠償の免責範囲をまとめて覚える＝①記名被保険者・その父母・配偶者・子（→R139の『家族』）②運転者本人とその父母・配偶者・子 ③【記名被保険者の業務に従事中の使用人】④被保険者の使用者の業務に従事中の他の使用人。★対物賠償も同様に【記名被保険者や運転者、その父母・配偶者・子の財物】は免責。ただし他の従業員の私有車は他人の財物なので対象になる。★24②Q39（家族は対人賠償の対象外）に続く【対人賠償の免責2回目】。",s:"2023-2 Q43★Tier1／24②Q39に続く対人賠償の免責2回目／2026-08-12 新規"},

/* ===== localStorage（累積の苦手・ベスト） ===== */
const MISS_KEY="cfpquiz_miss_v1", BEST_KEY="cfpquiz_best_v1";
function loadJSON(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function missMap(){return loadJSON(MISS_KEY)}
function missOf(sub,id){const m=missMap();return (m[sub]&&m[sub][id])||0}
function bumpMiss(sub,id,d){const m=missMap();m[sub]=m[sub]||{};m[sub][id]=Math.max(0,(m[sub][id]||0)+d);if(m[sub][id]===0)delete m[sub][id];saveJSON(MISS_KEY,m)}
function weakCount(sub){const m=missMap();return m[sub]?Object.keys(m[sub]).length:0}
function bestOf(sub){const b=loadJSON(BEST_KEY);return b[sub]}
function setBest(sub,n){const b=loadJSON(BEST_KEY);b[sub]=n;saveJSON(BEST_KEY,b)}

/* ===== 出題ロジック ===== */
let SUB="", pool=[], idx=0, score=0, wrong=[], answered=false, mode="";

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 出典sの「YYYY-MM-DD 新規」から、追加されてからの経過日数を返す（無ければ Infinity）
   ※sは運用メモを自由記述する欄なので、書式がずれると静かに新着判定から漏れる。
     日付と「新規」が両方あるのに接続していない場合だけ警告して、書式ドリフトに気づけるようにする。 */
function daysSinceAdded(q){
  const s = q.s || "";
  const m = /(\d{4})-(\d{2})-(\d{2})\s*新規/.exec(s);
  if(!m){
    if(/\d{4}-\d{2}-\d{2}/.test(s) && s.includes("新規")) console.warn(`[quiz] 追加日を読めません: ${q.id} / ${s}`);
    return Infinity;
  }
  const t = new Date(+m[1], +m[2]-1, +m[3]).getTime();
  if(isNaN(t)) return Infinity;
  return (Date.now() - t) / 86400000;
}
function isFresh(q){ return daysSinceAdded(q) <= NEW_DAYS; }
function freshCount(sub){ return DATA[sub].filter(isFresh).length; }
/* 追加からの経過日数に応じて減衰するブースト倍率 */
function freshBoost(q){
  const d = daysSinceAdded(q);
  for(const [limit, mul] of NEW_BOOST_STEPS){ if(d <= limit) return mul; }
  return 1;
}

/* 重み ＝ ティア基礎 × 苦手ブースト × 直近追加ブースト */
function weightOf(sub,q){
  return TIER_BASE[q.t] * (1 + MISS_BOOST*missOf(sub,q.id)) * freshBoost(q);
}

// 重み付き非復元抽出（同一プール内で苦手ブースト）
function weightedSampleFrom(sub, items, n){
  const p = items.map(it=>({it,w:weightOf(sub,it)}));
  const res=[];
  while(res.length<n && p.length){
    const total=p.reduce((s,x)=>s+x.w,0);
    let r=Math.random()*total, k=0;
    while(k<p.length-1 && r>p[k].w){ r-=p[k].w; k++; }
    res.push(p[k].it); p.splice(k,1);
  }
  return res;
}

// 第1ティア9割で層化抽出（不足分は他方のティアで補完）＋苦手ブースト
function weightedSample(sub, items, n){
  const t1 = items.filter(q=>q.t===1);
  const rest = items.filter(q=>q.t!==1);
  let nr = Math.min(rest.length, n - Math.min(t1.length, Math.round(n*TIER1_RATIO)));
  let n1 = Math.min(t1.length, n - nr); // 第1ティアを優先充当（残り枠は他ティア）
  nr = Math.min(rest.length, n - n1);   // 第1ティアが少ない科目では他ティアで補完
  const res = weightedSampleFrom(sub, t1, n1).concat(weightedSampleFrom(sub, rest, nr));
  // 出題順は優先順位（ティア昇順）で。同ティア内はシャッフル
  return res.sort((a,b)=> a.t-b.t || (Math.random()-.5));
}

function startSession(sub){
  SUB=sub; mode="session";
  const items=DATA[sub];
  pool = weightedSample(sub, items, Math.min(SESSION_SIZE, items.length));
  idx=0; score=0; wrong=[]; render();
}
/* 絞り込み済みリストでセッションを開始する共通処理（startWeak/startFreshが利用） */
function startFiltered(sub, m, items){
  if(!items.length){ home(); return; }
  SUB=sub; mode=m;
  pool=items.slice(0, SESSION_SIZE);
  idx=0; score=0; wrong=[]; render();
}
/* 間違えた問題だけを解く（誤答回数の多い順） */
function startWeak(sub){
  const m=missMap()[sub]||{};
  startFiltered(sub, "weak",
    DATA[sub].filter(q=>m[q.id]>0).sort((a,b)=>(m[b.id]-m[a.id])||(a.t-b.t)));
}
/* 直近追加分だけを解く（新しい順）。演習で落とした論点をその場で潰すためのモード */
function startFresh(sub){
  startFiltered(sub, "fresh",
    DATA[sub].filter(isFresh).sort((a,b)=>daysSinceAdded(a)-daysSinceAdded(b)||(a.t-b.t)));
}

function ic(n,s){s=s||18;return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;}
function countUp(el,to,dur){dur=dur||700;const t0=performance.now();(function f(t){let p=Math.min(1,(t-t0)/dur);p=1-Math.pow(1-p,3);el.textContent=Math.round(to*p);if(p<1)requestAnimationFrame(f);})(t0);}
function animBar(pct){requestAnimationFrame(()=>{const b=document.querySelector('.bar>i');if(b)b.style.width=pct+'%';});}

   ${subs.map((s,si)=>{
     const best=bestOf(s), wc=weakCount(s), fc=freshCount(s), n=DATA[s].length, max=Math.min(SESSION_SIZE,n);

          <h2>${s}${wc?`<span class="badge">苦手 ${wc}</span>`:''}${fc?`<span class="badge badge-new">新着 ${fc}</span>`:''}</h2>
          <div class="scard-meta"><span>全${n}問</span><span class="dot"></span><span>1回30問・優先度抽出</span>${best!=null?`<span class="dot"></span><span>ベスト <b style="font-family:var(--num);color:var(--ink)">${best}</b>/${max}</span>`:''}</div>
          ${best!=null?`<div class="mini"><i style="width:${Math.round(best/max*100)}%"></i></div>`:''}
        </div>
        <span class="chev">${ic('chev',18)}</span>
     </div>`;
   }).join('')}
   <div class="card" style="font-size:13px;color:var(--sub)">
     <b style="color:var(--ink);display:inline-flex;align-items:center">${ic('info',16)}ティアの意味</b><br>
     <span class="tier t1">第1</span> 繰り返し失点の継続弱点・改正・計算事故（最優先で多く出る）<br>
     <span class="tier t2">第2</span> 模試・過去問で集中失点した重要論点<br>
     <span class="tier t3">第3</span> 克服傾向だが油断すると落とす定着確認
   </div>`;
}

function subjectMenu(s){
  const wc=weakCount(s), fc=freshCount(s), n=DATA[s].length, best=bestOf(s), max=Math.min(SESSION_SIZE,n);
  const tc={1:0,2:0,3:0}; DATA[s].forEach(q=>tc[q.t]++);
  const si=Object.keys(DATA).indexOf(s);
  app.innerHTML = `
   <div class="meta"><span><a href="#" onclick="home();return false;">${ic('back',15)}科目選択へ</a></span><span>${s}</span></div>
   <div class="card">
     <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
       <div class="stile s${si%2}" style="width:40px;height:40px;flex-basis:40px;border-radius:11px">${ic(SUBJECT_ICON[s]||'target',19)}</div>
       <h2 style="margin:0">${s}</h2>
     </div>
     <div class="kpis">
       <div class="kpi"><b>${n}</b><small>Pool</small></div>
       <div class="kpi ${wc?'warn':''}"><b>${wc}</b><small>Weak</small></div>
       <div class="kpi accent"><b>${best!=null?best:'–'}</b><small>Best /${max}</small></div>
     </div>
     <div class="dist">
       <i style="width:${tc[1]/n*100}%;background:linear-gradient(90deg,rgba(251,113,133,.9),rgba(251,113,133,.55))"></i>
       <i style="width:${tc[2]/n*100}%;background:linear-gradient(90deg,rgba(251,191,36,.85),rgba(251,191,36,.5))"></i>
       <i style="width:${tc[3]/n*100}%;background:linear-gradient(90deg,rgba(52,211,153,.85),rgba(52,211,153,.5))"></i>
     </div>
     <div class="legend">
       <span><i style="background:#fb7185"></i>第1 ${tc[1]}</span>
       <span><i style="background:#fbbf24"></i>第2 ${tc[2]}</span>
       <span><i style="background:#34d399"></i>第3 ${tc[3]}</span>
     </div>
     <div style="height:14px"></div>
     <button class="btn primary" onclick="startSession('${s}')">${ic('play',16)}30問にチャレンジ（優先度ランダム）</button>
     <button class="btn" onclick="startFresh('${s}')" ${fc?'':'disabled style="opacity:.45"'}>${ic('sparkles',17)}直近追加だけ${fc?`（${fc}問）`:'（なし）'}</button>
     <button class="btn" onclick="startWeak('${s}')" ${wc?'':'disabled style="opacity:.45"'}>${ic('flame',17)}苦手だけ復習${wc?`（${wc}問）`:'（なし）'}</button>
     <button class="btn ghost" onclick="if(confirm('${s}の苦手記録をリセットします。よろしいですか？')){clearWeak('${s}')}">${ic('reset',16)}苦手記録をリセット</button>
   </div>`;
}
function clearWeak(s){const m=missMap();delete m[s];saveJSON(MISS_KEY,m);subjectMenu(s);}

function render(){
  const q=pool[idx]; answered=false;
  const pct=Math.round(idx/pool.length*100);
  const pad=n=>String(n).padStart(2,'0');
  app.innerHTML = `
   <div class="meta">
     <span class="qno">${SUB}${MODE_LABEL[mode]||''}　<b>${pad(idx+1)}</b><i>/${pad(pool.length)}</i></span>
     <span class="qmeta-r">
       <span class="qid">${q.id}</span>
       <span class="tier ${TIER_CLASS[q.t]}">${TIER_LABEL[q.t]}</span>
     </span>
   </div>
   <div class="bar"><i></i></div>
   <div class="card">
     <div class="qtext">${q.q}</div>
     <div id="choices">${q.c.map((c,i)=>`<button class="btn pop" style="animation-delay:${i*60}ms" onclick="answer(${i})"><span class="num">${i+1}</span>${c}</button>`).join('')}</div>
     <div id="fb"></div><div id="nextWrap"></div>
   </div>
   <div class="meta"><span class="qno">正解 <b style="color:var(--ok)">${score}</b></span><span><a href="#" onclick="quit();return false;">${ic('flag',15)}中断</a></span></div>`;
  animBar(pct);
}

function answer(i){
  if(answered)return; answered=true;
  const q=pool[idx], correct=q.a, isOk=(i===correct);
  document.querySelectorAll('#choices .btn').forEach((b,bi)=>{b.disabled=true;
    if(bi===correct)b.classList.add('ok'); if(bi===i&&!isOk)b.classList.add('ng');});
  if(isOk){ score++; bumpMiss(SUB,q.id,-1);          // 正解：苦手度を下げる＋Cyanグロー
    const c=document.querySelector('.card'); if(c){c.classList.remove('glow'); void c.offsetWidth; c.classList.add('glow');} }
  else { wrong.push({id:q.id,q:q.q,you:q.c[i],cor:q.c[correct],e:q.e,s:q.s}); bumpMiss(SUB,q.id,+1); } // 不正解：優先度UP
  document.getElementById('fb').innerHTML =
    `<div class="fb ${isOk?'ok':'ng'}">
      <div class="fbh"><span class="fbi">${ic(isOk?'check':'x',14)}</span>${isOk?'正解':'不正解'}</div>
      <div class="ans">正解は <b>${correct+1}. ${q.c[correct]}</b></div>
      <div class="exp">${q.e}<div class="src">${srcLine(q)}</div></div>
    </div>`;
  document.getElementById('nextWrap').innerHTML =
    `<button class="btn primary" onclick="next()">${idx+1<pool.length?'次の問題':'結果を見る'}<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin:0 0 0 7px">${ICONS.chev}</svg></button>`;
}
function next(){ idx++; if(idx<pool.length)render(); else result(); }
function quit(){ if(confirm('中断して科目メニューに戻りますか？'))subjectMenu(SUB); }

function result(){
  const pctScore=Math.round(score/pool.length*100);
  let newBest=false;
  if(mode==='session' && pool.length===Math.min(SESSION_SIZE,DATA[SUB].length)){
    const b=bestOf(SUB); if(b==null||score>b){ setBest(SUB,score); newBest=(b!=null); }
  }
  const msg=pctScore>=90?'素晴らしい！取りこぼしなし。':pctScore>=70?'good。間違えた論点を復習しましょう。':'弱点が明確。苦手だけ復習が有効です。';
  const wrongHtml=wrong.length?wrong.map(w=>`
     <div class="rev"><div class="q">${w.q}</div>
       <div class="a"><span class="cor">正：${w.cor}</span> ／ <span class="you">あなた：${w.you}</span><br>${w.e}<br><span style="font-size:12px">${srcLine(w)}</span></div></div>`).join('')
     :`<p class="center" style="color:var(--ok);display:flex;align-items:center;justify-content:center;gap:6px">${ic('trophy',20)}全問正解！お見事です。</p>`;
  const R=66, C=(2*Math.PI*R).toFixed(1);
  app.innerHTML=`
   <div class="card center">
     <div class="ring">
       <svg width="158" height="158" viewBox="0 0 158 158">
         <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
           <stop offset="0" stop-color="#0ea5b7"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
         </linearGradient></defs>
         <circle class="trk" cx="79" cy="79" r="${R}"/>
         <circle class="val" id="ringVal" cx="79" cy="79" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
       </svg>
       <div class="ctr">
         <div class="big" style="font-size:38px;margin:0"><span id="bigN">0</span><span style="font-size:17px;color:var(--sub);-webkit-text-fill-color:var(--sub)">/${pool.length}</span></div>
         <div style="font-family:var(--num);font-size:10px;font-weight:600;letter-spacing:2px;color:var(--faint)">SCORE</div>
       </div>
     </div>
     ${newBest?`<div class="newbest">${ic('trophy',13)}自己ベスト更新！</div>`:''}
     <div class="kpis">
       <div class="kpi accent"><b>${pctScore}<span style="font-size:13px">%</span></b><small>正答率</small></div>
       <div class="kpi"><b>${score}</b><small>正解</small></div>
       <div class="kpi ${wrong.length?'warn':''}"><b>${wrong.length}</b><small>ミス</small></div>
     </div>
     <p style="margin:10px 0 14px">${msg}</p>
     <div class="row">
       <button class="btn primary" onclick="startSession('${SUB}')">${ic('refresh')}もう一度（30問）</button>
       ${weakCount(SUB)?`<button class="btn" onclick="startWeak('${SUB}')">${ic('flame',17)}苦手だけ復習（${weakCount(SUB)}）</button>`:''}
     </div>
     <button class="btn ghost" onclick="home()">${ic('back',16)}科目選択へ戻る</button>
   </div>
   <div class="card"><b style="display:inline-flex;align-items:center">${ic(wrong.length?'flag':'trophy',17)}${wrong.length?'復習（間違えた問題）':'結果'}</b>${wrongHtml}</div>`;
  const bn=document.getElementById('bigN'); if(bn)countUp(bn,score,1100);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const rv=document.getElementById('ringVal'); if(rv)rv.style.strokeDashoffset=(C*(1-score/pool.length)).toFixed(1);
  }));
}

home();

/* Service Worker 登録（オフライン対応） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
