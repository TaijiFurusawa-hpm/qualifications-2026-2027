 {id:"K7",t:1,q:"2資産(σ1=8%,w1=60%／σ2=15%,w2=40%,相関係数ρ=▲0.80)のポートフォリオの標準偏差を求める式で正しいのは?",c:["σp²=(0.08×0.6)²+(0.15×0.4)²+2×0.6×0.4×0.08×0.15×0.80","σp²=(0.08×0.6)²+(0.15×0.4)²+2×0.6×0.4×0.08×0.15×(▲0.80)","σp=0.08×0.6+0.15×0.4","σp²=(0.08×0.6)²+(0.15×0.4)²"],a:1,e:"σp²=(σ1w1)²+(σ2w2)²+2·w1·w2·ρ·σ1·σ2。相関係数ρが負(▲0.80)なら第3項はマイナス=分散効果大。符号を落とすとσを過大評価する。この例ではσp=3.6%まで下がる。",s:"2026-1 Q33★Tier1(2資産の標準偏差・相関の符号)"},
 {id:"K8",t:1,q:"ポートフォリオのパフォーマンス評価指標の分母として正しい組み合わせは?",c:["シャープ=β／トレイナー=標準偏差／ジェンセンα=超過収益","シャープ=標準偏差／トレイナー=β／ジェンセンα=実績−CAPM期待収益","シャープ=β／トレイナー=β／ジェンセン=標準偏差","すべて標準偏差で割る"],a:1,e:"シャープ・レシオ=(R−Rf)÷標準偏差／トレイナー尺度=(R−Rf)÷β／ジェンセンのα=R−[Rf+β(Rm−Rf)](実績収益−CAPM理論収益)。総リスクで見るか(シャープ)、システマティックリスクで見るか(トレイナー・ジェンセン)で評価が割れることがある。",s:"2026-1 Q32(参考・正答)Tier2"},
 {id:"K9",t:1,q:"景気動向指数のCI・DIの採用系列数として正しいものは?",c:["先行10・一致11・遅行9の30系列","先行11・一致10・遅行9の30系列","先行9・一致10・遅行11の30系列","先行11・一致11・遅行11の33系列"],a:1,e:"景気動向指数の採用系列は先行11・一致10・遅行9の計30系列(CIとDIは共通の指標を採用)。景気転換点(山・谷)の判定にはヒストリカルDIを用いる。",s:"2026-1 Q2◆Tier1(30系列の内訳)"},
 {id:"K10",t:2,q:"日本銀行の全国企業短期経済観測調査(日銀短観)に関する記述で正しいものは?",c:["調査対象企業は原則5年に1度見直す","調査対象企業は原則年1回見直す","判断項目のみを調査し、計数項目は調査しない","業況判断DIは現状のみで将来予測は調査しない"],a:1,e:"日銀短観の調査対象企業(標本)の見直しは原則年1回。判断項目に加え、売上高・設備投資額・新卒採用者数等の計数項目(年度計数)も調査。業況判断DIは3ヶ月後の予測も調査する。資本金区分=大10億以上/中堅1億〜10億未満/中小2000万〜1億未満。",s:"2026-1 Q3◆Tier1(対象見直し年1回)"},
 {id:"K11",t:2,q:"マネーストック・マネタリーベースに関する記述で正しいものは?",c:["マネーストックは四半期ごとに公表される","景気動向指数の先行系列に採用されるのはM3の前年同月比である","マネタリーベースには日銀当座預金が含まれ、マネーストックには含まれない","ゆうちょ銀行の預金はM2の対象である"],a:2,e:"マネタリーベース(日銀が供給)=日銀当座預金を含む／マネーストック(金融部門から経済全体へ供給)=日銀当座預金を含まない。マネーストックは毎月公表。先行系列はM2前年比(M3でない)。ゆうちょ預金はM2に含まれずM3・広義流動性の対象。",s:"2026-1 Q4◆Tier1(マネタリーベースとマネーストック)"},
 {id:"K12",t:1,q:"わが国の税収のうち、近年最も金額が大きいものは?",c:["所得税","法人税","消費税","相続税"],a:2,e:"近年の税収は消費税＞所得税＞法人税の順で、最大は消費税。一般歳出の最大は社会保障関係費。防衛関係費は公共事業関係費を上回っている。",s:"2026-1 Q5◆Tier1(税収最大は消費税)"},
 {id:"K13",t:3,q:"近年の日本の実質金利についての説明で正しいものは?",c:["プラスで安定的に推移している","名目金利−期待インフレ率でみるとマイナス圏で推移している","名目金利と一致している","マイナスになることはない"],a:1,e:"実質金利=名目金利−期待インフレ率。近年の日本は名目金利＜期待インフレ率でマイナス圏。「実質金利はプラスで推移」は誤り(2026-1 Q8の不適切肢)。",s:"2026-1 Q8◆Tier1(実質金利マイナス圏)／2026-07-29 t2→t3(周回で即答)"},
 {id:"K14",t:2,q:"外貨建て債券(円で購入・円で受取)の為替手数料の扱いとして正しいものは?",c:["購入時・償還時とも仲値を使う","購入時=仲値＋為替手数料、償還/売却時=仲値−為替手数料","購入時=仲値−手数料、償還時=仲値＋手数料","為替手数料は考慮しない"],a:1,e:"外貨を買う購入時は仲値＋為替手数料(TTS的に円が多く必要)、外貨を円に戻す償還/売却時は仲値−為替手数料(TTB的に受取が減る)。購入可能額面=投資円÷(購入単価率×購入レート)を購入単位で切り下げ。",s:"2026-1 Q38★Tier1(外貨債券の為替手数料)"},
 {id:"K15",t:1,q:"現在1米ドル=150円、米国の物価上昇率3.0%、日本2.0%のとき、相対的購買力平価説による1年後の為替レートは?(円/ドル)",c:["150×1.03/1.02=151.47円","150×1.02/1.03=148.54円","150×1.03×1.02=157.59円","150円で変わらない"],a:1,e:"将来レート(円/ドル)=現在×(1+自国インフレ)/(1+外国インフレ)=150×1.02/1.03≒148.54円。物価上昇率が低い国(日本)の通貨は増価し、高い国(米国)の通貨は減価→円高ドル安(150→148.54)。",s:"2026-1 Q40★Tier1(相対的購買力平価)"},
 {id:"K16",t:1,q:"株価が1期ごとに±1円(各50%)動く二項モデルで、3期間後の株価に到達する確率の比として正しいものは?",c:["1:1:1:1","1:2:2:1","1:3:3:1","3:1:1:3"],a:2,e:"n期間後の到達確率は二項係数。3期間なら(1,3,3,1)/8。オプション価値はプット=max(K−S,0)/コール=max(S−K,0)を各ノードで求め確率加重。短期金利0%なら現在価値割引は不要。",s:"2026-1 Q45★Tier2(二項モデルの確率)"},
 {id:"K17",t:1,q:"保有株式を持ち続けつつ、急な株価下落に備えて損失を限定したい。合成損益図が下方で水平(損失限定)・上方は上昇益を享受、となる戦略は?",c:["カバード・コール(コール売り)","プロテクティブ・プット(プット買い)","バーティカル・ベア・スプレッド","ストラドルの売り"],a:1,e:"プロテクティブ・プット=保有株＋プット買い。下値を権利行使価格で限定しつつ、株価上昇時は上昇益を享受(合成損益図は下方が水平)。カバード・コールは保有株＋コール売りで上値を放棄する別戦略。",s:"2026-1 Q44★Tier1(プロテクティブプット)"},
 {id:"K18",t:2,q:"ゆうちょ銀行の定期貯金(預入期間3年以上)を中途解約する場合の扱いで正しいものは?",c:["一部解約または全額解約を選べる","全額解約のみ(一部解約はできない)","中途解約はできない","3年経過後はいつでも一部解約できる"],a:1,e:"ゆうちょ定期貯金(3年以上)の中途解約は全額解約のみで、一部解約はできない。※スーパー定期の半年複利型は個人限定(法人は単利型のみ)も頻出。",s:"2026-1 Q10Tier1(定期貯金の中途解約)／2026-07-29 t1→t2(周回で即答)"},
 {id:"K19",t:1,q:"財形年金貯蓄を60歳以降に要件を満たして受け取る場合の税務で正しいものは?",c:["利子は非課税だが受取初年度に確定申告が必要","要件を満たせば利子は非課税で確定申告は不要","利子は雑所得として総合課税","利子は源泉分離課税で20.315%"],a:1,e:"財形年金貯蓄は適格要件を満たせば利子等が非課税で、確定申告は不要。財形住宅も適格払出しなら積立5年未満でも非課税。",s:"2026-1 Q12Tier1(財形年金の非課税)"},
 {id:"K20",t:1,q:"給与所得者が受け取る個人年金(5年確定年金・自分で保険料を負担)の税務上の扱いで正しいものは?",c:["源泉分離課税で確定申告は不要","雑所得として総合課税。雑所得が20万円超なら確定申告が必要","一時所得として総合課税","非課税"],a:1,e:"確定年金の年金受取は雑所得・総合課税。雑所得=年金額−必要経費(年金額×払込保険料÷総支給見込額)。給与所得者で雑所得20万円超なら確定申告必要(住民税は20万以下でも申告必要)。源泉徴収は前払い。",s:"2026-1 Q42Tier1(個人年金は雑所得総合課税)"},
 {id:"K21",t:1,q:"国外財産調書の提出制度について正しいものは?",c:["12/31時点で国外財産合計1億円超の居住者が提出","12/31時点で国外財産合計5,000万円超の居住者が提出、期限は翌年6/30、不動産も対象","報告対象は金融資産のみで不動産は含まない","提出期限は翌年3/15である"],a:1,e:"国外財産調書は12/31時点で国外財産の合計が5,000万円超の居住者が提出。提出期限は翌年6/30。国外の不動産も報告対象(金融資産に限らない)。",s:"2026-1 Q48Tier1(国外財産調書)"},
 {id:"K22",t:1,q:"金融ADR(裁判外紛争解決)の窓口について正しいものは?",c:["生命保険契約の紛争はFINMACに申し立てる","生命保険は生命保険協会、証券・金融商品はFINMAC、銀行は全銀協と業態別に窓口が分かれる","すべての金融紛争はFINMACが一元的に扱う","金融機関は和解案に応じる義務はない"],a:1,e:"金融ADRは業態別。生保=生命保険協会、損保=そんぽADRセンター、証券・金融商品=FINMAC、銀行=全国銀行協会。生保紛争をFINMACに申し立てるのは誤り。金融機関は申立てに応じ、和解案にも原則応じる。",s:"2026-1 Q49Tier1(金融ADRの業態別窓口)／2024-1 Q49で再失点→K94へ"},
 {id:"K23",t:3,q:"株式累積投資(るいとう)に関する記述で正しいものは?",c:["購入できるのは個別株のみでETFやREITは対象外","証券会社が対象銘柄に選定していれば、るいとうでETFやJ-REITも購入できる","るいとうは毎月一定『口数』を買い付ける","元本保証がある"],a:1,e:"るいとう(株式累積投資)は毎月一定『金額』を買い付けるドルコスト平均法。証券会社が対象銘柄に選定していればETF(上場投信)やJ-REIT(上場不動産投信)も購入できる。",s:"2026-1 Q11Tier1(るいとうでETF/REIT可)／2026-07-31 t2→t3(定着確認へ)＝再失点したらt1へ戻す"},
 {id:"K24",t:1,q:"PBR1.2倍、自己資本(期末)684,010百万円、当期純利益51,300百万円のとき、株式益利回りは?(時価総額=PBR×自己資本)",c:["6.25%","7.50%","5.66%","1.20%"],a:0,e:"時価総額=PBR×自己資本期末値=1.2×684,010=820,812百万円。株式益利回り=純利益÷時価総額=51,300÷820,812≒6.25%。配当利回り=配当総額÷時価総額。純利益=ROE×自己資本。",s:"2026-1 Q15★Tier1(益利回り・時価総額=PBR×自己資本)"},
 {id:"K25",t:1,q:"投資信託の交付目論見書の記載に関する説明で最も適切なものは?",c:["運用実績の基準価額推移・年間騰落率は原則直近10年間を記載する","運用実績は直近3年間で足りる","代表的資産クラスとのリスク比較グラフの記載は法令上の義務である","手数料は記載義務がない"],a:0,e:"交付目論見書の運用実績(基準価額・純資産の推移、年間騰落率)は原則直近10年間。投資リスクの「代表的資産クラスとのリスク比較グラフ」は望ましいとされるが記載義務ではない(2026-1 Q30の不適切肢)。手数料・信託財産留保額・信託報酬等は記載する。",s:"2026-1 Q30Tier1(交付目論見書)"},
 {id:"K26",t:1,q:"金利平価説で、現在1米ドル=140円、円金利(1年)1%、米ドル金利(1年)3%のとき、1年後の理論為替レートは?(円/ドル)",c:["140×1.03/1.01≒142.77円","140×1.01/1.03≒137.28円","140×1.03×1.01≒145.60円","140円で変わらない"],a:1,e:"将来レート(円/ドル)=直物×(1+自国=円金利)/(1+外国=ドル金利)=140×1.01/1.03≒137.28円。ドル金利が高い→将来ドル安(円高)。★分子分母を逆(142.77)にするのが為替予約C7と共通の頻出ミス。「高金利通貨は将来安くなる」で符号確認。",s:"2025-2 Q39★Tier1(金利平価・分子分母)"},
 {id:"K27",t:1,q:"外貨建て定期預金を満期に円で受け取るときの税引後受取額の計算で正しいものは?",c:["元本の円転−為替差益税(30%)＋税引後利息。為替差益=満期円転−原資の加重平均レートによる取得原価","元本の円転＋利息を全額非課税で受取","元本の円転−利息税(20%)のみ","満期円転額そのまま(課税なし)"],a:0,e:"税引後受取=元本の円転−為替差益税(30%=所得20%+住民10%)＋税引後利息。利息は20%課税。為替差益=満期円転−取得原価で、取得原価は原資(複数の普通預金)の加重平均レートで算出。利息課税20%と為替差益課税30%を区別する。",s:"2025-2 Q38★Tier1(外貨定期の税引後受取)"},
 {id:"K28",t:1,q:"クロスレートで、ある月の米ドル/円レートが▲5.01%、豪ドル/米ドルレートが+3.43%変化したとき、円は豪ドルに対してどうなったか?",c:["(1+0.0343)×(1−0.0501)−1≒▲1.75%→豪ドル/円が下落=円は豪ドルに対して上昇(円高)","円は豪ドルに対して下落(円安)","変化なし","▲5.01%と+3.43%を単純に足して判定"],a:0,e:"クロス通貨/円の変化=(1+他通貨/ドル変化)×(1+ドル/円変化)−1。豪ドル/円=(1.0343)×(0.9499)−1≒▲1.75%。豪ドル/円が下落=豪ドルが円に対し安い=円は豪ドルに対して上昇(円高)。米ドル/円▲は円高。2つの対ドル変化率を掛け合わせて判定する。",s:"2025-2 Q41Tier2(クロスレート)"},
 {id:"K29",t:1,q:"割引債FA(残存2年)と割引債FB(残存4年)からなるポートフォリオのデュレーションを、利付債RA(デュレーション約2.96年)に等しくする場合、FAの投資比率は?",c:["2w+4(1−w)=2.96 を解いてw≒52%","48%","4w+2(1−w)=2.96 を解いてw≒48%","比率は関係なく50%固定"],a:0,e:"割引債のデュレーション=残存期間(FA=2年,FB=4年)。PFのデュレーション=加重平均=2w+4(1−w)を目標値2.96に一致させて解くと、4−2w=2.96→w=0.522≒52%(FA比率)。★FAとFBのどちらの比率を問われているか最後に確認(48%はFB比率)。利付債はマコーレー・デュレーションで別途計算。",s:"2025-2 Q20★Tier1(デュレーション投資比率)"},
 {id:"K30",t:2,q:"時間加重収益率で、期首に追加拠出や払出しがある場合の各期リターンの区切り方として正しいものは?",c:["年間の暦日数で単純に区切る","各期リターンはCF(追加拠出/払出)発生直前の時価で区切る。r_i=期末時価÷(前期末時価±期首CF)","CFは無視して期末時価÷当初投資額で計算","追加拠出も払出も期末に反映させる"],a:1,e:"時間加重収益率は資金流出入の影響を除くため、各期リターンをCF発生直前の時価で区切る。r_i=期末時価÷(前期末時価±期首の追加拠出/払出)。各期リターンを幾何連結し測定期間のt乗根。★電卓操作=n年のn乗根は√キーの押し回数で(4年=√を2回！√1回で2乗根/2回で4乗根)。操作:連結値→√→√→−1→×100。符号(▲=払出)に注意。",s:"2025-2 Q34/2025-1 Q31★Tier1(時間加重・CF調整・√2回で4乗根)"},
 {id:"K31",t:1,q:"上場株式等の配当を申告分離課税で確定申告するとき、所得控除の余りによる還付で注意すべき点は?",c:["所得税と住民税は基礎控除が同額なので還付額も同じ","所得税と住民税で基礎控除が違う(所得税95万/住民税43万)ため、所得控除の余りが所得税では配当を相殺し全額還付でも住民税は還付0となる場合がある","住民税は配当に課税されないので常に全額還付","申告分離では還付は一切生じない"],a:1,e:"申告分離課税でも、総所得で引ききれない所得控除の余りは分離課税の配当所得から控除できる。所得税の基礎控除(95万等)と住民税の基礎控除(43万)が異なるため、所得税では余りが配当を相殺して源泉税が全額還付でも、住民税では余りがなく還付0、というズレが生じる。基礎控除額の差を必ず区別。",s:"2025-2 Q48Tier2(配当還付・所得税/住民税の基礎控除差)"},
 {id:"K32",t:1,q:"わが国と米国のGDPに関する近年の数値で正しいものは?",c:["米国の名目GDPは世界全体の約26%を占め、日本は2024年に名目GDPが初めて600兆円(約608兆円)を突破した","米国は世界の約17%で日本は米国の約4.5倍","日本の名目GDPは2024年に初めて700兆円を突破した","米国GDPは日本の約2倍である"],a:0,e:"米国の名目GDPは世界全体の約26%(約1/4)。日本の名目GDPは2024年(暦年)に初めて600兆円(約608兆円)を突破。米国は日本の約6.5倍。数字の暗記が問われる時事問題。",s:"2025-2 Q1◆Tier1(GDP時事)"},
 {id:"K33",t:1,q:"わが国の経常収支の構成で、近年最も大きな黒字となっている項目は?",c:["貿易収支","サービス収支","第一次所得収支","第二次所得収支"],a:2,e:"経常収支=貿易収支＋サービス収支＋第一次所得収支＋第二次所得収支。近年は対外投資からの利子配当を表す第一次所得収支が最大の黒字。貿易収支は赤字の年も多い。表の数値の大小・符号から項目を判定する問題が頻出。",s:"2025-2 Q2◆Tier1(経常収支・第一次所得収支)"},
 {id:"K34",t:2,q:"日本銀行の全国企業短期経済観測調査(日銀短観)の公表時期として正しいものは?",c:["毎年4月初・7月初・10月初・12月央に、それぞれ3月・6月・9月・12月の調査結果を公表(年4回)","毎月公表される","年2回(3月・9月)公表","四半期末にまとめて年1回公表"],a:0,e:"日銀短観は年4回。4月初・7月初・10月初・12月央に、それぞれ3・6・9・12月調査分を公表(12月調査のみ2日に分けて公表)。業況判断DI=「良い」%−「悪い」%で、3ヶ月後の予測も調査。調査対象は資本金2000万円以上の民間企業。",s:"2025-2 Q4◆Tier2(日銀短観の公表時期)／2026-07-29 t1→t2(周回で即答)"},
 {id:"K35",t:1,q:"ゆうちょ銀行の定期貯金(預入期間3年以上)の利子計算方式について正しいものは?",c:["単利型と半年複利型を預入時に選べる","預入期間により決まり、3年以上は半年複利(選択制ではない)","常に単利型のみ","日割り複利である"],a:1,e:"ゆうちょの定期貯金の利子計算は預入期間で決まる(3年未満=単利、3年以上=半年複利)。「単利型と半年複利型がある(選べる)」わけではない。※スーパー定期(銀行)の半年複利型は個人限定、という論点と混同しない。",s:"2025-2 Q10Tier2(ゆうちょ定期の利子計算)"},
 {id:"K36",t:1,q:"確定拠出年金(DC)で別の運用管理機関の口座へ資産を移換する際の取扱いで正しいものは?",c:["移換先に同じ投資信託があれば売却せずそのまま移換できる","原則として保有商品を現金化(売却)してから移換する","移換はできない","移換時に課税される"],a:1,e:"DCの資産移換は原則として保有する運用商品を一旦現金化(売却)してから移換する。移換先に同じ投信があっても現物のまま移換はできない(売却して移換)。移換自体は課税されない。",s:"2025-2 Q13Tier2(DC資産移換は現金化)"},
 {id:"K37",t:3,q:"個人が国内業者を通じて行う外国為替証拠金取引(FX)の証拠金・レバレッジについて正しいものは?",c:["取引額の30%以上の証拠金が必要","取引額の4%以上の証拠金が必要(レバレッジ最大25倍)","証拠金は不要","取引額と同額の証拠金が必要"],a:1,e:"個人のFXはレバレッジ最大25倍=証拠金は取引額の4%以上(1/25)。「30%以上」は誤り。一定以上の含み損でロスカット・ルールが義務付けられている。低金利通貨で高金利通貨を買うとスワップポイント受取。",s:"2025-2 Q45Tier1(FX証拠金4%・25倍)／2024-1 Q46で再失点／2026-07-29 t1→t2(周回で即答)／2026-07-29 選択肢を記憶したためt3へ（後継＝K107）"},
 {id:"K38",t:2,q:"金融商品取引法における損失補てんの取扱いで正しいものは?",c:["事前に書面を交付すれば顧客の損失を補てんできる","顧客の損失補てんは禁止されている(書面を交付しても不可)","デリバティブ取引の損失のみ補てんできる","顧客が同意すれば補てんできる"],a:1,e:"金商法は損失補てん(および利益追加の約束・提供)を禁止している。書面交付や顧客同意があっても不可。契約成立時の情報提供義務・最良執行方針の提供義務などと混同しない。",s:"2025-2 Q49Tier1(損失補てん禁止)"},
 {id:"K39",t:2,q:"公募増資と自社株買いが、EPS(1株当たり純利益)とROE(自己資本利益率)に与える影響として正しいものは?(純利益は不変)",c:["公募増資=EPS・ROEとも下落／自社株買い=EPS・ROEとも上昇","公募増資=EPS下落・ROE上昇／自社株買い=EPS上昇・ROE下落","両方ともEPS・ROEは変わらない","公募増資=EPS・ROEとも上昇／自社株買い=EPS・ROEとも下落"],a:0,e:"純利益一定で、公募増資は株式数・自己資本が増える→EPS(=純利益/株式数)もROE(=純利益/自己資本)も下落。自社株買いは株式数・自己資本が減る→EPS・ROEとも上昇。分母の増減で判断する。",s:"2025-2 Q47Tier1(増資・自社株買いのEPS/ROE)"},
 {id:"K40",t:1,q:"表面利率(年1回後払い)1.0%・残存期間3年・複利利回り1.0%の利付債(額面100円)のマコーレー・デュレーションは?(小数点以下第3位四捨五入)",c:["2.94年","2.97年","3.00年","1.98年"],a:1,e:"①各期CFを複利利回り1%で割引く。1年後1円→1÷1.01=0.9901／2年後1円→1÷1.01²=0.9803／3年後101円(利子1+償還100)→101÷1.01³=98.0296。②債券価格=合計100.00円(利回り=表面利率なのでパー100円になる=検算になる)。③年数で加重:1×0.9901+2×0.9803+3×98.0296=297.0395。④÷100=【2.9704→2.97年】。★2.94年は修正デュレーション(2.9704÷1.01)、3.00年は残存期間そのもの(=割引債の場合の値)の引っかけ。同じ残存でもクーポンが低いほどデュレーションは長い。",s:"2026-1 Q20/2025-2 Q20★Tier1(マコーレー計算)"},
 {id:"K41",t:1,q:"債券の複利利回りがr、マコーレー・デュレーションがDのとき、金利がΔr変化したときの価格変化率の近似式は?",c:["価格変化率 ≒ −(Δr × 修正デュレーション)、修正デュレーション=D÷(1+r)","価格変化率 ≒ +(Δr × D)","価格変化率 ≒ Δr ÷ D","価格変化率 ≒ D × r"],a:0,e:"修正デュレーション=マコーレーD÷(1+r)。価格変化率 ≒ −(金利変化Δr × 修正デュレーション)。金利上昇(Δr>0)で価格は下落(マイナス)。例(2025-2 Q21):金利1%下落なら価格変化率=−(−0.01×修正D)=プラス。なお債券の理論価格そのものは 100÷(1+r)^残存年数 で複利計算する。",s:"2025-2 Q21★Tier1(修正デュレーションと価格変動)"},
 {id:"K42",t:1,q:"スポットレートから『m年後スタートの(n−m)年物フォワードレート』を求める関係式(純粋期待仮説)は?",c:["(1+n年物スポット)^n = (1+m年物スポット)^m ×(1+フォワード)^(n−m)","フォワード = n年物スポット − m年物スポット","フォワード = (n年物+m年物)÷2","(1+フォワード)=(1+n年物)×(1+m年物)"],a:0,e:"純粋期待仮説では、長期で運用しても短期+フォワードで運用しても結果が同じ。(1+s_n)^n=(1+s_m)^m×(1+f)^(n−m)。例(2025-1 Q20):ケース①1年1.70%/3年2.20%で4年物sを求め、3年後スタート1年物f=3.40%を検算→ア=2.50%。スポットとフォワードの関係は純粋期待仮説に基づく。",s:"2025-1 Q20★Tier1(スポット/フォワードレート)"},
 {id:"K43",t:1,q:"株価指数先物の理論価格の計算式として正しいものは?",c:["現物指数 ×{1+(短期金利−配当利回り)×日数/365}","現物指数 ×{1+(配当利回り−短期金利)×日数/365}","現物指数 ×(1+短期金利)","現物指数 −配当利回り"],a:0,e:"先物理論価格=現物指数×{1+(短期金利−配当利回り)×満期までの日数/365}。金利>配当利回りなら先物は現物より高い(順ザヤ)。例(2025-1 Q44):TOPIX2,700・金利0.25%・配当2.30%・45日→2,700×{1+(0.0025−0.023)×45/365}≒2,693。",s:"2025-1 Q44★Tier1(先物理論価格)／2024-1 Q44で3回連続失点→K92へ"},
 {id:"K44",t:1,q:"在庫循環図(横軸=出荷前年比・縦軸=在庫前年比)の4局面を、景気回復から反時計回りに並べたものは?",c:["回復局面→在庫積増し局面→在庫積上がり局面→在庫調整局面","在庫調整局面→在庫積上がり局面→在庫積増し局面→回復局面","回復局面→在庫積上がり局面→在庫積増し局面→在庫調整局面","在庫積上がり局面→回復局面→在庫調整局面→在庫積増し局面"],a:0,e:"在庫循環(キチン・サイクル/3〜4年)は反時計回りに、①回復(出荷↑在庫↓)→②在庫積増し(出荷↑在庫↑)→③在庫積上がり(出荷↓在庫↑)→④在庫調整(出荷↓在庫↓)。在庫は生産に遅行し、最終需要財在庫率指数は景気動向指数の遅行系列。",s:"2025-1 Q4◆Tier2(在庫循環図の局面)"},
 {id:"K45",t:1,q:"個人型確定拠出年金(iDeCo)の毎月の拠出限度額として正しいものは?",c:["自営業者(第1号)は国民年金基金等と合算して6.8万円、専業主婦(第3号)は2.3万円","第1号も第3号も一律2.3万円","公務員は5.5万円まで拠出できる","第3号被保険者はiDeCoに加入できない"],a:0,e:"iDeCo拠出限度額:第1号(自営)=国民年金基金・付加保険料と合算で月6.8万／第3号(専業主婦等)=2.3万／会社員(企業年金なし)=2.3万／公務員・DB等ありは2万(2024/12改正)。第1号の『6.8万は基金等と合算』が頻出。",s:"2025-1 Q13Tier2(iDeCo拠出限度額)"},
 {id:"K46",t:1,q:"2024年11月5日以降の東京証券取引所の取引時間・売買制度に関する記述で正しいものは?",c:["立会時間の終了を後場15時30分まで延長し、終値形成の透明性向上のためクロージング・オークションを導入した","取引時間は変更されていない","前場のみで後場は廃止された","注文受付時間中も売買が成立し続ける"],a:0,e:"2024/11/5から後場の取引終了を15:00→15:30に延長。あわせて終値形成にクロージング・オークション(注文受付時間を設けた後、立会終了時刻に大引けの板寄せ)を導入。大引けで成立する値幅は最終値段の更新値幅の2倍まで。",s:"2025-1 Q17Tier2(東証の取引時間・クロージングオークション)"},
 {id:"K47",t:3,q:"信用取引の『制度信用取引』と『一般信用取引』の違いとして正しいものは?",c:["制度信用取引=返済期限や対象銘柄等を取引所の規則で定める／一般信用取引=返済期限や銘柄等を証券会社と顧客の合意で決める","制度信用取引=証券会社と顧客の合意／一般信用取引=取引所の規則","両者に違いはない","一般信用取引では逆日歩が必ず発生する"],a:0,e:"制度信用取引は返済期限(原則6ヶ月)・対象銘柄・品貸料等を取引所の規則で定める。一般信用取引は返済期限や対象銘柄を証券会社と顧客が合意で決める。逆日歩(品貸料)は貸借取引を使う制度信用で発生し得る。",s:"2025-1 Q19Tier2(信用取引 制度/一般)／2024-1 Q18で再失点／2026-07-29 t1→t2(周回で即答)／2026-07-29 選択肢を記憶したためt3へ（後継＝K108）"},
 {id:"K48",t:1,q:"外貨建てMMFの為替差益に対する課税の取扱いで正しいものは?",c:["為替差益は申告分離課税となり、上場株式等の譲渡損失と損益通算できる","為替差益は非課税である","雑所得として総合課税される","一時所得として課税される"],a:0,e:"外貨建てMMFの譲渡益(為替差益含む)は上場株式等の譲渡所得等として申告分離課税(20.315%)。上場株式等の譲渡損失と損益通算・繰越控除ができる。外貨預金の為替差益(雑所得・総合課税)とは扱いが異なる点に注意。",s:"2025-1 Q11Tier2(外貨建てMMFの為替差益)"},
 {id:"K49",t:1,q:"居住者が受け取る外国上場株式の配当・外国国債の利子の課税で正しいものは?",c:["外国株配当は外国で課された源泉税を『差し引く前』の金額に国内所得税等が源泉徴収される。総合課税で申告しても外国株配当に配当控除の適用はない","外国源泉税を差し引いた後の金額に国内課税される","外国株配当にも国内株と同じ配当控除が使える","外国国債の利子は非課税"],a:0,e:"外国上場株式の配当は、外国源泉税を差し引く『前』の金額に国内で所得税等が源泉徴収される(二重課税は外国税額控除で調整)。配当控除は国内株式等が対象で、外国株配当には適用されない。外国国債の利子(特定公社債)は申告分離課税。",s:"2025-1 Q40Tier2(外国株配当・外国国債利子の課税)"},
 {id:"K50",t:1,q:"投資信託の『交付運用報告書』に記載される事項として正しいものは?",c:["基準価額等の推移(図)・1万口当たりの費用明細・組入資産ごとの今後の運用方針を記載する","全銘柄名と各組入比率の表を必ず記載する","購入時手数料の料率のみ記載する","何も記載義務はない"],a:0,e:"交付運用報告書には、基準価額・純資産の推移(図)、1万口当たりの費用明細、組入資産ごとの運用経過と今後の運用方針等を記載。全組入銘柄名と比率の一覧は『運用報告書(全体版)』に記載され、交付版では主要銘柄等に簡略化される。交付目論見書(購入前)とは別物。",s:"2025-1 Q30Tier3(交付運用報告書)"},
 {id:"K51",t:1,q:"社債等に関する記述で正しいものは?",c:["店頭取引の社債の売買価格の参考として、日本証券業協会が『公社債店頭売買参考統計値』を毎営業日公表している","社債は必ず取引所取引で売買される","トランジション・ボンドはCO2排出量が多い企業は一切発行できない","社債スプレッドが拡大すると債券価格は上昇する"],a:0,e:"社債は主に店頭取引で、日本証券業協会が『公社債店頭売買参考統計値』を毎営業日公表。トランジション・ボンドは脱炭素が難しい多排出企業が『移行』のために発行できる。社債スプレッド拡大=信用不安等で価格は下落方向。",s:"2025-1 Q23Tier3(社債・参考統計値/トランジションボンド)"},
 {id:"K52",t:1,q:"資本コストを意識した経営における指標の比較対象として正しいものは?",c:["ROICはWACC(加重平均資本コスト)と、ROEは株主資本コストと比較する。PBR=ROE×PERで表せる","ROICは株主資本コスト、ROEはWACCと比較する","ROEとROICは同じ指標である","PBRは配当利回りで決まる"],a:0,e:"ROIC(投下資本利益率)はWACCと、ROE(自己資本利益率)は株主資本コストと比較して資本収益性を評価。資本コストを上回っていてもPBRが1倍割れなら成長性等が十分評価されていない。PBR=ROE×PERの関係。",s:"2025-1 Q18Tier2(資本コスト経営 ROIC/WACC/ROE/PBR)"},
 {id:"K53",t:1,q:"日本と米国のGDPに占める民間最終消費支出の割合に関する記述で正しいものは?",c:["近年、日本はおおむね50%台、米国はおおむね70%前後で推移している","近年、日本はおおむね70%前後、米国はおおむね50%台で推移している","日米ともおおむね90%である","日米とも30%程度である"],a:0,e:"GDPに占める民間最終消費支出の割合は、近年おおむね日本が50%台、米国が70%前後(個人消費主導)で推移。米国の方が個人消費のGDP比が高い。2025-1 Q1では『日本70%前後・米国50%台』という向きが逆の記述が誤り(不適切肢)として問われた。",s:"2025-1 Q1◆Tier2(日米GDPの民間最終消費割合)"},
 {id:"K54",t:1,q:"【型①利付債の単利最終利回り】クーポン(年利子)2.0%・購入価格98.00円・残存5年の利付債。単利最終利回りは?(表示単位小数点以下第2位)",c:["2.04%","2.40%","2.45%","4.08%"],a:2,e:"利付債の最終利回り＝{年利子＋(100−価格)÷残存年数}÷価格×100。=｛2.0＋(100−98)÷5｝÷98×100=｛2.0＋0.4｝÷98×100=2.4÷98×100=2.45%。★分母は『購入価格』(額面100ではない)、償還差益(100−価格)は『残存年数で按分』。誤答2.04%=償還差益の項を入れ忘れ(2.0÷98)、2.40%=分母を額面100にした誤り、4.08%=年数で割り忘れ(2.0＋2)÷98。",s:"債券基礎計算 型①利付債の単利最終利回り(2025①Q39派生)"},
 {id:"K55",t:1,q:"【型②利付債の価格】クーポン(年利子)2.0%・最終利回り3.0%・残存4年の利付債の価格は?(単利ベース・小数点以下第2位)",c:["89.29円","96.00円","96.43円","103.70円"],a:2,e:"利付債の価格＝(100＋年利子×年数)÷(100＋最終利回り×年数)×100。=(100＋2×4)÷(100＋3×4)×100=108÷112×100=96.43円。★検算＝利回り3%>クーポン2%なのでアンダーパー(100円割れ)になるのが正しい。誤答103.70=分子分母を逆にした(利回り<クーポンなら100超だが本問は逆)、89.29=分子でクーポン×年数を足し忘れ(100÷112)、96.00=単純な近似。",s:"債券基礎計算 型②利付債の価格(単利)"},
 {id:"K56",t:1,q:"【型③割引債の複利最終利回り】購入価格90.00円・残存4年の割引債(ゼロクーポン)。複利最終利回りは?(小数点以下第2位)",c:["1.33%","2.67%","2.78%","5.41%"],a:1,e:"割引債の複利最終利回り＝(年数√(100÷価格)−1)×100。100÷90=1.1111の『4乗根』−1。=(⁴√1.1111−1)×100=(1.02669−1)×100=2.67%。⚡電卓は√キーを『2回』押す(4年=4乗根=√2回。√1回=2乗根/2回=4乗根/3回=8乗根)。誤答5.41%=√1回(2乗根)にした誤り、1.33%=√を4回押して8乗根にした誤り、2.78%=単利((100÷90−1)÷4)で計算。",s:"債券基礎計算 型③割引債の複利最終利回り(√2回=4乗根)"},
 {id:"K57",t:1,q:"【型④割引債の価格】最終利回り2.0%・残存3年の割引債(ゼロクーポン)の価格は?(複利ベース・小数点以下第2位)",c:["94.00円","94.23円","94.34円","98.04円"],a:1,e:"割引債の価格＝100÷(1＋最終利回り)^年数。=100÷(1.02)³=100÷1.061208=94.23円。★『複利』で現在価値に割り戻すのがポイント(割引債の利回りは複利で定義)。誤答94.34=単利(100÷(1＋0.02×3)=100÷1.06)で割った誤り、98.04=1年分しか割り引いていない(100÷1.02)、94.00=単純減算(100−2×3)。",s:"債券基礎計算 型④割引債の価格(複利)"},
 {id:"K58",t:1,q:"【配当控除の意味】上場株式等の配当金について『配当控除』の適用を受けられる課税方式は?",c:["総合課税を選択して確定申告した場合のみ","申告分離課税を選択した場合","確定申告不要制度(源泉徴収のみ)を選択した場合","NISA口座で受け取った場合"],a:0,e:"配当控除は、法人段階で課税された利益から支払われる配当に個人段階で再課税される『二重課税』を調整する制度。上場株式等の配当を【総合課税】で確定申告した場合のみ適用。申告分離課税を選ぶと配当控除は使えない代わりに上場株式等の譲渡損失と損益通算できる。確定申告不要(源泉20.315%)やNISA(非課税)は配当控除の対象外。",s:"2025-1 Q16(配当控除の意味)"},
 {id:"K59",t:2,q:"【配当控除の計算】課税総所得金額600万円の人が、国内上場株式の配当27万円(税引前)を総合課税で申告した。所得税の配当控除額は?",c:["27,000円","13,500円","7,560円","54,000円"],a:0,e:"上場株式等の配当を総合課税で申告した場合、課税総所得金額1,000万円以下の部分は配当控除率＝所得税10%・住民税2.8%。所得税の配当控除＝27万×10%＝27,000円。誤答13,500円は1,000万円超部分の率5%を誤用、7,560円は住民税分(27万×2.8%)、54,000円は率を20%と誤認。★投資信託の分配金は率が半分(5%/1.4%)。",s:"2025-1 Q16(配当控除の計算)／2026-07-31 t1→t2(周回で即答)＝監視対象・別設例で再失点したら即t1復帰"},
 {id:"K60",t:1,q:"【損益通算の仕組み】上場株式等の譲渡損失と損益通算できるものは?(申告分離課税を選択)",c:["申告分離課税を選択した上場株式等の配当金・特定公社債(個人向け国債等)の利子","総合課税を選択した配当金","NISA口座内で生じた譲渡益・配当","一般株式等(非上場)の譲渡益"],a:0,e:"上場株式等の譲渡損失は、【申告分離課税を選択した】上場株式等の配当金や特定公社債(個人向け国債・公募公社債投信等)の利子と損益通算できる。総合課税を選んだ配当とは通算不可。NISA口座内の損益は『ないもの』とされ通算・繰越の対象外。上場株式等と一般株式等(非上場)は別グループで相互に通算できない。",s:"2025-1 Q16(損益通算)"},
 {id:"K61",t:1,q:"【繰越控除】上場株式等の譲渡損失の繰越控除について正しいものは?",c:["通算しきれない損失は翌年以降3年間繰り越せるが、その間は取引がない年も含め連続して確定申告が必要","繰越期間は5年間である","繰越に確定申告は不要である","NISA口座内の損失も繰り越せる"],a:0,e:"損益通算してもなお控除しきれない上場株式等の譲渡損失は、翌年以降【3年間】繰り越し、各年の譲渡益・配当等から控除できる。繰越期間中は、取引がない年も含めて【連続して確定申告】を続ける必要がある(1年でも怠ると繰越が途切れる)。NISA口座内の損失は繰越控除の対象外。",s:"2025-1 Q16(繰越控除)"},
 {id:"K62",t:1,q:"【有利選択の考え方】(問題16型)上場配当の課税方式で最も税額が安くなる考え方として正しいものは?",c:["課税所得が高くない人は総合課税＋配当控除の方が申告不要(20%)より有利な場合がある。NISA口座の譲渡損失は他口座と通算できない","上場配当は常に申告不要が最も有利","NISA口座の譲渡損失も特定口座の利益と通算できる","総合課税の税率は常に申告分離より低い"],a:0,e:"上場配当の課税方式は『総合課税(配当控除)』『申告分離(損益通算)』『申告不要(源泉20.315%)』から有利選択する。課税総所得が低め(所得税率が低い)の人は、総合課税で配当控除10%を引くと実効税率が申告不要20%より低くなる場合がある。譲渡損失があれば申告分離で通算する手も。★NISA口座内の譲渡損失(▲12万等)・配当は課税対象外＝他口座と損益通算も繰越もできず『ないもの』として扱う(問題16の頻出ワナ)。",s:"2025-1 Q16(課税方式の有利選択・NISAの罠)"},
 {id:"K63",t:1,q:"【論点1 ジェンセンのα計算】ポートフォリオの実績収益率8.0%・無リスク利子率1.0%・β=1.2・市場全体の期待収益率(Rm)6.0%のとき、ジェンセンのαは?",c:["+2.0%","+1.0%","−0.2%","+7.0%"],a:1,e:"ジェンセンのα＝実績収益率−CAPM期待収益率。CAPM期待収益率＝無リスク利子率＋β×(市場の期待収益率−無リスク利子率)＝1.0＋1.2×(6.0−1.0)＝1.0＋1.2×5.0＝1.0＋6.0＝7.0%。α＝8.0−7.0＝＋1.0%。★2段階＝①CAPMで理論値を出す→②実績から引く。誤答＋2.0%＝CAPMで無リスク利子率を足し忘れ(β×(Rm−Rf)＝6.0を理論値と誤認)、−0.2%＝超過収益を(Rm−Rf)でなくRmで計算(1＋1.2×6＝8.2)、＋7.0%＝CAPM理論値そのものをαと誤認(実績を引き忘れ)。",s:"2025-1 Q32派生(ジェンセンのα計算・CAPM)"},
 {id:"K64",t:1,q:"【論点2 債券計算の使い分け】単利・複利と『価格⇄利回り』の逆算について正しいものは?",c:["単利: 利回り＝{年利子＋(100−価格)÷残存年数}÷価格×100／価格＝(100＋利子×年数)÷(100＋利回り×年数)×100。複利(割引債): 利回り＝(残存年数√(100÷価格)−1)×100／価格＝100÷(1＋利回り)^年数。求めたい量を左辺に置き他方を代入して逆算する","単利も複利も利回りは必ず(100−価格)÷年数で求める","割引債(ゼロクーポン)の利回りは単利で計算するのが原則","価格を求めるときも利回りを求めるときも常に同一の1公式を使う"],a:0,e:"4象限(単利/複利 × 価格/利回り)で整理する。★単利＝償還差益を残存年数で『按分』・分母は購入価格。★複利＝年数を『指数』に置く(利回りはn乗根＝√で、割引はn乗で)。割引債(ゼロクーポン)の利回りは複利で定義するのが原則。逆算は『求めたい量を左辺・既知量を代入』するだけで、単複それぞれ価格式と利回り式が対になっている。K54(単利利回り)・K55(単利価格)・K56(複利利回り)・K57(複利価格)と対応。",s:"債券基礎計算 使い分けマトリクス(K54-K57の統合)"},
 {id:"K65",t:1,q:"【論点3 クロスレート円換算経由】1米ドル＝150.00円、1ランド＝8.00円のとき、クロスレート『1米ドル＝何ランド』は?",c:["18.75ランド","0.0533ランド","1,200ランド","142.00ランド"],a:0,e:"クロスレートは外貨同士を直接足し引きせず、必ず共通の『円ベース』に換算してから比(割り算)を取る。1米ドル＝150円、1ランド＝8円 → 1米ドル＝150円＝(150÷8)ランド＝18.75ランド。★複数通貨を跨ぐときは一度すべて円に直す→割る。逆に『1ランド＝何ドル』なら8÷150＝0.0533ドル。誤答0.0533＝ドルとランドを逆に割った、1,200＝150×8と掛けた誤り、142.00＝150−8と引いた誤り。",s:"2025-1 Q36(クロスレート・円換算経由)"},
 {id:"K66",t:1,q:"【★最重要】NISA口座で保有する国内上場株式の配当金について、正しいものは?",c:["NISA口座の株式配当は受取方法にかかわらず常に非課税","配当金の受取方法が『株式数比例配分方式』でなければ非課税にならず20%が源泉徴収される","NISA口座の配当は必ず総合課税になる","NISA口座の配当に係る外国源泉税は外国税額控除できる"],a:1,e:"NISA口座の上場株式の配当を非課税で受け取るには、配当金受取方法が【株式数比例配分方式】である必要がある。『個別銘柄指定方式』『登録配当金受領口座方式』だとNISA口座内の株式でも配当は20%源泉徴収される(＝課税)。★問題文の留意点に1行だけ書かれる最大のワナ。なお公募株式投信の分配金は受取方法の論点が生じず非課税。★NISAで国内非課税となる外国株配当の外国源泉税は外国税額控除の対象外。NISA内の譲渡損失も通算・繰越不可。",s:"2024-2 Q15★Tier1(NISAの非課税要件)"},
 {id:"K67",t:1,q:"【型 財務指標の逆算連鎖】時価総額415,410百万円・PBR(実績)0.90倍・当期純利益20,399百万円・ROE4.50%(自己資本は期首期末の平均)のとき、期首(前期末)の自己資本はいくらか?",c:["約445,056百万円","約461,566百万円","約453,311百万円","約906,622百万円"],a:0,e:"①期末自己資本＝時価総額÷PBR＝415,410÷0.90＝461,566百万円。②ROEの分母は【期首期末の平均】＝20,399÷4.50%＝453,311百万円 → 期首＋期末＝906,622。③期首＝906,622−461,566＝【445,056百万円】。★同じ手順で総資産経常利益率(平均)から期首総資産も出せる(37,086÷2.31%＝1,605,454→×2−期末1,655,253＝1,555,655)。自己資本比率の伸び率はこの4段で解く(当期27.89%・前期28.61%→▲2.5%台)。誤答461,566＝期末値、453,311＝平均値、906,622＝合計。",s:"2024-2 Q13(逆算連鎖・K24の発展)"},
 {id:"K68",t:1,q:"【型 配当割引モデル】予想配当50円・期待収益率3%・配当成長率0.5%・現在株価1,827円のとき、(ア)理論株価との比較と(イ)1年後に投資収益率3%以上とするための1年後株価は?",c:["(ア)割高 (イ)2,257円","(ア)割安 (イ)2,257円","(ア)割安 (イ)1,831円","(ア)割高 (イ)1,831円"],a:2,e:"(ア)定率成長配当割引モデルの理論株価＝D1÷(r−g)＝50÷(0.03−0.005)＝【2,000円】。株価1,827円＜2,000円なので【割安】。(イ)1年後の株価をP1とすると投資収益率＝(P1−P0＋D)÷P0≧3% → P1≧P0×1.03−D＝1,827×1.03−50＝【1,831円】。★理論株価2,000円を(イ)に流用するのが典型ミス。なお現在株価はPER×EPSで求める(EPS＝年間配当÷配当性向＝50÷68.93%＝72.54 → 25.17×72.54＝1,827円)。",s:"2024-2 Q14(配当割引モデル＋必要株価)"},
 {id:"K69",t:2,q:"四半期GDP(名目季節調整系列)が前期5,948,476億円→当期5,980,056億円のとき、当期の成長率(年率換算)は?",c:["約5.4%","約2.1%","約0.5%","約1.3%"],a:1,e:"前期比＝5,980,056÷5,948,476−1＝+0.531%。【年率換算＝(1＋前期比)の4乗−1】＝1.00531^4−1＝約【2.1%】。★四半期の伸びは4倍ではなく4乗(複利)。同じ表から: GDPデフレーター＝名目÷実質×100(5,980,056÷5,585,100×100＝107.1)／寄与度＝(当期項目−前期項目)÷【前期の名目GDP】(民間企業設備29,109÷5,948,476＝0.5%)／GNI＝名目GDP＋海外からの所得の純受取。",s:"2024-2 Q1◆Tier2(年率換算・寄与度・GNI)"},
 {id:"K70",t:1,q:"◆日本銀行が2024年3月に公表した「金融政策の枠組みの見直し」の内容として正しいものは?",c:["物価安定の目標2%のもと、短期金利の操作を主たる手段とし、当座預金に0.1%の付利、長期国債の買入れは同程度の金額で継続","物価安定の目標1%のもと、長期金利の操作を主たる手段とし、ETFの買入れを継続","物価安定の目標2%のもと、長期金利の操作を主たる手段とし、当座預金に0.01%の付利","マイナス金利を維持しつつ、長短金利操作(YCC)を強化した"],a:0,e:"2024年3月の政策委員会・金融政策決定会合で【マイナス金利政策と長短金利操作付き量的・質的金融緩和(YCC)は役割を果たした】と整理。以後は【物価安定の目標2%】のもと【短期金利】の操作を主たる手段とし、日銀当座預金(所要準備額相当を除く)に【0.1%】の付利、【長期国債】の買入れはこれまでとおおむね同程度の金額で継続(ETF・J-REITは新規買入れ終了)。★『長期金利の操作を主たる手段』が最大の引っかけ。",s:"2024-2 Q7◆Tier1(2024年3月の枠組み見直し)"},
 {id:"K71",t:2,q:"新規発行される物価連動国債に関する記述で正しいものは?",c:["連動する物価指数はエネルギーを除く総合指数で、最低額面金額は5万円","満期は10年、連動指数は生鮮食品を除く総合指数(コアCPI)、最低額面金額は10万円","各利払日の利子額は額面金額に表面利率を乗じた2分の1の額である","償還時の連動係数が1を下回る場合、償還金額も額面を下回る"],a:1,e:"物価連動国債は満期10年・連動指数は【生鮮食品を除く総合指数(コアCPI)】・最低額面金額【10万円】。★各利払日の利子＝【想定元金額(額面×連動係数)】×表面利率÷2＝物価上昇で利子も増える。★2013年以降発行分は【元本保証(フロア)】があり、償還時の連動係数が1を下回っても償還金額は額面金額(ただし最終利子は想定元金額ベース)。",s:"2024-2 Q22(物価連動国債)"},
 {id:"K72",t:2,q:"個人が一般口座で保有していた償還期間1年超の割引債が償還された場合の課税は?",c:["償還金額の全額が源泉徴収の対象となる","みなし償還差益(償還金額×25%)に対して源泉徴収が行われる","源泉徴収は行われず必ず確定申告が必要である","非課税である"],a:1,e:"一般口座の割引債(償還期間1年超)の償還金は【みなし償還差益＝償還金額×25%】に対して源泉徴収される(実際の差益ではない)。特定口座(源泉徴収選択)で保有していた割引債の償還は源泉徴収のみで課税関係を終了できる。★あわせて: 購入時に支払った経過利子は【取得費に含まれる】／個人向け国債の中途換金調整額は【換金に伴う費用に含まれる】。",s:"2024-2 Q23(特定公社債・みなし償還差益)"},
 {id:"K73",t:2,q:"社債の社債管理者の設置義務について正しいものは?",c:["公私募の別や社債の金額にかかわらず、常に設置が義務付けられている","各社債の金額が1億円以上である場合等は設置しなくてよい","私募債の場合のみ設置が義務付けられている","設置は常に任意である"],a:1,e:"社債管理者は原則として設置義務があるが、【各社債の金額が1億円以上】の場合、または【社債の総額÷各社債の金額の最低額が50を下回る】場合は設置不要(会社法702条)。★あわせて: 信用格付業者の【登録は任意】で、無登録の格付機関でも格付付与業務は行える／劣後債は弁済順位が低いため利回りは相対的に高い／デフォルトには返済期限の繰延べや元本の一部払戻しも含まれる。",s:"2024-2 Q24(社債管理者・格付)"},
 {id:"K74",t:1,q:"【型 σ=0との組合せ】期待収益率1.50%・標準偏差0.00%のPF-Aと、期待収益率6.00%・標準偏差6.50%のPF-Bを組み合わせて標準偏差3.90%にするとき、Bの組入比率とPFの期待収益率は?",c:["Bを65%・期待収益率4.23%","Bを60%・期待収益率3.90%","Bを60%・期待収益率4.20%","Bを65%・期待収益率4.43%"],a:2,e:"★片方の標準偏差が0.00%(無リスク資産)なら【σp＝w_B×σ_B】で相関の計算は不要。3.90%＝w_B×6.50% → w_B＝【60%】。期待収益率は常に単純加重平均＝0.4×1.50＋0.6×6.00＝【4.20%】。★10秒で解ける問題。誤答3.90%＝標準偏差の数値を期待収益率と混同、65%＝σの比を取り違え。",s:"2024-2 Q31★Tier1(無リスク資産との組合せ)"},
 {id:"K75",t:1,q:"効率的フロンティア(横軸=標準偏差・縦軸=期待収益率、点Aが右下・点Bが最小分散点・点C・点Dが右上)に関する記述で誤っているものは?",c:["点A−点B−点C−点Dを結ぶ曲線の全体が効率的フロンティアである","最適ポートフォリオは効率的フロンティアと効用無差別曲線の接点(点C)である","同一の効用無差別曲線上ではどの点でも満足度(効用)は等しい","一般的な投資家の効用無差別曲線は右上がりの曲線となる"],a:0,e:"★【効率的フロンティアは最小分散ポートフォリオ(点B)より上の部分だけ】。点A−点Bの下側部分は、同じ標準偏差でより高い期待収益率の組合せが存在するため非効率＝効率的フロンティアに含まれない。最適PFは効率的フロンティアと効用無差別曲線の【接点】。効用無差別曲線は同一曲線上で効用が等しく、リスクが高いほど高いリターンを求めるため右上がり。",s:"2024-2 Q36★Tier1(効率的フロンティアの範囲)／2024-1 Q33で再失点"},
 {id:"K76",t:1,q:"【型 為替予約レート】1年物の米ドル建定期預金で、預入から9ヵ月後に満期(1年後)分の為替予約を行う場合、予約レートの計算に使う金利の期間は?",c:["1年物の金利を使う","9ヵ月物の金利を使う","3ヵ月物の金利を使う","6ヵ月物の金利を使う"],a:2,e:"予約レート＝スポットレート×(1＋円金利×n/12)÷(1＋外貨金利×n/12)。★nは【予約日から満期までの残存期間】。9ヵ月後に予約するなら満期までは残り【3ヵ月】＝3ヵ月物金利を使う(3ヵ月後に予約なら残9ヵ月＝9ヵ月物)。例: 9ヵ月後のスポット142.00円・円1.0%・ドル3.0% → 142×1.0025÷1.0075＝141.30円。★予約をしなかった人は満期時の実勢レートがそのまま適用される＝円安なら予約なしが最も有利になる。",s:"2024-2 Q39★Tier1(為替予約の残存期間)／再回答でも誤答＝★弱点確定"},
 {id:"K77",t:1,q:"【型 外貨定期の円ベース年利回り】10万米ドル・6ヵ月・利率3.60%、預入時仲値150.00円・満期時仲値155.00円・為替手数料片道0.50円、為替予約なしの場合の税引後円ベース年利回りは?",c:["3.34%","6.68%","7.21%","8.27%"],a:1,e:"①預入は【TTS=150.50】→円ベース預入額15,050,000円。②利息＝10万×3.60%×6/12＝1,800ドル、外貨で20%源泉→1,440ドル。③受取は【TTB=154.50】→元本15,450,000円＋利息222,480円。④【為替差益40万円(=15,450,000−15,050,000)は雑所得・総合課税30%】→▲120,000円。⑤利益＝502,480円 → 502,480÷15,050,000＝3.339%(6ヵ月) → 【×2で年換算＝6.68%】。★誤答3.34%＝年換算忘れ、8.27%＝為替差益への課税を忘れ。為替予約を付した場合の差益は20%の源泉分離。",s:"2024-2 Q40★Tier1(円ベース年利回り・為替差益課税)"},
 {id:"K78",t:1,q:"一時払の外貨建て個人年金保険を加入後4年経過時点で解約して解約損20万円が生じた。同年に一時払外貨建て終身保険を8年経過で解約して解約益210万円がある場合、総合課税の所得金額は?",c:["70万円","80万円","95万円","190万円"],a:1,e:"★一時払の養老・個人年金保険等を【契約から5年以内に解約】すると【金融類似商品＝20.315%の源泉分離課税】となり、一時所得に含めない＝【損失も切り捨て】(他の一時所得と通算できない)。よって一時所得は8年経過の解約益210万円のみ→(210万−特別控除50万)×1/2＝【80万円】。誤答70万円＝解約損20万を通算した典型ミス。★外貨預金の為替差損は雑所得の損失で切捨て(他の所得と通算不可)／外国上場株式の配当は配当控除の対象外なので高税率者は申告分離が有利＝総合課税に含めない。",s:"2024-2 Q41★Tier1(金融類似商品・一時所得)"},
 {id:"K79",t:1,q:"年金受給者が、A証券で売却損100万円・B証券で売却益80万円・C証券で売却益70万円(いずれも特定口座・源泉徴収選択)のとき、税金と国民健康保険料の合計を最小にする確定申告は?",c:["3口座すべてを損益通算するために確定申告する","AとBのみを損益通算するために確定申告する(Cは申告不要を選択)","AとCのみを損益通算するために確定申告する(Bは申告不要を選択)","損益通算せず確定申告しない"],a:1,e:"★申告分離で確定申告すると譲渡所得が【合計所得金額に算入され、国民健康保険料の所得割や住民税に波及する】。AとBのみ申告＝通算後▲20万円(損失)なので所得は増えず、Bの源泉税16万円が全額還付(損失20万は繰越も可)。3口座すべて申告すると通算後+50万円が所得に加算され国保が5万円増(還付20万−5万＝15万＜16万)。AとCのみだと還付14万円。★『還付額の最大化』と『通算後の所得を0以下に収める』を両立させる口座の組合せを選ぶ。",s:"2024-2 Q47★Tier1(損益通算の口座選択と国保)／再回答でも誤答＝★弱点確定"},
 {id:"K80",t:1,q:"居住者である個人の暗号資産の税務(事業として行うものではない)について正しいものは?",c:["売却益は雑所得として総合課税、FX等の先物取引等から生じた所得と損益通算できず、翌年以降に繰り越すこともできない","売却益は申告分離課税で、損失は3年間繰り越せる","売却益は雑所得だが、FX等の先物取引等の所得と損益通算できる","売却益は譲渡所得として総合課税される"],a:0,e:"暗号資産の売却等による所得は【雑所得・総合課税】(申告分離ではない)。損失は【先物取引に係る雑所得等(FX・くりっく365等の申告分離)と損益通算できない】し、【翌年以降への繰越しもできない】。★他の雑所得(総合課税)内での内部通算は可能。",s:"2024-2 Q49★Tier1(暗号資産の税務)"},
 {id:"K81",t:1,q:"金融ADR制度について正しいものは?",c:["紛争解決委員は当該金融機関に所属する弁護士が担当する","利用費用は各金融ADR機関が定めているが、一部を除き無料である","標準的な処理期間は1〜3年である","金融ADR機関が設立されていない業態の金融機関は、苦情処理・紛争解決措置を定める必要はない"],a:1,e:"金融ADRの利用費用は各機関が定めるが【一部を除き無料】。紛争解決委員は当該金融機関に所属しない【中立・公正な弁護士・消費生活相談員等】。処理期間は数ヵ月程度が標準。★【指定ADR機関が存在しない業態の金融機関も、苦情処理措置・紛争解決措置の内容を定める義務がある】(社内対応や外部機関の利用等)。窓口の業態別分担はK22参照。",s:"2024-2 Q50(金融ADRの費用・体制)／再回答でも誤答＝★弱点確定Tier1"},
 {id:"K82",t:2,q:"株式のコーポレートアクションに関する記述で誤っているものは?",c:["株式分割を行うには株主総会の特別決議が必要である","株式無償割当てでは自己株式への割当ては行わない","株式併合は発行済株式数を減らすが理論上の会社の資産価値には影響しない","株式交換では子会社の株主が親会社株式等を対価として受け取る"],a:0,e:"★【株式分割は取締役会決議】で行える(株主総会の特別決議は不要)。一方【株式併合は株主総会の特別決議が必要】＝ここが逆になる引っかけ。株式無償割当ては既存株主に無償で割り当てるが自己株式には割り当てない。株式併合・分割は理論上の資産価値に影響しない。株式交換はM&Aの手法で、子会社となる会社の発行済株式全部を親会社が取得し、子会社株主は親会社株式等を対価として受け取る。",s:"2024-2 Q16(コーポレートアクション)"},
 {id:"K83",t:2,q:"財形年金貯蓄・財形住宅貯蓄に関する記述で正しいものは?",c:["財形年金貯蓄では積立終了から年金受取開始までに10年以内の据置期間を設けられる","財形住宅貯蓄を土地のみの購入代金に充てるために払い出す場合は課税扱いで払い出すことになる","60歳以降も勤務する人は財形年金貯蓄を受け取りながら積立を継続できる","財形住宅貯蓄を耐震強化工事費用に充てる場合、工事費用の額にかかわらず利子等は非課税になる"],a:1,e:"財形住宅貯蓄の非課税払出しは【住宅の取得・一定の増改築】が対象で、【土地のみ(借地権の取得費含む)は目的外＝課税扱い】で払い出す。★据置期間は【5年以内】(10年ではない)。★年金の受取開始後は積立を継続できない。★耐震・省エネ・バリアフリー等の工事は【工事費用75万円超】が要件(額にかかわらずではない)。",s:"2024-2 Q11(財形の細則)"},
 {id:"K84",t:2,q:"個人型確定拠出年金(iDeCo)に関する記述で正しいものは?",c:["第1号被保険者はiDeCo4万円＋国民年金基金3万円の組合せで拠出できる","利率保証型積立生命保険では市場金利に応じて満期までの間に保証利率が変動する","掛金の拠出は毎月のほか、夏・冬のボーナス時のみの拠出や年1回のみの拠出も可能である","ターゲットイヤー型ファンドでは加入者自身がリスクの高いファンドから低いファンドへ乗り換える必要がある"],a:2,e:"iDeCoの掛金は毎月拠出のほか【年単位拠出】が可能(ボーナス月のみ・年1回など、年間の限度額の範囲内)。★第1号被保険者はiDeCo＋国民年金基金＋付加保険料で【合計月6.8万円】が上限(4万＋3万＝7万は不可)。★利率保証型は設定時の保証利率が満期まで固定。★ターゲットイヤー型は目標年に向けて【自動的に】リスク資産比率を下げる(加入者の乗換不要)。拠出限度額はK45参照。",s:"2024-2 Q12(iDeCoの年単位拠出)"},
 {id:"K85",t:2,q:"預貯金・金融商品に関する記述で正しいものは?",c:["貯蓄預金は給与や年金の自動受取口座および公共料金の引落口座に指定できる","スーパー定期の預入期間2年以上の単利型には1年ごとの応当日に中間利払いがある","実績配当型金銭信託は元本補てん契約がないものの預金保険制度の保護対象である","ゆうちょ銀行の貯金担保自動貸付の貸付利率は担保定額貯金の場合、返済時の約定利率＋0.5%である"],a:1,e:"【スーパー定期の預入期間2年以上の単利型は1年ごとの応当日に中間利払い】がある(複利型は3年以上の個人のみ)。★【貯蓄預金は給与・年金の自動受取口座や公共料金の引落口座には指定できない】。★実績配当型金銭信託(元本補てん契約なし)は預金保険の【対象外】。★ゆうちょの貯金担保自動貸付の利率は返済時の約定利率＋【0.25%】。",s:"2024-2 Q9(預貯金の細則)"},
 {id:"K86",t:2,q:"国内の物価指数に関する記述で正しいものは?",c:["消費者物価指数は消費税のほかに直接税や社会保険料などの支出も含んで作成されている","消費者物価指数は公的年金の給付額や児童扶養手当の額を物価に応じて改定するための算定基準となっている","国内企業物価指数は生産者段階の出荷時点の価格を調査するため消費税を含まない価格で作成されている","輸入物価指数は契約通貨ベースと円ベースが公表されるが、輸出物価指数は円ベースのみ公表されている"],a:1,e:"消費者物価指数(CPI)は【公的年金の給付額や児童扶養手当の額の改定の算定基準】となる(正しい肢)。★CPIは消費税を含むが【直接税や社会保険料は含まない】(それらは消費支出ではない)。★国内企業物価指数(CGPI)は【消費税を含む価格】で作成される。★輸出物価指数も【契約通貨ベースと円ベースの両方】が公表される。",s:"2024-2 Q3◆Tier2(物価指数)"},
 {id:"K87",t:2,q:"個人が国内の業者を通じて行う外国為替証拠金取引(FX)に関する記述で正しいものは?",c:["新規取引を行う際には取引額の25%以上の証拠金を預託しなければならない","金利の低い通貨で金利の高い通貨を買うとスワップポイントを支払うことになる","取引所為替証拠金取引(くりっく365)では同一通貨ペア・同一数量のスワップポイントの受取額と支払額は同額となる","FXの決済期限は新規建てから6ヵ月以内である"],a:2,e:"【取引所FX(くりっく365)は同一通貨ペア・同数量のスワップポイントの受取額と支払額が同額】(店頭FXは業者が独自に設定するため非対称)。★個人の証拠金は取引額の【4%以上】＝レバレッジ最大25倍(法人は通貨ペアごとに変動)。★金利の低い通貨を売り高い通貨を買えばスワップポイントは【受取】。★店頭FXの決済期限は原則なし(無期限)。",s:"2024-2 Q46(取引所FXのスワップ)"},
 {id:"K88",t:1,q:"【2024-2 Q38の設例】豪ドル建て公募外国株式投信(分配金は支払時に全額再投資・1口未満は切上げ)。購入2022/4/25＝500口・純資産価格98.80豪ドル(1豪ドル＝93.40円)。分配金と《分配金落ち後》の純資産価格／為替は 2022/9/5＝1.50豪ドル・100.06豪ドル／97.50円、2023/9/5＝1.50豪ドル・93.90豪ドル／94.20円、2024/9/5＝1.20豪ドル・88.70豪ドル／100.20円。2022/9/5(分配金落ち後)〜2024/9/5(分配金落ち後)の《円ベース》騰落率(分配金込み)は?",c:["▲6.03%","▲4.72%","▲5.86%","▲2.34%"],a:0,e:"★手順＝各時点の【口数×分配金落ち後の純資産価格×その日の為替レート】で円評価額を出して比較する。再投資型は口数の増加が分配金の受取に相当するので、これで自動的に『分配金込み』になる。①口数の積み上げ(必ず《落ち後》価格で割り、1口未満は切上げ)：500口→2022/9/5は分配500×1.50＝750豪ドル÷100.06＝7.4955→+8口＝508口→2023/9/5は508×1.50＝762÷93.90＝8.1150→+9口＝517口→2024/9/5は517×1.20＝620.40÷88.70＝6.9944→+7口＝524口。②起点＝508×100.06×97.50＝4,955,971円／終点＝524×88.70×100.20＝4,657,175円。③騰落率＝4,657,175÷4,955,971−1＝【▲6.03%】。設問の▲4.72%は誤り＝2024-2 Q38の正解肢は4。★同設例の他の3肢はすべて正しい：外貨ベース保有期間利回り＝(46,505−49,400)÷49,400＝▲5.86%を保有年数2.5年で割って【▲2.34%】(年率換算を忘れると▲5.86%)／円転の損益分岐レート＝円ベース購入金額4,613,960÷解約外貨額46,505＝【99.22円】(小数第3位切上げ)／解約時レート100.05で円転した税引前利益＝46,505×100.05−4,613,960＝【38,865円】。★誤答の道＝分配金落ち《前》の価格で割る／1口未満を切捨てる／外貨のまま比べて円換算を省く。",s:"2024-2 Q38(実際に失点した設例)★弱点確定Tier1／2026-07-31 手順を問う設問から【実際の計算問題】へ差替(本人希望・公式解答で正解4を照合済)"},
 {id:"K89",t:2,q:"【型 理論価格からの逆算】スポットレート(1年0.7%・2年1.00%・3年1.40%)のとき、複利計算による理論価格で購入する残存3年の割引債VAの価格は?また残存2年・表面利率1.50%の利付債RAの理論価格は?",c:["VA＝95.915円／RA＝100.999円","VA＝95.915円／RA＝98.500円","VA＝97.920円／RA＝100.999円","VA＝96.500円／RA＝101.500円"],a:0,e:"★理論価格＝各キャッシュフローを【その年限のスポットレート】で割り引いて合計する。VA(割引債3年)＝100÷1.014^3＝【95.915円】。RA(利付債2年・表面1.5%)＝1.5÷1.007＋101.5÷1.01^2＝1.4896＋99.5099＝【100.999円】(1年目の利子は1年物0.7%、2年目の利子＋償還は2年物1.00%で割引)。★応用: 額面100万円ならRAの購入額1,009,994円・償還まで保有の利益＝(30,000＋1,000,000)−1,009,994＝20,006円 → VAで同じ利益を出す2年後の売却単価＝(959,145＋20,006)÷10,000＝97.92円。",s:"2024-2 Q19,Q20(スポットレートによる理論価格)"},
 {id:"K90",t:2,q:"金融サービスの提供及び利用環境の整備等に関する法律(金融サービス提供法)について正しいものは?",c:["金融サービス仲介業者は内閣総理大臣の登録により、高度に専門的な説明を必要とする金融商品も横断的に取り扱える","金融サービス仲介業者は、顧客から求められたときは仲介業務に関して受け取る手数料・報酬等を明示する必要がある","対象となる金融商品には外国為替証拠金取引(FX)や暗号資産は含まれない","金融サービス仲介業者は損害賠償責任が課されないため保証金の供託は任意である"],a:1,e:"金融サービス仲介業者は【顧客から求められたときは手数料・報酬等を明示する義務】がある(正しい肢)。★1つの登録で預金・保険・有価証券等を【横断的】に取り扱えるが、対象は【高度に専門的な説明を必要としない】商品に限定される。★FX・暗号資産も金融サービス提供法の対象(ゴルフ会員権等は除外)。★顧客に損害を与えた場合の賠償に備え【保証金の供託は義務】。",s:"2024-2 Q48(金融サービス提供法)"},
 {id:"K92",t:1,q:"【★3回連続失点】日経平均株価が33,000円、短期金利0.05%、配当利回り2.00%、取引最終日までの残存日数146日のとき、日経225先物の理論価格は?",c:["33,258.90円","32,742.60円","33,000.00円","32,340.00円"],a:1,e:"理論価格＝現物価格×{1＋(【短期金利−配当利回り】)×残存日数÷365}＝33,000×{1＋(0.0005−0.02)×146/365}＝33,000×(1−0.0078)＝【32,742.60円】。★【配当利回り(2.00%)＞短期金利(0.05%)なので理論価格は現物より安い＝ディスカウント】。誤答33,258.90円＝符号を逆にした(金利−配当を配当−金利にした)最頻ミス。★この型は2025①Q44→2024②Q45→2024①Q44と【3回連続で失点】している最頻失点型。まず『配当と金利のどちらが大きいか』を見て、現物より高いか安いかを先に決めてから計算する。",s:"2024-1 Q44／2024-2 Q45／2025-1 Q44★Tier1(3回連続失点・符号)"},
 {id:"K93",t:1,q:"年金受給者が保有する国内上場株式の配当所得について『申告不要』と『総合課税で全額申告』を比較する場合、比較に含めなければならない負担はどれか?",c:["所得税と住民税のみ","所得税・住民税・国民健康保険料(所得割)の3つ","所得税のみ","住民税と国民健康保険料のみ"],a:1,e:"配当を総合課税で申告すると【合計所得金額に算入され、国民健康保険料(所得割)や住民税に波及する】ため、所得税の還付だけを見て判断すると誤る。★比較は【所得税＋住民税＋国民健康保険料(所得割)】の3つの合計で行う。配当控除(課税総所得1,000万円以下は所得税10%・住民税2.8%)で所得税が減っても、国保の所得割が増えて逆に不利になる場合がある。★【この型は表があっても捨て問にしない】＝2024①Q48を捨て問と誤判断して失点した反省(2024②Q47と同一論点)。",s:"2024-1 Q48／2024-2 Q47★Tier1(捨てずに取る・国保への波及)"},
 {id:"K94",t:1,q:"証券・金融商品あっせん相談センター(FINMAC)が取り扱う紛争の範囲について正しいものは?",c:["株式・投資信託・FXなど証券・金融商品の取引に関する紛争を扱い、預金は全国銀行協会、生命保険は生命保険協会が窓口となる","預金・保険・証券のすべての金融商品の紛争を一元的に扱う","銀行の預金トラブルもFINMACが扱う","保険会社との紛争もFINMACが扱う"],a:0,e:"金融ADRは【業態別】に窓口が分かれる。FINMAC＝証券・金融商品(株式・投資信託・FX・デリバティブ等)／【預金・融資＝全国銀行協会】／【生命保険＝生命保険協会】／【損害保険＝そんぽADRセンター】。★『すべてを一元的に扱う』は誤り＝K22と同じ論点で2024①Q49で再失点。利用費用は一部を除き無料、紛争解決委員は中立・公正な弁護士等(K81)。",s:"2024-1 Q49(K22の再失点)★Tier1(金融ADRの業態別窓口)"},
 {id:"K95",t:1,q:"犯罪による収益の移転防止に関する法律(犯罪収益移転防止法)の取引時確認について正しいものは?",c:["印鑑登録証明書と公共料金の領収書を提示すれば本人確認は完了する","本人確認書類の提示または送付を受けることが必要で、顧客管理上特別の注意を要する取引(ハイリスク取引)では厳格な確認が求められる","電話での口頭確認のみで足りる","法人の場合は代表者の確認だけで足りる"],a:1,e:"取引時確認は【本人確認書類の提示または送付】が必要(氏名・住居・生年月日・取引目的・職業等を確認)。★【ハイリスク取引】(なりすましの疑い、特定国に居住する者との取引、200万円超の財産移転を伴う取引等)では【通常より厳格な方法】での確認が必要。法人の場合は法人自体の確認に加え【実質的支配者】と【取引担当者】の確認も必要。印鑑登録証明書＋領収書の組合せでは完了しない。",s:"2024-1 Q50★Tier1(犯罪収益移転防止法・新規)"},
 {id:"K96",t:1,q:"オプションのプレミアム(オプション料)の時間的価値について正しいものは?",c:["満期までの期間が長いほど時間的価値は増え、ボラティリティが大きいほど増える。満期に近づくと逓減し満期にはゼロになる","満期までの期間が長いほど時間的価値は減る","ボラティリティが小さいほど時間的価値は増える","時間的価値は満期時にも残る"],a:0,e:"プレミアム＝【本質的価値＋時間的価値】。本質的価値＝イン・ザ・マネー(ITM)の部分のみ(アウト・オブ・ザ・マネーならゼロ)。★時間的価値は【残存期間が長いほど大きい／ボラティリティが大きいほど大きい】、そして【満期に近づくにつれ逓減し、満期時にはゼロ】になる(タイムディケイ)。アット・ザ・マネー付近で時間的価値は最大。",s:"2024-1 Q47★Tier1(時間的価値・新規)"},
 {id:"K97",t:2,q:"大阪取引所に上場されている国債先物取引の『標準物』の利率と、中期・長期・超長期の償還期限の組み合わせで正しいものは?",c:["利率3%／中期3年・長期5年・超長期10年","利率6%／中期5年・長期10年・超長期20年","利率6%／中期3年・長期7年・超長期15年","利率1%／中期5年・長期10年・超長期30年"],a:1,e:"国債先物は実在しない【標準物(利率6%)】を取引対象とする。償還期限は【中期5年・長期10年・超長期20年】。取引単位は額面【1億円】(ミニ長期国債先物は1,000万円)。呼値の単位は長期国債先物が1銭。★数字がそのまま問われる暗記事項。",s:"2024-1 Q45(国債先物の仕組み・新規)"},
 {id:"K98",t:1,q:"株価が今後大きく変動しないと予想する投資家が、プレミアム収入を狙ってとる合成ポジションと、その損益図の特徴は?",c:["コールの買いとプットの買いを組み合わせる。損益図は中央が下がり両端が上がる","コールの売りとプットの売りを組み合わせる(ストラドル／ストラングルの売り)。損益図は中央が水平で受取プレミアムが利益の上限、両端は損失が拡大する","コールの買いのみ。損益は上方に無限","プットの買いのみ。損益は下方に無限"],a:1,e:"株価が動かないと予想するなら【オプションを売ってプレミアムを受け取る】。同じ権利行使価格でコールとプットを売る＝【ストラドルの売り】、異なる権利行使価格なら【ストラングルの売り】。★損益図は【中央が水平(利益＝受取プレミアムが上限)】で【両端が下がる(損失は無限)】。逆に大きく動くと予想するなら買い(中央が下がり両端が上がる)。★『図の水平部分＝受取プレミアム／両端の傾き＝売りポジション』で読む。",s:"2024-1 Q43／2024-2 Q42(合成ポジションの損益図)"},
 {id:"K99",t:1,q:"【★2024①Q34】リスク(標準偏差)を横軸、期待収益率を縦軸にとった図で、無リスク資産の点から投資可能領域に引いた接線と、その接点の呼び方は?",c:["接線＝証券市場線、接点＝最小分散ポートフォリオ","接線＝資本市場線、接点＝接点ポートフォリオ(市場ポートフォリオ)","接線＝効率的フロンティア、接点＝無リスクポートフォリオ","接線＝無差別曲線、接点＝最適ポートフォリオ"],a:1,e:"★【横軸σ(リスク)の図＝資本市場線(CML)】。無リスク資産の収益率から効率的フロンティアに引いた接線が資本市場線で、【接点＝接点ポートフォリオ＝市場ポートフォリオ】。効率的フロンティアは【最小分散点より上の部分だけ】(K75)。★【横軸β(ベータ)の図＝証券市場線(SML)】＝CAPMの式 Rf＋β(Rm−Rf) を表す(K34系)。**横軸がσかβかで名前が変わる**のが最大の引っかけ。",s:"2024-1 Q34★Tier1(資本市場線と証券市場線の区別)"},
 {id:"K100",t:1,q:"行動ファイナンスの心理バイアスの名称について正しいものは?",c:["損失を取り戻そうと普段よりリスクを取る＝ブレーク・イーブン効果／売却益と配当を別勘定で考える＝メンタルアカウンティング","損失を取り戻そうとリスクを取る＝ハウスマネー効果／別勘定で考える＝保有効果","損失を取り戻そうとリスクを取る＝アンカリング／別勘定で考える＝処分効果","損失を取り戻そうとリスクを取る＝メンタルアカウンティング／別勘定で考える＝ブレーク・イーブン効果"],a:0,e:"【ブレーク・イーブン効果】＝損失を取り戻そうと普段より積極的にリスクを取る／【メンタルアカウンティング(心の会計)】＝売却益と配当、給与と臨時収入などを別勘定で扱う／【ハウスマネー効果】＝儲けた資金は大胆に使う／【保有効果(授かり効果)】＝自分が持っているものを実際より高く評価／【処分効果】＝含み益は早く確定し含み損は放置する／【アンカリング】＝最初に見た数値に引きずられる。★用語と定義の対応がそのまま問われる。",s:"2024-1 Q35(行動ファイナンスの心理バイアス)"},
 {id:"K101",t:2,q:"一般NISA口座の非課税期間が終了し、保有していた投資信託を課税口座(特定口座)へ移管した場合の取得価額は?",c:["当初のNISA口座での購入価額を引き継ぐ","移管時の時価が新たな取得価額となる","ゼロとして扱われる","移管時の時価と当初購入価額の平均"],a:1,e:"NISA口座の非課税期間終了により課税口座へ移管した場合、【移管時の時価が新たな取得価額】となる。★値下がりしていた場合、その含み損は【なかったことになる】(移管後に元の価格まで戻ると課税対象の利益が生じる)＝NISAの不利な側面。NISA期間中に受け取った分配金・譲渡益は非課税。",s:"2024-1 Q27(NISA非課税期間終了と移管)"},
 {id:"K102",t:2,q:"確定拠出年金制度で利用する定期預金と、同じ銀行に個人で保有する預金がある場合の預金保険の扱いは?",c:["それぞれ別枠で元本1,000万円まで保護される","原則として合算して元本1,000万円までとその利息が保護される","確定拠出年金の預金は保護対象外である","確定拠出年金の預金のみ全額保護される"],a:1,e:"確定拠出年金制度で利用する預金も預金保険の対象だが、【同一金融機関の個人の預金と合算】して元本1,000万円までとその利息が保護される(別枠ではない)。★DC専用だから別枠、という思い込みが誤り。なお利率保証型積立生命保険は生命保険契約者保護機構の対象(責任準備金の90%)。",s:"2024-1 Q13(DCと預金保険の合算)"},
 {id:"K103",t:2,q:"変動金利定期預金およびゆうちょ銀行の定期貯金の自動継続について正しいものは?",c:["変動金利定期預金は6ヵ月ごとに適用利率が見直され、指標金利への上乗せ幅は預入時の水準が満期まで続く。ゆうちょの自動継続は元利継続・元金継続の両方を選べる","変動金利定期預金の上乗せ幅も6ヵ月ごとに変動する","ゆうちょの自動継続は元利継続しか選べない","変動金利定期預金は1年ごとに利率が見直される"],a:0,e:"変動金利定期預金は【6ヵ月ごとに適用利率を見直す】が、指標金利に上乗せされるスプレッドは【預入時に決まった水準が満期まで続く】。ゆうちょ銀行の定期貯金の自動継続は【元利継続と元金継続のどちらも選べる】(元利継続しか選べないは誤り)。★スーパー定期2年以上の単利型は1年ごとに中間利払い(K85)。",s:"2024-1 Q10(変動金利定期・自動継続)"},
 {id:"K104",t:2,q:"◆GDP統計に関する記述で正しいものは?",c:["一次速報値は各四半期の翌月中旬に公表される","実際のGDPが潜在GDPを下回るときのギャップをデフレギャップという","名目GDPは実質GDPをGDPデフレーターで割って求める","実際のGDPが潜在GDPを下回るときのギャップをインフレギャップという"],a:1,e:"★実際のGDPが潜在GDPを【下回る】＝【デフレギャップ】(需要不足)／【上回る】＝インフレギャップ。一次速報は各四半期の【翌々月中旬】(翌月中旬ではない)、二次速報はさらに約1ヵ月後。名目GDP＝実質GDP×GDPデフレーター÷100(割るのではなく掛ける)。四半期の成長率の年率換算は(1+前期比)^4−1(K69)。",s:"2024-1 Q1◆Tier2(GDP統計の基本)"},
 {id:"K105",t:3,q:"◆日本の家計の金融資産残高の規模(2023年6月末・日銀資金循環統計)は?",c:["約1,000兆円","約2,100兆円","約3,500兆円","約700兆円"],a:1,e:"2023年6月末時点の家計の金融資産残高は約【2,115兆円】＝【2,000兆円超】と覚える。構成は現金・預金が約半分、次いで保険・年金、株式・投資信託。★数字カードに追加する項目(直前期に最新値へ更新)。日本の家計は現金・預金比率が高く米国は株式・投資信託比率が高い、という対比も頻出。",s:"2024-1 Q7◆Tier3(資金循環統計の数字)"},
 {id:"K106",t:1,q:"【2024-2 Q25の設例】基準価額12,500円で100万口購入→2023/8決算(分配600円・落ち後12,000円)→2024/1に14,000円で100万口追加購入→2024/8決算(分配700円・落ち後12,800円)。受け取った普通分配金の合計は?(1万口当たり・税金は考慮しない)",c:["60,000円","90,000円","110,000円","200,000円"],a:2,e:"【手順】①2023/8：分配前＝落ち後12,000＋分配600＝12,600。個別元本12,500 → 分配前12,600＞12,500なので【普通分配は差額の100円】、残り500円は元本払戻金→個別元本は12,000へ減額。100万口＝100単位 → 10,000円。②2024/1追加購入：個別元本＝(12,000＋14,000)÷2＝【13,000円】(加重平均)。③2024/8：分配前＝12,800＋700＝13,500。13,500−13,000＝【普通分配500円】×200単位＝100,000円。④合計【110,000円】。★誤答60,000＝1回目の分配600円をそのまま普通分配とした／200,000＝2回とも全額を普通分配とした。★【分配前基準価額と個別元本の差が普通分配の上限／落ち後が個別元本を下回るとその分だけ個別元本が減る】。",s:"2024-2 Q25(実際に失点した設例)★Tier1／K1の後継(K1は選択肢を記憶したためt3へ)"},
 {id:"K107",t:1,q:"【2024-1 Q46の設例】個人が国内業者を通じて行う外国為替証拠金取引(FX)に関する記述のうち、誤っているものは?",c:["取引所取引の「くりっく365」と店頭取引の2種類がある","証拠金の最大25倍(証拠金は取引額の4%以上)まで取引できる","店頭FXの決済期限は新規建てから6ヵ月以内である","金利の低い通貨を売り高い通貨を買えばスワップポイントを受け取れる"],a:2,e:"★【店頭FXの決済期限は原則なし(無期限)】＝これが誤り。ポジションは任意のタイミングで決済でき、期限による強制決済はない(取引所FXも同様)。★個人の証拠金は【取引額の4%以上＝レバレッジ最大25倍】(法人は通貨ペアごとに変動)。くりっく365＝東京金融取引所に上場する取引所取引で、【同一通貨ペア・同数量ならスワップポイントの受取額と支払額が同額】(店頭FXは業者が独自設定するため非対称＝K87)。金利の低い通貨を売り高い通貨を買えばスワップは受取。",s:"2024-1 Q46(実際に失点した設例)★Tier1／K37の後継(K37は選択肢を記憶したためt3へ)"},
 {id:"K108",t:1,q:"【2025-1 Q19の設例】制度信用取引・貸借取引に関する次の記述のうち、正しいものは?",c:["貸借取引で融資残高が貸株残高を超過して株不足が発生したとき、証券金融会社が不足株数を入札で調達する費用を「信用取引貸株料」という","逆日歩が付いた銘柄を制度信用取引で売建てしている顧客は、当該逆日歩の金額を受け取ることができる","逆日歩が付いた銘柄を制度信用取引で買建てしている顧客は、当該逆日歩の金額を受け取ることができる","貸借取引において、証券金融会社は借株を申し込んだ証券会社から担保の差入れを受け、融資を行った証券会社にその株式を貸し付ける"],a:2,e:"★【逆日歩(品貸料)＝売り方が払い、買い方が受け取る】。株を借りて売っている売建ての顧客が調達コストを負担し、買建ての顧客が受け取る。方向を逆にした記述が最頻の誤り(2025-1 Q19肢4)。覚え方＝『足りないのは株、足りなくした張本人は売り方』。★株不足時に証券金融会社が入札で調達する費用は【品貸料(逆日歩)】であって『信用取引貸株料』ではない(同Q19肢3)。信用取引貸株料は売建て顧客が証券会社に払う株の借り賃(年率)で全くの別物。★貸借取引の正しい流れ＝証券金融会社は【融資を行った証券会社】から担保として顧客が買った株式の差入れを受け、【借株を申し込んだ証券会社】にその株式を貸し付ける(肢4はこれを逆にしたもの＝Q19の正解肢は肢2)。★制度信用＝取引所が銘柄選定・返済期限は最長6ヵ月・逆日歩あり／一般信用＝証券会社が銘柄選定・返済期限も証券会社が定める(無期限可)・逆日歩なし(2024-1 Q18)。委託保証金は約定代金の30%以上かつ30万円以上。",s:"2025-1 Q19(実際に失点した設例＝肢3の『信用取引貸株料』と肢4の受払の向きを見抜けず)★Tier1／K47の後継(K47は選択肢を記憶したためt3へ)／2026-07-31 内容差替(2024-1 Q18の銘柄選定→2025-1 Q19の逆日歩・貸借取引へ＝実際の失点論点に合わせる)"},
 {id:"K91",t:1,q:"【★罠 償還差損の還付】特定口座(源泉徴収選択)で保有する外貨建債券が償還され、円ベースで320,000円の償還差損が出た。確定申告を行わない場合、還付される税額の計算で正しいものは?",c:["保有期間中に受け取った全利子(8回分・1,262,080円)と通算し、320,000円×20%＝64,000円が還付される","償還と同じ年に受け取った利子(2回分・315,520円)を上限に通算し、315,520円×20%＝63,104円が還付される(引ききれない4,480円は切捨て)","償還差損は利子と通算できないため還付はない","確定申告をしなくても翌年以降に損失を繰り越せる"],a:1,e:"★特定口座(源泉徴収あり)で【確定申告を行わない】場合、償還差損と通算できるのは【その同じ年に受け取った利子等】に限られる。過去の年に受け取った利子に遡って通算することはできない。→ 償還年の利子2回分315,520円が通算の上限、還付は315,520×20%＝【63,104円】。引ききれない4,480円の損失は切り捨て(確定申告すれば同年の他の上場株式等の所得と通算・繰越が可能)。★『損失全額×20%が還付』としないこと＝2024-2 Q37の最大の罠。※Q37自体は多段計算で本番では捨て問だが、この論点だけは持ち帰る価値がある。",s:"2024-2 Q37★Tier1(償還差損の通算は同一年内の利子まで)"},
 {id:"K109",t:1,q:"【複利単価の基本】割引債券（残存4年・複利利回り2.80%）の理論価格（単価）はいくらか。P×(1+r)^n＝100 の関係から求める。※小数点以下第3位四捨五入",c:["89.93円","88.80円","89.54円","97.28円"],a:2,e:"★【割引債の複利単価＝100÷(1+r)^n】。P×1.028^4＝100 → P＝100÷1.1167924＝89.5422→【89.54円】。★これが債券計算のすべての土台。利付債の単価も、これを各キャッシュフローの数だけ足すだけ（＝各CFを対応年限のレートで割った現在価値の合計）。★誤答の型：89.93＝単利で100÷(1+0.028×4)としたもの／88.80＝額面から利息を単純に引いたもの／97.28＝100÷1.028で【1回しか割っていない】もの。★電卓：1.028 ×× === （＝を3回）で4乗＝1.1167924。機種で挙動が違うので本番前に手元の電卓で必ず確認する。",s:"2025-2 Q21(割引債FB)／bond_concept.html §1・§6★Tier1（債券計算の土台）／2026-08-04 新規"},
 {id:"K110",t:1,q:"【2025-2 Q21】割引債券FB（残存4年・複利利回り2.80%）の修正デュレーションはいくらか。",c:["4.0000","3.8911","4.1120","2.9553"],a:1,e:"★【割引債のマコーレー・デュレーション＝残存期間そのもの】（途中にキャッシュフローがないため）＝4年。★【修正デュレーション＝マコーレーD÷(1+r)】＝4÷1.028＝【3.8911】。★誤答の型：4.0000＝マコーレーDのままで修正を忘れたもの／4.1120＝(1+r)で割らずに掛けたもの／2.9553＝同じ大問の利付債RA（残存3年・利率1.50%・複利利回り2.30%）のマコーレーDで、別の債券のもの。★利付債のマコーレーDは加重平均＝Σ(各CFの現在価値×経過年数)÷価格。",s:"2025-2 Q21★Tier1（修正D＝マコーレーD÷(1+r)）／bond_concept.html §7／2026-08-04 新規"},
 {id:"K111",t:1,q:"【2025-2 Q21】現在の価格89.54円・修正デュレーション3.8911の割引債券FBについて、金利が1%下落した場合の価格はいくらか。価格変化率＝−(金利の変化幅×修正デュレーション)とする。",c:["86.06円","93.11円","93.02円","89.89円"],a:2,e:"★【価格変化率＝−(金利の変化幅×修正D)】。金利が1%【下落】＝変化幅−1% → 価格変化率＝−(−1×3.8911)＝【＋3.8911%】→ 89.54×1.038911＝【93.02円】。符号で必ず迷うので『金利↓なら価格↑』を先に決めてから電卓を打つ。★誤答の型：86.06＝符号を逆にして値下がりさせたもの／89.89＝変化率を0.38911%と桁を間違えたもの／93.11＝【同じ設問の(イ)＝複利利回りが1.80%に下落したときの理論価格100÷1.018^4】であって(ア)ではない。★(ア)93.02＜(イ)93.11となる理由はコンベクシティ（実際の価格曲線は下に凸なので、修正Dによる直線近似は金利低下時に価格を過小評価する）。",s:"2025-2 Q21(ア)★Tier1（修正Dによる価格変化の近似）／bond_concept.html §7／2026-08-04 新規"},
 {id:"K112",t:1,q:"【フォワードレート】スポットレートが1年1.40%・2年2.00%・3年2.50%・4年2.80%のとき、f(1,2)＝1年後スタート・1年間のフォワードレートはいくらか。※%表示の小数点以下第3位四捨五入",c:["2.00%","2.60%","1.40%","3.51%"],a:1,e:"★【(1+S2)^2＝(1+S1)×(1+f1,2)】＝時間は足し算ではなく【掛け算】でつながる。f(1,2)＝1.02^2÷1.014−1＝1.0404÷1.014−1＝0.026035→【2.60%】。★期間＝添字の引き算＝2−1＝1年なので【ルートは不要】。★検算：1年目1.40%と2年目2.60%を平均するとおよそ2.00%＝S2になる。合わなければ計算ミス。★誤答の型：2.00%＝S2をそのまま答えたもの／1.40%＝S1をそのまま答えたもの／3.51%＝f(2,3)＝2年後スタートのもので添字の読み違い。",s:"2025-2 Q22の表を使用／bond_concept.html §8 Q1★Tier1（フォワードの基本形）／2026-08-04 新規"},
 {id:"K113",t:1,q:"【フォワードレート】同じスポットレート（1年1.40%・2年2.00%・3年2.50%・4年2.80%）のとき、f(1,3)＝1年後スタート・2年間のフォワードレートはいくらか。※%表示の小数点以下第3位四捨五入",c:["6.20%","2.60%","2.50%","3.05%"],a:3,e:"★期間＝3−1＝【2年】なので、割り算のあとに【√を1回】押す。f(1,3)＝√(1.025^3÷1.014)−1＝√(1.076890625÷1.014)−1＝√1.0620223−1＝0.030549→【3.05%】。★誤答の型：6.20%＝【ルートを取り忘れた】最頻ミス（1.0620223−1をそのまま%にしたもの）。2年ぶんの伸びを年率に直すには期間の乗根を取る、を必ずセットにする／2.60%＝f(1,2)＝期間1年のもの／2.50%＝S3そのまま。★一般電卓では√を1回で2乗根、2回で4乗根。期間2年なら√1回でよい。★求めたフォワードレートは【%の小数第2位に丸めてから】単価計算に入れる（丸めずに使うと選択肢に無い答えになる＝2025-2 Q22の罠）。",s:"2025-2 Q22の表を使用／bond_concept.html §8 Q2★Tier1（期間2年＝ルート1回）／2026-08-04 新規"},
 {id:"K114",t:1,q:"【2025-1 Q38・通し計算】新発トルコリラ建てゼロクーポン債（額面200万トルコリラ・期間4年・現地通貨ベースの税引前年1回複利利回り20.00%・償還価格は額面の100%）。購入時の為替レートは仲値1トルコリラ＝4.25円、為替手数料は片道0.25円。償還時の為替レートは購入時と同じ。償還差益には20%が源泉徴収される。円ベースでの税引後年1回複利利回りは?",c:["10.19%","12.00%","13.75%","16.76%"],a:2,e:"★【4段階でつなぐ。個別の式を知っていても『つなげる』練習をしないと解けない】★①発行価格＝100÷(1+0.20)^4＝100÷2.0736＝【48.2253】→現地購入額＝200万×48.2253%＝【964,506トルコリラ】。★②購入は【TTS＝仲値＋手数料＝4.25＋0.25＝4.50円】→円の投資額＝964,506×4.50＝【4,340,277円】。★③償還は【TTB＝仲値−手数料＝4.25−0.25＝4.00円】→償還額＝200万×4.00＝【8,000,000円】。償還差益＝8,000,000−4,340,277＝3,659,723円→税20%＝731,944円→税引後償還額＝【7,268,056円】。★④【税引後償還額÷投資額＝(1+r)^4】＝7,268,056÷4,340,277＝1.67456 →【4乗根＝電卓の√を2回】→1.1375…→r＝【約13.75%】。★誤答の型＝税を引き忘れる／TTSとTTBを逆にする／4乗根を取り忘れる。★個別論点は K57(価格算出)・K56(利回り逆算)・K14/K76(為替手数料と予約) に分解済み。**この問題はそれらを1本につなぐ練習**。",s:"2025-1 Q38（8/13に失点。P=100/(1+r)^n と 税引後償還額/投資額=(1+r)^n が出てこなかった）★Tier1／K56・K57の通し版／2026-08-13 新規"},
 {id:"K115",t:1,q:"【2025-2 Q15・株式数の逆算】期末総資産7,996,591百万円・時価ベースの自己資本比率37.98%（いずれも当期末の数値）。株価は当期末から2.8%値上がりして現在に至り、現在の配当利回りは1.80%、次期1株当たり配当は45円である。発行済株式数はおよそ何株か?",c:["約11.82億株","約12.15億株","約12.49億株","約1,249億株"],a:2,e:"★【4ステップ】①現在株価＝1株当たり配当÷配当利回り＝45円÷1.80%＝【2,500円】。②【期末株価に戻す】＝2,500÷1.028＝【2,431円】（期末から2.8%『値上がり』して現在なので割る）。③時価総額＝総資産×時価ベース自己資本比率＝7,996,591×37.98%＝【3,037,105百万円】。④株式数＝3,037,105百万円×10^6÷2,431円＝【約12.49億株】。★【最大の関門は②の時点合わせ】。比率の分母（総資産）が期末の数値なので、分子の時価総額も期末、したがって割る株価も【期末株価】でなければならない。★誤答の型＝11.82億株は2,500×1.028＝2,570円と値上がりの方向を逆にしたもの／12.15億株は現在株価2,500円をそのまま使ったもの／1,249億株は【百万円と円の単位を揃えなかった】もの。★検算＝当期1株配当42円×12.49億株÷当期純利益189,356百万円≒27.7%で『配当性向30%程度をめど』という方針と整合。桁を間違えていればここで破綻するので気づける。",s:"2025-2 Q15（本番演習で★勘で失点→2026-08-16のカレンダー復習で再失点＝2回連続）★Tier1／株式数の逆算パターン／2026-08-16 新規"},
 {id:"K116",t:1,q:"財務データから発行済株式数を逆算するとき、『時価ベースの自己資本比率（当期末）×総資産（当期末）』で求めた時価総額を割る株価は、どの時点のものを使うか?",c:["現在の株価","当期末の株価","当期首の株価","期中平均株価"],a:1,e:"★【比率の分母と分子は同じ時点でなければならない】。時価ベースの自己資本比率＝時価総額÷総資産で、総資産が当期末の数値なら時価総額も当期末。よって割る株価も【当期末の株価】。★現在株価しか与えられていない場合は【逆算して期末に戻す】＝『期末から◯%値上がりして現在の株価になった』なら現在株価÷(1+◯%)。方向を取り違えると株式数が狂い、EPS・BPSが全部ずれて選択肢を綺麗に外す。★【株式数は『隠し場所』から取り出す】＝直接与えられていなくても、①総資産×時価ベース自己資本比率÷期末株価 ②時価総額÷株価 ③自己資本÷BPS ④配当総額÷DPS ⑤当期純利益÷EPS のいずれかで必ず出せる。『株式数が無い』と焦らず、どこに隠れているかを探す。★出題側の狙いは【株式数を直接与えずに1株当たり指標を計算させること】。時価ベースの自己資本比率は、そのための『株式数の隠し場所』として使われている。",s:"2025-2 Q15の派生（時点合わせと株式数の隠し場所）★Tier1／2026-08-16 新規"},
 {id:"K117",t:1,q:"【2025-2 Q37の要点】分配金再投資型の投資信託を、2023年10月31日に708口、2024年10月31日に432口購入した。2024年7月10日に1口当たり0.20英ポンドの分配金が支払われた場合、再投資される口数は?（分配時の1口当たり純資産価格18.00英ポンド・1口未満切上げ）",c:["8口（708口分の分配金141.60ポンド÷18.00）","13口（1,140口分の分配金228.00ポンド÷18.00）","5口（432口分の分配金86.40ポンド÷18.00）","分配金は再投資されず現金で受け取る"],a:0,e:"★【分配金は『支払日時点で保有している口数』にしか付かない】。2024年7月10日の時点で保有しているのは2023年10月31日購入の【708口だけ】。2024年10月31日購入の432口は、分配日にはまだ保有していない。★708口×0.20ポンド＝141.60ポンド ÷ 18.00ポンド＝7.87口 →【1口未満切上げで8口】。★1,140口分（＝13口）としたものが、この設問で用意された誤答肢。**時系列を必ず紙に書いてから口数を掛ける**。★端数処理は設問の指示どおり＝【口数は切上げ】／英ポンドは小数点以下第3位四捨五入／円は円未満切捨て。処理の方向が項目ごとに違うので、計算前に3つとも印をつける。",s:"2025-2 Q37（全体は捨て問と判定。ただしこの論点だけは他の投信問題でも使うため抽出）★Tier1／2026-08-16 新規"}
